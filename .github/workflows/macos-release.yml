name: macOS Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built DMG as a GitHub release
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify on a fresh Apple Silicon runner
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0

      - name: Install Flutter 3.47.5
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install FFmpeg build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ffmpeg pkg-config
          prefix="$(brew --prefix ffmpeg)"
          echo "OR_FFMPEG_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Analyze and test the app
        working-directory: apps/or_app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Test the IPC and bridge contracts
        run: |
          cargo test -p or_ipc
          cargo test -p or_app_bridge --lib

      - name: Build the Apple Silicon disk image
        shell: bash
        run: |
          set -euo pipefail
          scripts/build_macos_dmg.sh
          ls -lh dist/*.dmg

      - name: Upload the disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencut-reinforced-macos-arm64
          path: dist/*.dmg
          retention-days: 14

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' apps/or_app/pubspec.yaml | head -1)"
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != v* ]]; then tag="v${version}"; fi
          dmg="$(ls dist/*.dmg | head -1)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$dmg" --clobber
          else
            gh release create "$tag" "$dmg" \
              --title "Opencut Reinforced $version" \
              --notes "Apple Silicon macOS build. Drag the app to Applications, then right-click it once and choose Open. No terminal or separate setup is required; the assistant workspace is installed on first launch and companion engines can be downloaded inside the app."
          fi
