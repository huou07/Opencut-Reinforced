name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: scripts/check_claims.py resolves every claim record's
          # implementation_sha with `git cat-file` and `git merge-base
          # --is-ancestor HEAD`, which a shallow clone cannot answer.
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository checks
        run: bash scripts/check-repo.sh
