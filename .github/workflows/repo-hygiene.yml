name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: scripts/check_claims.py resolves every claim record's
          # implementation_sha with `git cat-file` and `git merge-base
          # --is-ancestor HEAD`, which a shallow clone cannot answer.
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository checks
        run: bash scripts/check-repo.sh

      - name: Scan history for secrets with a pinned gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          # Pinned release, verified by SHA-256 before it is executed. The digest
          # comes from the release's own checksums file and the GitHub API asset
          # digest, and matches `gitleaks_8.30.1_checksums.txt`.
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          ./gitleaks version
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
