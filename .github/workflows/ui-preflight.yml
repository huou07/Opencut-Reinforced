name: Linux UI preflight

on:
  pull_request:
    paths:
      - 'apps/or_app/**'
      - 'packages/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'scripts/run_linux_ui_preflight.py'
      - '.github/workflows/ui-preflight.yml'
  push:
    branches: ['feat/**', 'codex/**']
    paths:
      - 'apps/or_app/**'
      - 'packages/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'scripts/run_linux_ui_preflight.py'
      - '.github/workflows/ui-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ui-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev ffmpeg xvfb xauth
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.0
      - name: Install exact canonical Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked Flutter dependencies
        working-directory: apps/or_app
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Analyze and check semantic/component regressions
        working-directory: apps/or_app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 test/widget_test.dart --name 'timeline clip exposes|timeline duplicate preserves|timeline selection supports|the mobile tool dock|the empty timeline names|importing media announces|short compact viewport editor does not overflow'
      - name: Run real Linux editor journey under bounded Xvfb
        run: python3 scripts/run_linux_ui_preflight.py
      - name: Retain canonical states and native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-ui-preflight
          path: apps/or_app/build/ui-preflight/
          retention-days: 7
          if-no-files-found: ignore
