name: Developer Preview

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: developer-preview-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify source and release eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      should_publish: ${{ steps.prepare.outputs.should_publish }}
      tag: ${{ steps.prepare.outputs.tag }}
      short_sha: ${{ steps.prepare.outputs.short_sha }}
      platform_run_id: ${{ steps.prepare.outputs.platform_run_id }}
    steps:
      - name: Select release or validation-only candidate mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" && \
                ("$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch") ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/* && \
                  "$GITHUB_REF" != "refs/heads/main" && \
                  "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=candidate" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Only main may publish; validation-only packages require manual dispatch on a branch (received $GITHUB_EVENT_NAME at $GITHUB_REF)."
            exit 1
          fi

      - name: Skip duplicate releases and require exact-commit platform verification
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:12}"
          tag="dev-${short_sha}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [[ "$RUN_MODE" == release ]]; then
            set +e
            release_response="$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>&1)"
            release_status=$?
            set -e

            if [[ "$release_status" -eq 0 ]]; then
              echo "A Developer Preview already exists for ${GITHUB_SHA} (${tag}); skipping duplicate builds."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            http_status="$(printf '%s\n' "$release_response" | sed -nE 's#^HTTP/[0-9.]+ ([0-9]{3}).*#\1#p' | tail -n 1)"
            if [[ "$http_status" != "404" ]]; then
              echo "::error::Could not check whether release ${tag} exists (GitHub API status ${http_status:-unknown})."
              exit 1
            fi
            platform_branch=main
            platform_event=push
          elif [[ "$RUN_MODE" == candidate && "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/* ]]; then
            platform_branch="$GITHUB_REF_NAME"
            platform_event=pull_request
          else
            echo "::error::Unsupported Developer Preview build mode."
            exit 1
          fi

          runs_file="$RUNNER_TEMP/platform-verification-runs.json"
          gh api \
            --method GET \
            -F "head_sha=${GITHUB_SHA}" \
            -F "branch=${platform_branch}" \
            -F "event=${platform_event}" \
            -F per_page=100 \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/platform-verification.yml/runs" \
            > "$runs_file"

          platform_run_id="$(jq -r --arg sha "$GITHUB_SHA" --arg branch "$platform_branch" --arg event "$platform_event" \
            '[.workflow_runs[]? | select(.head_sha == $sha and .head_branch == $branch and .event == $event and .status == "completed" and .conclusion == "success")][0].id // empty' \
            "$runs_file")"
          if [[ -z "$platform_run_id" ]]; then
            echo "::error::Developer Preview requires a completed successful ${platform_event} Platform verification run for this exact branch and commit (${platform_branch} / ${GITHUB_SHA})."
            exit 1
          fi

          echo "platform_run_id=${platform_run_id}" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          if [[ "$RUN_MODE" == release && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Validation-only Developer Preview candidate"
              echo
              echo "Source: \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`. Exact-commit Platform Verification: [run ${platform_run_id}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${platform_run_id})."
              echo "This run cannot create a release or tag. The four app packages are temporary Actions artifacts with seven-day retention for direct dogfooding."
              echo
              echo "Try the ordinary journey: install for your OS, create a project, import real video and audio, preview and revise a clip, add a title or manual caption, save/close/reopen, then export and play the result independently. On desktop, test English transcription only after confirming the optional model download; review/edit captions before applying and save/export SRT. Android transcription is unsupported."
              echo
              echo "Report OS/device, source format/duration, confusing steps, export time, and output playback through the [bug report form](https://github.com/huou07/Opencut-Reinforced/issues/new?template=bug_report.yml). Do not send private media."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-macos:
    name: Build macOS debug app
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Build pinned local transcription runtime
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/whisper.cpp-1.9.4"
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git "$source"
          test "$(git -C "$source" rev-parse HEAD)" = 927cfce34f31707e17f2bff35c349632fb9e2c3a
          cmake -S "$source" -B "$source/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF
          cmake --build "$source/build" --config Release --target whisper-cli -j 2
          cargo build --locked --release -p or_whisper_provider
          "$source/build/bin/whisper-cli" --version

      - name: Install Flutter 3.47.5
        shell: bash
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Download the verified macOS FFmpeg build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-8.1.3-macos
          run-id: ${{ needs.prepare.outputs.platform_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ffmpeg-verification

      - name: Restore the verified FFmpeg build environment
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/ffmpeg-verification"
          prefix="$RUNNER_TEMP/ffmpeg-8.1.3-install"
          cp "$artifact/ffmpeg-8.1.3.tar.xz" "$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          cp "$artifact/FFmpeg-COPYING.LGPLv2.1" "$RUNNER_TEMP/FFmpeg-COPYING.LGPLv2.1"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $RUNNER_TEMP/ffmpeg-8.1.3.tar.xz" | shasum -a 512 --check
          xz --test "$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          tar -xzf "$artifact/ffmpeg-8.1.3-install.tar.gz" -C "$RUNNER_TEMP"
          python3 - "$prefix" <<'PY'
          from pathlib import Path
          import re
          import sys

          prefix = sys.argv[1]
          for path in (Path(prefix) / "lib/pkgconfig").glob("*.pc"):
              text = path.read_text(encoding="utf-8")
              text, count = re.subn(r"(?m)^prefix=.*$", f"prefix={prefix}", text, count=1)
              if count != 1:
                  raise SystemExit(f"Missing prefix in {path}")
              path.write_text(text, encoding="utf-8")
          PY
          for library in avcodec avformat avutil swresample swscale; do
            test -f "$prefix/lib/pkgconfig/lib$library.pc"
          done
          mkdir -p "$HOME/.cargo"
          cat > "$HOME/.cargo/config.toml" <<EOF
          [env]
          FFMPEG_DIR = { value = "$prefix", force = true }
          PKG_CONFIG_PATH = { value = "$prefix/lib/pkgconfig", force = true }
          EOF
          echo "FFMPEG_INSTALL_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build macOS debug app without production signing
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_IDENTITY: ""
        run: flutter build macos --debug

      - name: Package FFmpeg runtime libraries and LGPL notices
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/apps/or_app/build/macos/Build/Products/Debug/or_app.app"
          bridge="$app/Contents/Frameworks/or_app_bridge.framework/Versions/A/or_app_bridge"
          runtime_dir="$(dirname "$bridge")"
          echo "FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR=$runtime_dir" >> "$GITHUB_ENV"
          frameworks="$app/Contents/Frameworks"
          notices="$app/Contents/Resources/ThirdPartyNotices/FFmpeg"
          test -f "$bridge"
          mkdir -p "$frameworks" "$notices"
          for pattern in libavcodec*.dylib libavformat*.dylib libavutil*.dylib libswresample*.dylib libswscale*.dylib; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$frameworks/"
          done
          if ! otool -l "$bridge" | grep -Fq '@loader_path'; then
            install_name_tool -add_rpath @loader_path "$bridge"
          fi
          for library in "$runtime_dir"/libav*.dylib "$runtime_dir"/libsw*.dylib; do
            if [ -L "$library" ]; then continue; fi
            if ! otool -l "$library" | grep -Fq '@loader_path'; then
              install_name_tool -add_rpath @loader_path "$library"
            fi
          done
          # 9B1 packaged media helpers live beside the app binary, which is the
          # packaged-first resolution root. libavfilter travels with them.
          helpers="$app/Contents/MacOS"
          install -m 755 "$FFMPEG_INSTALL_PREFIX/bin/ffmpeg" "$helpers/ffmpeg"
          install -m 755 "$FFMPEG_INSTALL_PREFIX/bin/ffprobe" "$helpers/ffprobe"
          install -m 755 "$RUNNER_TEMP/whisper.cpp-1.9.4/build/bin/whisper-cli" "$helpers/whisper-cli"
          install -m 755 "$GITHUB_WORKSPACE/target/release/or-whisper-provider" "$helpers/or-whisper-provider"
          whisper_notices="$app/Contents/Resources/ThirdPartyNotices/whisper.cpp"
          mkdir -p "$whisper_notices"
          cp "$RUNNER_TEMP/whisper.cpp-1.9.4/LICENSE" "$whisper_notices/LICENSE"
          cat > "$whisper_notices/NOTICE.txt" <<'EOF'
          whisper.cpp v1.9.4 (commit 927cfce34f31707e17f2bff35c349632fb9e2c3a)
          is distributed under the included MIT license. The whisper-cli helper
          is built from that source using the pinned Release configuration; the OR
          provider adapter is built from this repository. Model weights are not
          bundled and are downloaded only after user confirmation.
          EOF
          "$helpers/whisper-cli" --version
          test -x "$helpers/or-whisper-provider"
          test -s "$whisper_notices/LICENSE"
          for pattern in libavfilter*.dylib; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$frameworks/"
          done
          for library in "$runtime_dir"/libavfilter*.dylib; do
            if [ -L "$library" ]; then continue; fi
            if ! otool -l "$library" | grep -Fq '@loader_path'; then
              install_name_tool -add_rpath @loader_path "$library"
            fi
          done
          for helper in "$helpers/ffmpeg" "$helpers/ffprobe"; do
            install_name_tool -add_rpath @loader_path/../Frameworks "$helper"
          done
          cp "$RUNNER_TEMP/ffmpeg-verification/FFmpeg-COPYING.LGPLv2.1" "$notices/COPYING.LGPLv2.1"
          opus_notices="$app/Contents/Resources/ThirdPartyNotices/Opus"
          vpx_notices="$app/Contents/Resources/ThirdPartyNotices/libvpx"
          mkdir -p "$opus_notices" "$vpx_notices"
          codec_notices="$RUNNER_TEMP/ffmpeg-verification/desktop-export-codecs"
          cp "$codec_notices/OPUS-COPYING" "$opus_notices/COPYING"
          cp "$codec_notices/LIBVPX-LICENSE" "$vpx_notices/LICENSE"
          cp "$codec_notices/LIBVPX-PATENTS" "$vpx_notices/PATENTS"
          cat > "$notices/FFmpeg-NOTICE.txt" <<'EOF'
          This application dynamically links FFmpeg 8.1.3 under LGPL-2.1-or-later.
          The corresponding FFmpeg source archive and exact build configuration
          are distributed as Developer Preview release assets. FFmpeg libraries
          are separate files in Contents/Frameworks and may be replaced with a
          compatible LGPL-compliant build under the applicable license terms.
          The ffmpeg and ffprobe programs beside the application binary are built
          from the same source and configuration for import, media previews,
          and WebM export. FFmpeg's WebM export links libvpx and libopus
          statically; their licenses and the libvpx patent notice are included
          in the adjacent Opus and libvpx directories.
          EOF
          codesign --force --deep --sign - --timestamp=none "$app"

      - name: Verify packaged local transcription user journey
        timeout-minutes: 20
        working-directory: apps/or_app
        env:
          OR_TEST_TRANSCRIPTION_MEDIA_PATH: ${{ runner.temp }}/whisper.cpp-1.9.4/samples/jfk.wav
        run: >-
          flutter --ci test integration_test/core_bridge_test.dart -d macos
          --plain-name
          "packaged local transcription reviews and persists real captions"

      - name: Re-sign macOS app after runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/apps/or_app/build/macos/Build/Products/Debug/or_app.app"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"

      - name: Package complete app bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import os

          products = pathlib.Path("apps/or_app/build/macos/Build/Products/Debug")
          bundles = sorted(path for path in products.rglob("*.app") if path.is_dir())
          if len(bundles) != 1:
              raise SystemExit(f"Expected one .app bundle under {products}, found {len(bundles)}")

          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opencut-reinforced-macos-debug.zip"
          subprocess.run(
              ["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", str(bundles[0]), str(archive)],
              check=True,
          )
          if archive.stat().st_size == 0:
              raise SystemExit("macOS debug archive is empty")
          PY

      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-macos
          path: ${{ runner.temp }}/opencut-reinforced-macos-debug.zip
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64 debug app
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Set up MSYS2 FFmpeg build tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          path-type: inherit
          update: true
          install: make pkgconf
          pacboy: clang:p

      - name: Build pinned local transcription runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'whisper.cpp-1.9.4'
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git $source
          if ((git -C $source rev-parse HEAD).Trim() -ne '927cfce34f31707e17f2bff35c349632fb9e2c3a') { throw 'whisper.cpp revision mismatch' }
          $build = Join-Path $source 'build'
          cmake -S $source -B $build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_STATIC=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'whisper.cpp CMake configure failed' }
          cmake --build $build --config Release --target whisper-cli --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'whisper.cpp build failed' }
          cargo build --locked --release -p or_whisper_provider
          if ($LASTEXITCODE -ne 0) { throw 'OR transcription provider build failed' }
          $whisperCli = Get-ChildItem -Path (Join-Path $build 'bin') -Filter 'whisper-cli.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $whisperCli) { throw 'whisper-cli.exe was not produced' }
          & $whisperCli.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'whisper-cli smoke check failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "WHISPER_CLI_PATH=$($whisperCli.FullName)"

      - name: Install Flutter 3.47.5
        shell: pwsh
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ((git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD).Trim() -ne "6a19cca56475dbfba1478ee68d7bd0c2ef891da1") { throw "Flutter revision mismatch" }
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version

      - name: Download the verified Windows FFmpeg build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-8.1.3-windows-x64
          run-id: ${{ needs.prepare.outputs.platform_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ffmpeg-verification

      - name: Restore the verified FFmpeg build environment
        shell: msys2 {0}
        run: |
          set -euo pipefail
          temp="$(cygpath -u "$RUNNER_TEMP")"
          artifact="$temp/ffmpeg-verification"
          prefix="$temp/ffmpeg-8.1.3-install"
          prefix_win="$(cygpath -am "$prefix")"
          archive="$temp/ffmpeg-8.1.3.tar.xz"
          cp "$artifact/ffmpeg-8.1.3.tar.xz" "$archive"
          cp "$artifact/FFmpeg-COPYING.LGPLv2.1" "$temp/FFmpeg-COPYING.LGPLv2.1"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $archive" | sha512sum --check
          xz --test "$archive"
          tar -xzf "$artifact/ffmpeg-8.1.3-install.tar.gz" -C "$temp"
          python3 - "$prefix/lib/pkgconfig" "$prefix_win" <<'PY'
          from pathlib import Path
          import re
          import sys

          pkgconfig_dir, prefix = sys.argv[1:]
          for path in Path(pkgconfig_dir).glob("*.pc"):
              text = path.read_text(encoding="utf-8")
              text, count = re.subn(r"(?m)^prefix=.*$", f"prefix={prefix}", text, count=1)
              if count != 1:
                  raise SystemExit(f"Missing prefix in {path}")
              path.write_text(text, encoding="utf-8")
          PY
          libclang_path="$(cygpath -am /clang64/bin)"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          mkdir -p "$workspace/.cargo"
          cat > "$workspace/.cargo/config.toml" <<EOF
          [env]
          FFMPEG_DIR = { value = "$prefix_win", force = true }
          PKG_CONFIG_PATH = { value = "$prefix_win/lib/pkgconfig", force = true }
          LIBCLANG_PATH = { value = "$libclang_path", force = true }
          EOF
          echo "FFMPEG_INSTALL_PREFIX=$prefix_win" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"
          echo "INCLUDE=$prefix_win/include;$INCLUDE" >> "$GITHUB_ENV"
          echo "LIB=$prefix_win/lib;$prefix_win/bin;$LIB" >> "$GITHUB_ENV"
          echo "$prefix_win/bin" >> "$GITHUB_PATH"
          echo "$libclang_path" >> "$GITHUB_PATH"

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build Windows x64 debug app
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: flutter build windows --debug

      - name: Package FFmpeg runtime DLLs and LGPL notices
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'apps/or_app/build/windows/x64/runner/Debug'
          if (-not (Test-Path -LiteralPath $bundle -PathType Container)) { throw 'Windows app bundle directory not found' }
          $bridge = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'apps/or_app/build/windows') -Filter '*or_app_bridge*.dll' -Recurse | Select-Object -First 1
          if ($null -eq $bridge) { throw 'Packaged or_app_bridge DLL not found' }
          Add-Content -Path $env:GITHUB_ENV -Value "FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR=$($bridge.Directory.FullName)"
          $destinations = @($bridge.Directory.FullName)
          if ($destinations[0] -ne $bundle) { $destinations += $bundle }
          foreach ($pattern in @('avcodec*.dll', 'avformat*.dll', 'avutil*.dll', 'swresample*.dll', 'swscale*.dll', 'avfilter*.dll')) {
            $libraries = Get-ChildItem -Path (Join-Path $env:FFMPEG_INSTALL_PREFIX 'bin') -Filter $pattern -File
            if ($libraries.Count -eq 0) { throw "FFmpeg runtime library missing: $pattern" }
            foreach ($destination in $destinations) {
              Copy-Item -Path $libraries.FullName -Destination $destination -Force
            }
          }
          # 9B1 packaged media helpers live beside the app binary; zlib is
          # statically linked into the helper executables.
          foreach ($helper in @('ffmpeg.exe', 'ffprobe.exe')) {
            $source = Join-Path (Join-Path $env:FFMPEG_INSTALL_PREFIX 'bin') $helper
            if (-not (Test-Path $source -PathType Leaf)) { throw "FFmpeg helper missing: $helper" }
            Copy-Item -Path $source -Destination $bundle -Force
          }
          Copy-Item -LiteralPath $env:WHISPER_CLI_PATH -Destination (Join-Path $bundle 'whisper-cli.exe') -Force
          $provider = Join-Path $env:GITHUB_WORKSPACE 'target/release/or-whisper-provider.exe'
          if (-not (Test-Path -LiteralPath $provider -PathType Leaf)) { throw 'OR transcription provider executable missing' }
          Copy-Item -LiteralPath $provider -Destination (Join-Path $bundle 'or-whisper-provider.exe') -Force
          $whisperNotices = Join-Path $bundle 'licenses/whisper.cpp'
          New-Item -ItemType Directory -Force -Path $whisperNotices | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'whisper.cpp-1.9.4/LICENSE') (Join-Path $whisperNotices 'LICENSE')
          @'
          whisper.cpp v1.9.4 (commit 927cfce34f31707e17f2bff35c349632fb9e2c3a)
          is distributed under the included MIT license. The whisper-cli helper
          is built from that source using the pinned Release configuration; the OR
          provider adapter is built from this repository. Model weights are not
          bundled and are downloaded only after user confirmation.
          '@ | Set-Content -LiteralPath (Join-Path $whisperNotices 'NOTICE.txt') -Encoding utf8
          $savedPath = $env:PATH
          Push-Location $bundle
          try {
            $env:PATH = "$bundle;$env:SystemRoot\System32"
            & '.\whisper-cli.exe' --version
          }
          finally {
            Pop-Location
            $env:PATH = $savedPath
          }
          if ($LASTEXITCODE -ne 0) { throw 'Packaged whisper-cli smoke check failed' }
          if (-not (Test-Path (Join-Path $bundle 'or-whisper-provider.exe') -PathType Leaf)) { throw 'Packaged transcription provider missing' }
          $notices = Join-Path $bundle 'licenses/FFmpeg'
          New-Item -ItemType Directory -Force -Path $notices | Out-Null
          $zlibLicense = Join-Path $env:FFMPEG_INSTALL_PREFIX 'ZLIB-LICENSE.txt'
          if (-not (Test-Path $zlibLicense -PathType Leaf)) { throw 'zlib license text missing beside the helpers' }
          Copy-Item -Path $zlibLicense -Destination (Join-Path $notices 'ZLIB-LICENSE.txt') -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'ffmpeg-verification/FFmpeg-COPYING.LGPLv2.1') (Join-Path $notices 'COPYING.LGPLv2.1')
          $opusNotices = Join-Path $bundle 'licenses/Opus'
          $vpxNotices = Join-Path $bundle 'licenses/libvpx'
          New-Item -ItemType Directory -Force -Path $opusNotices, $vpxNotices | Out-Null
          $codecNotices = Join-Path $env:RUNNER_TEMP 'ffmpeg-verification/desktop-export-codecs'
          Copy-Item (Join-Path $codecNotices 'OPUS-COPYING') (Join-Path $opusNotices 'COPYING')
          Copy-Item (Join-Path $codecNotices 'LIBVPX-LICENSE') (Join-Path $vpxNotices 'LICENSE')
          Copy-Item (Join-Path $codecNotices 'LIBVPX-PATENTS') (Join-Path $vpxNotices 'PATENTS')
          @'
          This application dynamically links FFmpeg 8.1.3 under LGPL-2.1-or-later.
          The corresponding FFmpeg source archive and exact build configuration
          are distributed as Developer Preview release assets. FFmpeg DLLs are
          separate files beside the application and may be replaced with a
          compatible LGPL-compliant build under the applicable license terms.
          The ffmpeg.exe and ffprobe.exe programs beside the application are built
          from the same source and configuration for import, media previews,
          and WebM export. FFmpeg's WebM export statically links libvpx and
          libopus; their licenses and the libvpx patent notice are included in
          the adjacent Opus and libvpx directories.
          the Windows ffmpeg.exe helper statically links zlib 1.3.2; its license
          is included in ZLIB-LICENSE.txt.
          '@ | Set-Content -LiteralPath (Join-Path $notices 'FFmpeg-NOTICE.txt') -Encoding utf8
          $env:PATH = "$($destinations -join ';');$env:SystemRoot\System32;$env:SystemRoot"
          $bridgeHandle = [System.Runtime.InteropServices.NativeLibrary]::Load($bridge.FullName)
          [System.Runtime.InteropServices.NativeLibrary]::Free($bridgeHandle)

      - name: Verify packaged local transcription user journey
        timeout-minutes: 20
        working-directory: apps/or_app
        env:
          OR_TEST_TRANSCRIPTION_MEDIA_PATH: ${{ runner.temp }}/whisper.cpp-1.9.4/samples/jfk.wav
        shell: pwsh
        run: |
          flutter --ci test integration_test/core_bridge_test.dart -d windows --plain-name "packaged local transcription reviews and persists real captions"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged local transcription user journey failed' }

      - name: Package complete Debug output directory
        shell: pwsh
        run: |
          $buildOutput = Join-Path $env:GITHUB_WORKSPACE "apps/or_app/build/windows/x64/runner/Debug"
          $archive = Join-Path $env:RUNNER_TEMP "opencut-reinforced-windows-x64-debug.zip"
          if (-not (Test-Path -LiteralPath $buildOutput -PathType Container)) { throw "Windows Debug output directory not found: $buildOutput" }
          if (-not (Get-ChildItem -LiteralPath $buildOutput -Filter "*.exe" -File)) { throw "Windows Debug output has no executable" }
          Compress-Archive -LiteralPath $buildOutput -DestinationPath $archive -CompressionLevel Optimal
          if ((Get-Item -LiteralPath $archive).Length -eq 0) { throw "Windows debug archive is empty" }

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-windows
          path: ${{ runner.temp }}/opencut-reinforced-windows-x64-debug.zip
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux x64 debug app
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Flutter Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libclang-dev libgtk-3-dev liblzma-dev libasound2-dev patchelf xvfb xauth

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Build pinned local transcription runtime
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/whisper.cpp-1.9.4"
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git "$source"
          test "$(git -C "$source" rev-parse HEAD)" = 927cfce34f31707e17f2bff35c349632fb9e2c3a
          cmake -S "$source" -B "$source/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF
          cmake --build "$source/build" --config Release --target whisper-cli -j 2
          cargo build --locked --release -p or_whisper_provider
          "$source/build/bin/whisper-cli" --version

      - name: Install Flutter 3.47.5
        shell: bash
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Download the verified Linux FFmpeg build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-8.1.3-linux
          run-id: ${{ needs.prepare.outputs.platform_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ffmpeg-verification

      - name: Restore the verified FFmpeg build environment
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/ffmpeg-verification"
          prefix="$RUNNER_TEMP/ffmpeg-8.1.3-install"
          cp "$artifact/ffmpeg-8.1.3.tar.xz" "$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          cp "$artifact/FFmpeg-COPYING.LGPLv2.1" "$RUNNER_TEMP/FFmpeg-COPYING.LGPLv2.1"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $RUNNER_TEMP/ffmpeg-8.1.3.tar.xz" | sha512sum --check
          xz --test "$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          tar -xzf "$artifact/ffmpeg-8.1.3-install.tar.gz" -C "$RUNNER_TEMP"
          python3 - "$prefix" <<'PY'
          from pathlib import Path
          import re
          import sys

          prefix = sys.argv[1]
          for path in (Path(prefix) / "lib/pkgconfig").glob("*.pc"):
              text = path.read_text(encoding="utf-8")
              text, count = re.subn(r"(?m)^prefix=.*$", f"prefix={prefix}", text, count=1)
              if count != 1:
                  raise SystemExit(f"Missing prefix in {path}")
              path.write_text(text, encoding="utf-8")
          PY
          for library in avcodec avformat avutil swresample swscale; do
            test -f "$prefix/lib/pkgconfig/lib$library.pc"
          done
          mkdir -p "$HOME/.cargo"
          cat > "$HOME/.cargo/config.toml" <<EOF
          [build]
          rustflags = ["-C", "link-arg=-Wl,-rpath,\$ORIGIN"]

          [env]
          FFMPEG_DIR = { value = "$prefix", force = true }
          PKG_CONFIG_PATH = { value = "$prefix/lib/pkgconfig", force = true }
          EOF
          echo "FFMPEG_INSTALL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Seed Linux packaged media runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/or-packaged-transcription-runtime"
          prefix="$FFMPEG_INSTALL_PREFIX"
          whisper="$RUNNER_TEMP/whisper.cpp-1.9.4"
          codec_notices="$RUNNER_TEMP/ffmpeg-verification/desktop-export-codecs"
          rm -rf "$runtime"
          mkdir -p "$runtime/lib" "$runtime/licenses/whisper.cpp" \
            "$runtime/licenses/FFmpeg" "$runtime/licenses/Opus" \
            "$runtime/licenses/libvpx"
          for pattern in libavcodec.so* libavfilter.so* libavformat.so* libavutil.so* libswresample.so* libswscale.so*; do
            cp -a "$prefix/lib/"$pattern "$runtime/lib/"
          done
          install -m 755 "$prefix/bin/ffmpeg" "$runtime/ffmpeg"
          install -m 755 "$prefix/bin/ffprobe" "$runtime/ffprobe"
          install -m 755 "$whisper/build/bin/whisper-cli" "$runtime/whisper-cli"
          install -m 755 "$GITHUB_WORKSPACE/target/release/or-whisper-provider" "$runtime/or-whisper-provider"
          for library in "$runtime"/lib/libav*.so* "$runtime"/lib/libsw*.so*; do
            if [ -L "$library" ]; then continue; fi
            patchelf --set-rpath '$ORIGIN' "$library"
          done
          helper_rpath='$ORIGIN/lib'
          patchelf --set-rpath "$helper_rpath" "$runtime/ffmpeg" "$runtime/ffprobe"
          readelf -d "$runtime/ffmpeg" | grep -F "$helper_rpath"
          cp "$whisper/LICENSE" "$runtime/licenses/whisper.cpp/LICENSE"
          cat > "$runtime/licenses/whisper.cpp/NOTICE.txt" <<'EOF'
          whisper.cpp v1.9.4 (commit 927cfce34f31707e17f2bff35c349632fb9e2c3a)
          is distributed under the included MIT license. The whisper-cli helper
          is built from that source using the pinned Release configuration; the OR
          provider adapter is built from this repository. Model weights are not
          bundled and are downloaded only after user confirmation.
          EOF
          cp "$RUNNER_TEMP/ffmpeg-verification/FFmpeg-COPYING.LGPLv2.1" "$runtime/licenses/FFmpeg/COPYING.LGPLv2.1"
          cp "$codec_notices/OPUS-COPYING" "$runtime/licenses/Opus/COPYING"
          cp "$codec_notices/LIBVPX-LICENSE" "$runtime/licenses/libvpx/LICENSE"
          cp "$codec_notices/LIBVPX-PATENTS" "$runtime/licenses/libvpx/PATENTS"
          cat > "$runtime/licenses/FFmpeg/FFmpeg-NOTICE.txt" <<'EOF'
          This application dynamically links FFmpeg 8.1.3 under LGPL-2.1-or-later.
          The corresponding FFmpeg source archive and exact build configuration
          are distributed as Developer Preview release assets. FFmpeg shared
          libraries are separate files beside the Rust bridge and may be replaced
          with a compatible LGPL-compliant build under the applicable license terms.
          The ffmpeg and ffprobe programs beside the application binary are built
          from the same source and configuration for import, media previews,
          and WebM export. FFmpeg's WebM export statically links libvpx and
          libopus; their licenses and the libvpx patent notice are included in
          the adjacent Opus and libvpx directories.
          EOF
          "$runtime/whisper-cli" --version
          test -x "$runtime/or-whisper-provider"
          echo "OR_PACKAGED_MEDIA_RUNTIME_DIRECTORY=$runtime" >> "$GITHUB_ENV"

      - name: Build Linux x64 debug app
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          LD_LIBRARY_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
          OR_PACKAGED_MEDIA_RUNTIME_DIRECTORY: ${{ runner.temp }}/or-packaged-transcription-runtime
        run: flutter build linux --debug

      - name: Package FFmpeg runtime libraries and LGPL notices
        shell: bash
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/apps/or_app/build/linux/x64/debug/bundle"
          bridge="$(find "$bundle" -type f -name '*or_app_bridge*.so' -print -quit)"
          test -n "$bridge"
          runtime_dir="$(dirname "$bridge")"
          echo "FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR=$runtime_dir" >> "$GITHUB_ENV"
          for pattern in libavcodec.so* libavformat.so* libavutil.so* libswresample.so* libswscale.so*; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
          done
          # 9B1 packaged media helpers live beside the app binary, which is the
          # packaged-first resolution root. libavfilter travels with them.
          helpers="$bundle"
          install -m 755 "$FFMPEG_INSTALL_PREFIX/bin/ffmpeg" "$helpers/ffmpeg"
          install -m 755 "$FFMPEG_INSTALL_PREFIX/bin/ffprobe" "$helpers/ffprobe"
          install -m 755 "$RUNNER_TEMP/whisper.cpp-1.9.4/build/bin/whisper-cli" "$helpers/whisper-cli"
          install -m 755 "$GITHUB_WORKSPACE/target/release/or-whisper-provider" "$helpers/or-whisper-provider"
          whisper_notices="$bundle/licenses/whisper.cpp"
          mkdir -p "$whisper_notices"
          cp "$RUNNER_TEMP/whisper.cpp-1.9.4/LICENSE" "$whisper_notices/LICENSE"
          cat > "$whisper_notices/NOTICE.txt" <<'EOF'
          whisper.cpp v1.9.4 (commit 927cfce34f31707e17f2bff35c349632fb9e2c3a)
          is distributed under the included MIT license. The whisper-cli helper
          is built from that source using the pinned Release configuration; the OR
          provider adapter is built from this repository. Model weights are not
          bundled and are downloaded only after user confirmation.
          EOF
          "$helpers/whisper-cli" --version
          test -x "$helpers/or-whisper-provider"
          test -s "$whisper_notices/LICENSE"
          for pattern in libavfilter.so*; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
          done
          for library in "$runtime_dir"/libav*.so* "$runtime_dir"/libsw*.so*; do
            if [ -L "$library" ]; then continue; fi
            patchelf --set-rpath '$ORIGIN' "$library"
          done
          helper_rpath='$ORIGIN/'"$(realpath --relative-to="$helpers" "$runtime_dir")"
          patchelf --set-rpath "$helper_rpath" "$helpers/ffmpeg" "$helpers/ffprobe"
          readelf -d "$helpers/ffmpeg" | grep -F "$helper_rpath"
          notices="$bundle/licenses/FFmpeg"
          mkdir -p "$notices"
          cp "$RUNNER_TEMP/ffmpeg-verification/FFmpeg-COPYING.LGPLv2.1" "$notices/COPYING.LGPLv2.1"
          opus_notices="$bundle/licenses/Opus"
          vpx_notices="$bundle/licenses/libvpx"
          mkdir -p "$opus_notices" "$vpx_notices"
          codec_notices="$RUNNER_TEMP/ffmpeg-verification/desktop-export-codecs"
          cp "$codec_notices/OPUS-COPYING" "$opus_notices/COPYING"
          cp "$codec_notices/LIBVPX-LICENSE" "$vpx_notices/LICENSE"
          cp "$codec_notices/LIBVPX-PATENTS" "$vpx_notices/PATENTS"
          cat > "$notices/FFmpeg-NOTICE.txt" <<'EOF'
          This application dynamically links FFmpeg 8.1.3 under LGPL-2.1-or-later.
          The corresponding FFmpeg source archive and exact build configuration
          are distributed as Developer Preview release assets. FFmpeg shared
          libraries are separate files beside the Rust bridge and may be replaced
          with a compatible LGPL-compliant build under the applicable license terms.
          The ffmpeg and ffprobe programs beside the application binary are built
          from the same source and configuration for import, media previews,
          and WebM export. FFmpeg's WebM export statically links libvpx and
          libopus; their licenses and the libvpx patent notice are included in
          the adjacent Opus and libvpx directories.
          EOF
          env -u LD_LIBRARY_PATH python3 - "$bridge" <<'PY'
          import ctypes
          import sys

          ctypes.CDLL(sys.argv[1])
          PY
          runtime="$RUNNER_TEMP/or-packaged-transcription-runtime"
          rm -rf "$runtime"
          mkdir -p "$runtime/lib"
          for library in "$runtime_dir"/libav*.so* "$runtime_dir"/libsw*.so*; do
            cp -a "$library" "$runtime/lib/"
          done
          install -m 755 "$bundle/ffmpeg" "$runtime/ffmpeg"
          install -m 755 "$bundle/ffprobe" "$runtime/ffprobe"
          install -m 755 "$bundle/whisper-cli" "$runtime/whisper-cli"
          install -m 755 "$bundle/or-whisper-provider" "$runtime/or-whisper-provider"
          cp -a "$bundle/licenses" "$runtime/licenses"
          test -s "$runtime/licenses/whisper.cpp/LICENSE"
          echo "OR_PACKAGED_MEDIA_RUNTIME_DIRECTORY=$runtime" >> "$GITHUB_ENV"

      - name: Verify packaged local transcription user journey
        timeout-minutes: 20
        working-directory: apps/or_app
        env:
          OR_TEST_TRANSCRIPTION_MEDIA_PATH: ${{ runner.temp }}/whisper.cpp-1.9.4/samples/jfk.wav
        run: >-
          xvfb-run -a flutter --ci test integration_test/core_bridge_test.dart -d linux
          --plain-name
          "packaged local transcription reviews and persists real captions"

      - name: Package complete Linux bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="apps/or_app/build/linux/x64/debug/bundle"
          test -d "$bundle"
          test -n "$(find "$bundle" -mindepth 1 -maxdepth 1 -print -quit)"
          tar -czf "$RUNNER_TEMP/opencut-reinforced-linux-x64-debug.tar.gz" -C "$(dirname "$bundle")" "$(basename "$bundle")"
          test -s "$RUNNER_TEMP/opencut-reinforced-linux-x64-debug.tar.gz"

      - name: Upload Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-linux
          path: ${{ runner.temp }}/opencut-reinforced-linux-x64-debug.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android debug APK
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android platform and Rust NDK
        run: >-
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          "ndk;28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Flutter 3.47.5
        shell: bash
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Download the verified Android FFmpeg build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-8.1.3-android
          run-id: ${{ needs.prepare.outputs.platform_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/android-ffmpeg-verification

      - name: Stage Android export codec notices in the installable package
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/android-ffmpeg-verification/android-export-codecs"
          asset_root="$GITHUB_WORKSPACE/apps/or_app/android/app/src/main/assets/open-source"
          mkdir -p "$asset_root"
          install -m 644 "$RUNNER_TEMP/android-ffmpeg-verification/FFmpeg-COPYING.LGPLv2.1" "$asset_root/FFmpeg-COPYING.LGPLv2.1"
          for notice in OPUS-COPYING LIBVPX-LICENSE LIBVPX-PATENTS EXPORT-CODEC-SOURCES.txt; do
            test -s "$source_root/$notice"
            install -m 644 "$source_root/$notice" "$asset_root/$notice"
          done

      - name: Expose verified Android FFmpeg libraries to the build hook
        working-directory: apps/or_app
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/android-ffmpeg-verification/android-ffmpeg/install"
          install_link=android/.ffmpeg-install
          jni_root=android/app/src/main/jniLibs
          toolchain="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64"
          test -d "$install_root"
          test ! -e "$install_link" && test ! -L "$install_link"
          ln -s "$install_root" "$install_link"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "$install_link/$abi/lib/pkgconfig/libavcodec.pc"
            test -f "$install_link/$abi/include/libavcodec/avcodec.h"
            jni_dir="$jni_root/$abi"
            mkdir -p "$jni_dir"
            for library in avcodec avformat avutil swresample swscale; do
              shared="$install_link/$abi/lib/lib$library.so"
              soname="$("$toolchain/bin/llvm-readelf" -d "$shared" | sed -n 's/.*Library soname: \[\([^]]*\)\].*/\1/p')"
              test -n "$soname"
              test -f "$install_link/$abi/lib/$soname"
              for runtime in "$install_link/$abi/lib/lib$library.so"*; do
                test -e "$runtime" || continue
                cp -L "$runtime" "$jni_dir/$(basename "$runtime")"
              done
              test -s "$jni_dir/lib$library.so"
              test -s "$jni_dir/$soname"
            done
          done

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build Android debug APK
        working-directory: apps/or_app
        run: flutter build apk --debug --target-platform android-arm,android-arm64,android-x64

      - name: Verify Android APK contains FFmpeg libraries for all ABIs
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/apps/or_app/build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$apk"
          apk_entries="$(unzip -Z1 "$apk")"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            entry="lib/$abi/libor_app_bridge.so"
            if ! grep -Fxq "$entry" <<< "$apk_entries"; then
              echo "Missing APK entry: $entry"
              grep -E '^lib/(arm64-v8a|armeabi-v7a|x86_64)/.*\.so$' <<< "$apk_entries" || true
              exit 1
            fi
            for library in avcodec avformat avutil swresample swscale; do
              entry="lib/$abi/lib$library.so"
              if ! grep -Fxq "$entry" <<< "$apk_entries"; then
                echo "Missing APK entry: $entry"
                grep -E '^lib/(arm64-v8a|armeabi-v7a|x86_64)/.*\.so$' <<< "$apk_entries" || true
                exit 1
              fi
            done
          done
          for notice in FFmpeg-COPYING.LGPLv2.1 OPUS-COPYING LIBVPX-LICENSE LIBVPX-PATENTS EXPORT-CODEC-SOURCES.txt; do
            grep -Fxq "assets/open-source/$notice" <<< "$apk_entries"
          done

      - name: Preserve failed Android preview APK for diagnosis
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-android-failed-${{ github.run_id }}
          path: apps/or_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Package Android APK
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/or_app/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          cp "$apk" "$RUNNER_TEMP/opencut-reinforced-android-debug.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-android
          path: ${{ runner.temp }}/opencut-reinforced-android-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-cli-macos:
    name: Build macOS CLI
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust for Apple desktop targets
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal macOS CLI
        run: |
          cargo build --release -p or_cli --bin or --target aarch64-apple-darwin
          cargo build --release -p or_cli --bin or --target x86_64-apple-darwin
          mkdir -p "$RUNNER_TEMP/or-cli-macos"
          lipo -create \
            target/aarch64-apple-darwin/release/or \
            target/x86_64-apple-darwin/release/or \
            -output "$RUNNER_TEMP/or-cli-macos/or"
          cat > "$RUNNER_TEMP/or-cli-macos/CLI-README.txt" <<'EOF'
          Opencut Reinforced CLI — Developer Preview

          This unsigned macOS CLI supports Apple silicon and Intel Macs.
          No production signing or notarization is applied.

          Examples:
            or version
            or project summary --file "/path/to/project.orproj"
            or session describe --attach "/path/to/descriptor"

          While a project is open in OR, find its descriptor path under
          Settings > Advanced / Developer. The descriptor path is local to
          this device. Do not share the descriptor file; it grants local access.
          This package contains no project session credentials or descriptor.
          EOF
          chmod 755 "$RUNNER_TEMP/or-cli-macos/or"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/or-cli-macos" \
            "$RUNNER_TEMP/opencut-reinforced-cli-macos.zip"
          test -s "$RUNNER_TEMP/opencut-reinforced-cli-macos.zip"

      - name: Upload macOS CLI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-cli-macos
          path: ${{ runner.temp }}/opencut-reinforced-cli-macos.zip
          if-no-files-found: error
          retention-days: 7

  build-cli-windows:
    name: Build Windows x64 CLI
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Build and package Windows x64 CLI
        shell: pwsh
        run: |
          cargo build --release -p or_cli --bin or
          $stage = Join-Path $env:RUNNER_TEMP "or-cli-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/or.exe" (Join-Path $stage "or.exe")
          @'
          Opencut Reinforced CLI — Developer Preview

          This unsigned package is for Windows x64. No production signing is applied.

          Examples:
            or.exe version
            or.exe project summary --file "C:\path\to\project.orproj"
            or.exe session describe --attach "C:\path\to\descriptor"

          While a project is open in OR, find its descriptor path under
          Settings > Advanced / Developer. The descriptor path is local to
          this device. Do not share the descriptor file; it grants local access.
          This package contains no project session credentials or descriptor.
          '@ | Set-Content -LiteralPath (Join-Path $stage "CLI-README.txt")
          $archive = Join-Path $env:RUNNER_TEMP "opencut-reinforced-cli-windows-x64.zip"
          Compress-Archive -LiteralPath $stage -DestinationPath $archive -CompressionLevel Optimal
          if ((Get-Item -LiteralPath $archive).Length -eq 0) { throw "Windows CLI package is empty" }

      - name: Upload Windows CLI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-cli-windows-x64
          path: ${{ runner.temp }}/opencut-reinforced-cli-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  build-cli-linux:
    name: Build Linux x64 CLI
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Build and package Linux x64 CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p or_cli --bin or
          stage="$RUNNER_TEMP/or-cli-linux-x64"
          mkdir -p "$stage"
          install -m 0755 target/release/or "$stage/or"
          cat > "$stage/CLI-README.txt" <<'EOF'
          Opencut Reinforced CLI — Developer Preview

          This unsigned package is for Linux x64. No production signing is applied.

          Examples:
            ./or version
            ./or project summary --file "/path/to/project.orproj"
            ./or session describe --attach "/path/to/descriptor"

          While a project is open in OR, find its descriptor path under
          Settings > Advanced / Developer. The descriptor path is local to
          this device. Do not share the descriptor file; it grants local access.
          This package contains no project session credentials or descriptor.
          EOF
          tar -czf "$RUNNER_TEMP/opencut-reinforced-cli-linux-x64.tar.gz" -C "$RUNNER_TEMP" "$(basename "$stage")"
          test -s "$RUNNER_TEMP/opencut-reinforced-cli-linux-x64.tar.gz"

      - name: Upload Linux CLI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-cli-linux-x64
          path: ${{ runner.temp }}/opencut-reinforced-cli-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify and publish prerelease
    needs:
      - prepare
      - build-macos
      - build-windows
      - build-linux
      - build-android
      - build-cli-macos
      - build-cli-windows
      - build-cli-linux
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEVELOPER_TAG: ${{ needs.prepare.outputs.tag }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Enforce main-only release publication
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || \
                ("$GITHUB_EVENT_NAME" != "schedule" && "$GITHUB_EVENT_NAME" != "workflow_dispatch") ]]; then
            echo "::error::Release tags and uploads are allowed only for a validated main-branch run."
            exit 1
          fi

      - name: Download the four application and three CLI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: developer-preview-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Download verified macOS FFmpeg provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-8.1.3-macos
          run-id: ${{ needs.prepare.outputs.platform_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ffmpeg-provenance/macos

      - name: Download verified Linux FFmpeg provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-8.1.3-linux
          run-id: ${{ needs.prepare.outputs.platform_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ffmpeg-provenance/linux

      - name: Download verified Windows FFmpeg provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-8.1.3-windows-x64
          run-id: ${{ needs.prepare.outputs.platform_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ffmpeg-provenance/windows-x64

      - name: Create build information and checksums
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          files=(
            opencut-reinforced-macos-debug.zip
            opencut-reinforced-windows-x64-debug.zip
            opencut-reinforced-linux-x64-debug.tar.gz
            opencut-reinforced-android-debug.apk
            opencut-reinforced-cli-macos.zip
            opencut-reinforced-cli-windows-x64.zip
            opencut-reinforced-cli-linux-x64.tar.gz
          )

          for file in "${files[@]}"; do
            if [[ ! -s "$assets/$file" ]]; then
              echo "::error::Required developer artifact is missing or empty: $file"
              exit 1
            fi
          done
          file_count="$(find "$assets" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "$file_count" != "7" ]]; then
            echo "::error::Expected exactly seven application/CLI packages, found $file_count files."
            exit 1
          fi

          provenance="$RUNNER_TEMP/ffmpeg-provenance"
          for target in macos linux windows-x64; do
            dir="$provenance/$target"
            codec_notices="$dir/desktop-export-codecs"
            for file in opus-1.6.1.tar.gz libvpx-v1.17.0.tar OPUS-COPYING LIBVPX-LICENSE LIBVPX-PATENTS EXPORT-CODEC-SOURCES.txt; do
              if [[ ! -s "$codec_notices/$file" ]]; then
                echo "::error::Verified $target export-codec provenance is missing: desktop-export-codecs/$file"
                exit 1
              fi
              install -m 0644 "$codec_notices/$file" "$dir/$file"
            done
            for file in ffmpeg-8.1.3.tar.xz FFMPEG-BUILD-INFO.txt FFmpeg-COPYING.LGPLv2.1 opus-1.6.1.tar.gz libvpx-v1.17.0.tar OPUS-COPYING LIBVPX-LICENSE LIBVPX-PATENTS EXPORT-CODEC-SOURCES.txt; do
              if [[ ! -s "$dir/$file" ]]; then
                echo "::error::Verified $target FFmpeg provenance is missing: $file"
                exit 1
              fi
            done
          done
          for file in zlib-1.3.2.tar.gz ZLIB-LICENSE.txt; do
            if [[ ! -s "$provenance/windows-x64/$file" ]]; then
              echo "::error::Verified Windows zlib provenance is missing: $file"
              exit 1
            fi
          done
          for target in macos linux windows-x64; do
            dir="$provenance/$target"
            echo "6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1  $dir/opus-1.6.1.tar.gz" | sha256sum --check
            expected_vpx_sha="$(sed -n 's/^libvpx source archive SHA-256: //p' "$dir/EXPORT-CODEC-SOURCES.txt")"
            test -n "$expected_vpx_sha"
            echo "$expected_vpx_sha  $dir/libvpx-v1.17.0.tar" | sha256sum --check
            archive_members="$RUNNER_TEMP/libvpx-members-$target.txt"
            tar -tf "$dir/libvpx-v1.17.0.tar" > "$archive_members"
            grep -Fxq 'libvpx-v1.17.0/LICENSE' "$archive_members"
            grep -Fxq 'libvpx-v1.17.0/PATENTS' "$archive_members"
          done
          for file in opus-1.6.1.tar.gz OPUS-COPYING LIBVPX-LICENSE LIBVPX-PATENTS EXPORT-CODEC-SOURCES.txt; do
            cmp "$provenance/macos/$file" "$provenance/linux/$file"
            cmp "$provenance/macos/$file" "$provenance/windows-x64/$file"
          done
          cmp "$provenance/macos/libvpx-v1.17.0.tar" "$provenance/linux/libvpx-v1.17.0.tar"
          cmp "$provenance/macos/libvpx-v1.17.0.tar" "$provenance/windows-x64/libvpx-v1.17.0.tar"
          echo "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16  $provenance/windows-x64/zlib-1.3.2.tar.gz" | sha256sum --check
          tar -tzf "$provenance/windows-x64/zlib-1.3.2.tar.gz" >/dev/null
          cmp "$provenance/macos/ffmpeg-8.1.3.tar.xz" "$provenance/linux/ffmpeg-8.1.3.tar.xz"
          cmp "$provenance/macos/ffmpeg-8.1.3.tar.xz" "$provenance/windows-x64/ffmpeg-8.1.3.tar.xz"
          cmp "$provenance/macos/FFmpeg-COPYING.LGPLv2.1" "$provenance/linux/FFmpeg-COPYING.LGPLv2.1"
          cmp "$provenance/macos/FFmpeg-COPYING.LGPLv2.1" "$provenance/windows-x64/FFmpeg-COPYING.LGPLv2.1"
          cp "$provenance/macos/ffmpeg-8.1.3.tar.xz" "$assets/ffmpeg-8.1.3-source.tar.xz"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $assets/ffmpeg-8.1.3-source.tar.xz" | sha512sum --check
          xz --test "$assets/ffmpeg-8.1.3-source.tar.xz"
          cp "$provenance/macos/opus-1.6.1.tar.gz" "$assets/opus-1.6.1-source.tar.gz"
          cp "$provenance/macos/libvpx-v1.17.0.tar" "$assets/libvpx-v1.17.0-source.tar"
          {
            echo "FFmpeg release: 8.1.3"
            echo "Rust binding: ffmpeg-the-third 6.0.0"
            echo "Windows helper zlib: 1.3.2, statically linked"
            echo "zlib source URL: https://zlib.net/fossils/zlib-1.3.2.tar.gz"
            echo "zlib source SHA-256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"
            echo "Windows app package includes ZLIB-LICENSE.txt"
            echo
            echo "=== Verified desktop export codec source ==="
            cat "$provenance/macos/EXPORT-CODEC-SOURCES.txt"
            for target in macos linux windows-x64; do
              echo
              echo "=== Verified $target build ==="
              cat "$provenance/$target/FFMPEG-BUILD-INFO.txt"
            done
          } > "$assets/FFMPEG-BUILD-INFO.txt"

          mac_entries="$(unzip -Z1 "$assets/opencut-reinforced-macos-debug.zip")"
          windows_entries="$(unzip -Z1 "$assets/opencut-reinforced-windows-x64-debug.zip")"
          linux_entries="$(tar -tzf "$assets/opencut-reinforced-linux-x64-debug.tar.gz")"
          for library in avcodec avformat avutil swresample swscale; do
            grep -Eq "(^|/)lib${library}\\.[0-9]+\\.dylib$" <<< "$mac_entries"
            grep -Eiq "(^|/)${library}(-[0-9]+)?\\.dll$" <<< "$windows_entries"
            grep -Eq "(^|/)lib${library}\\.so(\\.[0-9]+)*$" <<< "$linux_entries"
          done
          grep -Fq 'ThirdPartyNotices/FFmpeg/COPYING.LGPLv2.1' <<< "$mac_entries"
          grep -Fq 'ThirdPartyNotices/FFmpeg/FFmpeg-NOTICE.txt' <<< "$mac_entries"
          grep -Fq 'licenses/FFmpeg/COPYING.LGPLv2.1' <<< "$windows_entries"
          grep -Fq 'licenses/FFmpeg/FFmpeg-NOTICE.txt' <<< "$windows_entries"
          grep -Fq 'licenses/FFmpeg/COPYING.LGPLv2.1' <<< "$linux_entries"
          grep -Fq 'licenses/FFmpeg/FFmpeg-NOTICE.txt' <<< "$linux_entries"
          grep -Fq 'ThirdPartyNotices/Opus/COPYING' <<< "$mac_entries"
          grep -Fq 'ThirdPartyNotices/libvpx/LICENSE' <<< "$mac_entries"
          grep -Fq 'ThirdPartyNotices/libvpx/PATENTS' <<< "$mac_entries"
          grep -Fq 'licenses/Opus/COPYING' <<< "$windows_entries"
          grep -Fq 'licenses/libvpx/LICENSE' <<< "$windows_entries"
          grep -Fq 'licenses/libvpx/PATENTS' <<< "$windows_entries"
          grep -Fq 'licenses/Opus/COPYING' <<< "$linux_entries"
          grep -Fq 'licenses/libvpx/LICENSE' <<< "$linux_entries"
          grep -Fq 'licenses/libvpx/PATENTS' <<< "$linux_entries"

          cat > "$assets/BUILD-INFO.txt" <<EOF
          Opencut Reinforced Developer Preview

          Full source commit SHA: $GITHUB_SHA
          Developer tag: $DEVELOPER_TAG
          GitHub Actions run ID: $GITHUB_RUN_ID
          GitHub Actions run URL: $GITHUB_RUN_URL
          Build classification: DEBUG / DEVELOPER
          Flutter version: 3.47.5 (revision 6a19cca56475dbfba1478ee68d7bd0c2ef891da1)
          Rust version: 1.98.0
          Signing: macOS uses an ad-hoc debug signature after FFmpeg packaging; no production signing or notarization. Android uses the standard debug build key.

          Supported artifacts produced:
          - opencut-reinforced-macos-debug.zip (ad-hoc signed, not notarized)
          - opencut-reinforced-windows-x64-debug.zip (unsigned)
          - opencut-reinforced-linux-x64-debug.tar.gz (unsigned)
          - opencut-reinforced-android-debug.apk (debug signing only)
          - opencut-reinforced-cli-macos.zip (universal Apple silicon + Intel, unsigned)
          - opencut-reinforced-cli-windows-x64.zip (unsigned)
          - opencut-reinforced-cli-linux-x64.tar.gz (unsigned)

          Release assets: seven application/CLI packages, FFmpeg build provenance, FFmpeg/Opus/libvpx corresponding source archives, and SHA256SUMS.txt (thirteen assets total).
          SHA256SUMS.txt covers every other release asset; a checksum manifest cannot contain its own checksum.
          The desktop application archives contain the matching FFmpeg 8.1.3 shared runtime libraries and LGPL notices, plus Opus/libvpx notices for the WebM VP9/Opus export profile. Codec source versions, exact source archive hashes, and the libvpx patent notice are included with the packages; the corresponding source archives are release assets. These notices do not establish patent clearance in every jurisdiction.

          Warning: Pre-MVP developer build; not a stable release or a performance benchmark.
          EOF

          cd "$assets"
          checksummed_files=(
            "${files[@]}"
            BUILD-INFO.txt
            FFMPEG-BUILD-INFO.txt
            ffmpeg-8.1.3-source.tar.xz
            opus-1.6.1-source.tar.gz
            libvpx-v1.17.0-source.tar
          )
          sha256sum "${checksummed_files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          file_count="$(find "$assets" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "$file_count" != "13" ]]; then
            echo "::error::Expected exactly thirteen Developer Preview assets, found $file_count files."
            exit 1
          fi

          cat > "$RUNNER_TEMP/RELEASE-NOTES.md" <<'EOF'
          # Opencut Reinforced Developer Preview

          **PRERELEASE — DEBUG TEST BUILD**

          Source commit: @SOURCE_COMMIT@

          This preview is built only after the same source commit passes hosted Platform Verification. It is an unsigned or ad-hoc-signed test build, not a stable release or performance benchmark.

          ## Try one ordinary project

          1. Install the package for your OS, create a project, and import a real video with audio. Note any install, permission, or file-compatibility friction.
          2. Preview the media, place it on the timeline, trim or split it, add a short title or manual caption, and use undo/redo.
          3. Save, close, and reopen the project. On desktop, you can also move a source and try Relink.
          4. Export a profile offered by the app, open the result in an independent player, and check picture, sound, and duration.
          5. Report your OS/device, source format and duration, confusing or failed steps, export time, and whether another app played the result. File a reproducible issue with the [bug report form](https://github.com/huou07/Opencut-Reinforced/issues/new?template=bug_report.yml). Do not send private media; describe the issue or attach a legally shareable sample.

          ## Included workflows

          - Create/open projects, import media, edit and revise clips, preview, add titles and manual captions, save/reopen, and recover unsaved work.
          - Import/export SRT and WebVTT captions with a preview of formatting loss.
          - Export Matroska with FFV1/PCM and WebM with VP9/Opus on desktop. Android WebM is included only when the exact-SHA all-ABI and SAF output checks pass.
          - Use the desktop CLI against the same live project session as the application.

          ## Known limitations

          - Automatic captions, translation, and other AI workflows are not available yet.
          - Folder import, track reorder, multi-select, and linked clips are not available.
          - Android verification uses an emulator; physical-device performance has not been measured.
          - iOS is not a supported target. No package is production-signed; macOS is not notarized.

          This is a pre-release editor for testing, not a production release. Report crashes, data loss, unsupported common media, install friction, confusing interactions, and output compatibility.
          EOF

          sed "s/@SOURCE_COMMIT@/${GITHUB_SHA}/" "$RUNNER_TEMP/RELEASE-NOTES.md" > "$RUNNER_TEMP/RELEASE-NOTES.tmp"
          mv "$RUNNER_TEMP/RELEASE-NOTES.tmp" "$RUNNER_TEMP/RELEASE-NOTES.md"

      - name: Create commit-specific GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          gh release create "$DEVELOPER_TAG" \
            "$assets/opencut-reinforced-macos-debug.zip" \
            "$assets/opencut-reinforced-windows-x64-debug.zip" \
            "$assets/opencut-reinforced-linux-x64-debug.tar.gz" \
            "$assets/opencut-reinforced-android-debug.apk" \
            "$assets/opencut-reinforced-cli-macos.zip" \
            "$assets/opencut-reinforced-cli-windows-x64.zip" \
            "$assets/opencut-reinforced-cli-linux-x64.tar.gz" \
            "$assets/SHA256SUMS.txt" \
            "$assets/BUILD-INFO.txt" \
            "$assets/FFMPEG-BUILD-INFO.txt" \
            "$assets/ffmpeg-8.1.3-source.tar.xz" \
            "$assets/opus-1.6.1-source.tar.gz" \
            "$assets/libvpx-v1.17.0-source.tar" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Opencut Reinforced Developer Preview $SHORT_SHA" \
            --notes-file "$RUNNER_TEMP/RELEASE-NOTES.md" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA"

      - name: Verify published release, tag target, assets, and checksums
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/published-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${DEVELOPER_TAG}" > "$release_json"

          if ! jq -e --arg tag "$DEVELOPER_TAG" \
            '.tag_name == $tag and .prerelease == true and (.assets | length == 13)' \
            "$release_json" > /dev/null; then
            echo "::error::Published release is not the expected thirteen-asset prerelease."
            exit 1
          fi

          expected_assets=(
            opencut-reinforced-macos-debug.zip
            opencut-reinforced-windows-x64-debug.zip
            opencut-reinforced-linux-x64-debug.tar.gz
            opencut-reinforced-android-debug.apk
            opencut-reinforced-cli-macos.zip
            opencut-reinforced-cli-windows-x64.zip
            opencut-reinforced-cli-linux-x64.tar.gz
            SHA256SUMS.txt
            BUILD-INFO.txt
            FFMPEG-BUILD-INFO.txt
            ffmpeg-8.1.3-source.tar.xz
            opus-1.6.1-source.tar.gz
            libvpx-v1.17.0-source.tar
          )
          for asset in "${expected_assets[@]}"; do
            if ! jq -e --arg name "$asset" '.assets | any(.[]; .name == $name and .size > 0)' "$release_json" > /dev/null; then
              echo "::error::Published release is missing a non-empty required asset: $asset"
              exit 1
            fi
          done

          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${DEVELOPER_TAG}")"
          tag_type="$(jq -r '.object.type' <<< "$tag_ref")"
          tag_sha="$(jq -r '.object.sha' <<< "$tag_ref")"
          if [[ "$tag_type" == "tag" ]]; then
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
            tag_type="$(jq -r '.object.type' <<< "$tag_object")"
            tag_sha="$(jq -r '.object.sha' <<< "$tag_object")"
          fi
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Developer tag ${DEVELOPER_TAG} does not resolve to the exact source commit ${GITHUB_SHA}."
            exit 1
          fi

          verify_dir="$RUNNER_TEMP/published-assets"
          mkdir -p "$verify_dir"
          gh release download "$DEVELOPER_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c SHA256SUMS.txt)
          jq -r '"Published prerelease: " + .html_url' "$release_json" >> "$GITHUB_STEP_SUMMARY"
