name: Developer Preview

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: developer-preview-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify source and release eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_publish: ${{ steps.prepare.outputs.should_publish }}
      tag: ${{ steps.prepare.outputs.tag }}
      short_sha: ${{ steps.prepare.outputs.short_sha }}
    steps:
      - name: Require main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Developer Preview releases may only run from main (received $GITHUB_REF)."
            exit 1
          fi

      - name: Skip duplicate releases and require exact-commit platform verification
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:12}"
          tag="dev-${short_sha}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          set +e
          release_response="$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>&1)"
          release_status=$?
          set -e

          if [[ "$release_status" -eq 0 ]]; then
            echo "A Developer Preview already exists for ${GITHUB_SHA} (${tag}); skipping duplicate builds."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          http_status="$(printf '%s\n' "$release_response" | sed -nE 's#^HTTP/[0-9.]+ ([0-9]{3}).*#\1#p' | tail -n 1)"
          if [[ "$http_status" != "404" ]]; then
            echo "::error::Could not check whether release ${tag} already exists (GitHub API status ${http_status:-unknown})."
            exit 1
          fi

          runs_file="$RUNNER_TEMP/platform-verification-runs.json"
          gh api \
            --method GET \
            -F "head_sha=${GITHUB_SHA}" \
            -F per_page=100 \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/platform-verification.yml/runs" \
            > "$runs_file"

          if ! jq -e --arg sha "$GITHUB_SHA" \
            'any(.workflow_runs[]?; .head_sha == $sha and .status == "completed" and .conclusion == "success")' \
            "$runs_file" > /dev/null; then
            echo "::error::Developer Preview requires a completed successful Platform verification run for this exact commit (${GITHUB_SHA})."
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS debug app
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Install Flutter 3.47.5
        shell: bash
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build unsigned macOS debug app
        working-directory: apps/or_app
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_IDENTITY: ""
        run: flutter build macos --debug

      - name: Package complete app bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import os

          products = pathlib.Path("apps/or_app/build/macos/Build/Products/Debug")
          bundles = sorted(path for path in products.rglob("*.app") if path.is_dir())
          if len(bundles) != 1:
              raise SystemExit(f"Expected one .app bundle under {products}, found {len(bundles)}")

          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opencut-reinforced-macos-debug.zip"
          subprocess.run(
              ["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", str(bundles[0]), str(archive)],
              check=True,
          )
          if archive.stat().st_size == 0:
              raise SystemExit("macOS debug archive is empty")
          PY

      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-macos
          path: ${{ runner.temp }}/opencut-reinforced-macos-debug.zip
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64 debug app
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Install Flutter 3.47.5
        shell: pwsh
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ((git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD).Trim() -ne "6a19cca56475dbfba1478ee68d7bd0c2ef891da1") { throw "Flutter revision mismatch" }
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build Windows x64 debug app
        working-directory: apps/or_app
        run: flutter build windows --debug

      - name: Package complete Debug output directory
        shell: pwsh
        run: |
          $buildOutput = Join-Path $env:GITHUB_WORKSPACE "apps/or_app/build/windows/x64/runner/Debug"
          $archive = Join-Path $env:RUNNER_TEMP "opencut-reinforced-windows-x64-debug.zip"
          if (-not (Test-Path -LiteralPath $buildOutput -PathType Container)) { throw "Windows Debug output directory not found: $buildOutput" }
          if (-not (Get-ChildItem -LiteralPath $buildOutput -Filter "*.exe" -File)) { throw "Windows Debug output has no executable" }
          Compress-Archive -LiteralPath $buildOutput -DestinationPath $archive -CompressionLevel Optimal
          if ((Get-Item -LiteralPath $archive).Length -eq 0) { throw "Windows debug archive is empty" }

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-windows
          path: ${{ runner.temp }}/opencut-reinforced-windows-x64-debug.zip
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux x64 debug app
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Flutter Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Install Flutter 3.47.5
        shell: bash
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build Linux x64 debug app
        working-directory: apps/or_app
        run: flutter build linux --debug

      - name: Package complete Linux bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="apps/or_app/build/linux/x64/debug/bundle"
          test -d "$bundle"
          test -n "$(find "$bundle" -mindepth 1 -maxdepth 1 -print -quit)"
          tar -czf "$RUNNER_TEMP/opencut-reinforced-linux-x64-debug.tar.gz" -C "$(dirname "$bundle")" "$(basename "$bundle")"
          test -s "$RUNNER_TEMP/opencut-reinforced-linux-x64-debug.tar.gz"

      - name: Upload Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-linux
          path: ${{ runner.temp }}/opencut-reinforced-linux-x64-debug.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android debug APK
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android platform and Rust NDK
        run: >-
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          "ndk;28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Flutter 3.47.5
        shell: bash
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build Android debug APK
        working-directory: apps/or_app
        run: flutter build apk --debug

      - name: Package Android APK
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/or_app/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          cp "$apk" "$RUNNER_TEMP/opencut-reinforced-android-debug.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-android
          path: ${{ runner.temp }}/opencut-reinforced-android-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-cli-macos:
    name: Build macOS CLI
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust for Apple desktop targets
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal macOS CLI
        run: |
          cargo build --release -p or_cli --bin or --target aarch64-apple-darwin
          cargo build --release -p or_cli --bin or --target x86_64-apple-darwin
          mkdir -p "$RUNNER_TEMP/or-cli-macos"
          lipo -create \
            target/aarch64-apple-darwin/release/or \
            target/x86_64-apple-darwin/release/or \
            -output "$RUNNER_TEMP/or-cli-macos/or"
          cat > "$RUNNER_TEMP/or-cli-macos/CLI-README.txt" <<'EOF'
          Opencut Reinforced CLI — Developer Preview

          This unsigned macOS CLI supports Apple silicon and Intel Macs.
          No production signing or notarization is applied.

          Examples:
            or version
            or project summary --file "/path/to/project.orproj"
            or session describe --attach "/path/to/descriptor"

          While a project is open in OR, find its descriptor path under
          Settings > Advanced / Developer. The descriptor path is local to
          this device. Do not share the descriptor file; it grants local access.
          This package contains no project session credentials or descriptor.
          EOF
          chmod 755 "$RUNNER_TEMP/or-cli-macos/or"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/or-cli-macos" \
            "$RUNNER_TEMP/opencut-reinforced-cli-macos.zip"
          test -s "$RUNNER_TEMP/opencut-reinforced-cli-macos.zip"

      - name: Upload macOS CLI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-cli-macos
          path: ${{ runner.temp }}/opencut-reinforced-cli-macos.zip
          if-no-files-found: error
          retention-days: 7

  build-cli-windows:
    name: Build Windows x64 CLI
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Build and package Windows x64 CLI
        shell: pwsh
        run: |
          cargo build --release -p or_cli --bin or
          $stage = Join-Path $env:RUNNER_TEMP "or-cli-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/or.exe" (Join-Path $stage "or.exe")
          @'
          Opencut Reinforced CLI — Developer Preview

          This unsigned package is for Windows x64. No production signing is applied.

          Examples:
            or.exe version
            or.exe project summary --file "C:\path\to\project.orproj"
            or.exe session describe --attach "C:\path\to\descriptor"

          While a project is open in OR, find its descriptor path under
          Settings > Advanced / Developer. The descriptor path is local to
          this device. Do not share the descriptor file; it grants local access.
          This package contains no project session credentials or descriptor.
          '@ | Set-Content -LiteralPath (Join-Path $stage "CLI-README.txt")
          $archive = Join-Path $env:RUNNER_TEMP "opencut-reinforced-cli-windows-x64.zip"
          Compress-Archive -LiteralPath $stage -DestinationPath $archive -CompressionLevel Optimal
          if ((Get-Item -LiteralPath $archive).Length -eq 0) { throw "Windows CLI package is empty" }

      - name: Upload Windows CLI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-cli-windows-x64
          path: ${{ runner.temp }}/opencut-reinforced-cli-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  build-cli-linux:
    name: Build Linux x64 CLI
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Build and package Linux x64 CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p or_cli --bin or
          stage="$RUNNER_TEMP/or-cli-linux-x64"
          mkdir -p "$stage"
          install -m 0755 target/release/or "$stage/or"
          cat > "$stage/CLI-README.txt" <<'EOF'
          Opencut Reinforced CLI — Developer Preview

          This unsigned package is for Linux x64. No production signing is applied.

          Examples:
            ./or version
            ./or project summary --file "/path/to/project.orproj"
            ./or session describe --attach "/path/to/descriptor"

          While a project is open in OR, find its descriptor path under
          Settings > Advanced / Developer. The descriptor path is local to
          this device. Do not share the descriptor file; it grants local access.
          This package contains no project session credentials or descriptor.
          EOF
          tar -czf "$RUNNER_TEMP/opencut-reinforced-cli-linux-x64.tar.gz" -C "$RUNNER_TEMP" "$(basename "$stage")"
          test -s "$RUNNER_TEMP/opencut-reinforced-cli-linux-x64.tar.gz"

      - name: Upload Linux CLI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-preview-cli-linux-x64
          path: ${{ runner.temp }}/opencut-reinforced-cli-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify and publish prerelease
    needs:
      - prepare
      - build-macos
      - build-windows
      - build-linux
      - build-android
      - build-cli-macos
      - build-cli-windows
      - build-cli-linux
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEVELOPER_TAG: ${{ needs.prepare.outputs.tag }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download the four application and three CLI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: developer-preview-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Create build information and checksums
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          files=(
            opencut-reinforced-macos-debug.zip
            opencut-reinforced-windows-x64-debug.zip
            opencut-reinforced-linux-x64-debug.tar.gz
            opencut-reinforced-android-debug.apk
            opencut-reinforced-cli-macos.zip
            opencut-reinforced-cli-windows-x64.zip
            opencut-reinforced-cli-linux-x64.tar.gz
          )

          for file in "${files[@]}"; do
            if [[ ! -s "$assets/$file" ]]; then
              echo "::error::Required developer artifact is missing or empty: $file"
              exit 1
            fi
          done
          file_count="$(find "$assets" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "$file_count" != "7" ]]; then
            echo "::error::Expected exactly seven application/CLI packages, found $file_count files."
            exit 1
          fi

          cat > "$assets/BUILD-INFO.txt" <<EOF
          Opencut Reinforced Developer Preview

          Full source commit SHA: $GITHUB_SHA
          Developer tag: $DEVELOPER_TAG
          GitHub Actions run ID: $GITHUB_RUN_ID
          GitHub Actions run URL: $GITHUB_RUN_URL
          Build classification: DEBUG / DEVELOPER
          Flutter version: 3.47.5 (revision 6a19cca56475dbfba1478ee68d7bd0c2ef891da1)
          Rust version: 1.98.0
          Signing: no production signing; Android uses the standard debug build key

          Supported artifacts produced:
          - opencut-reinforced-macos-debug.zip (unsigned, not notarized)
          - opencut-reinforced-windows-x64-debug.zip (unsigned)
          - opencut-reinforced-linux-x64-debug.tar.gz (unsigned)
          - opencut-reinforced-android-debug.apk (debug signing only)
          - opencut-reinforced-cli-macos.zip (universal Apple silicon + Intel, unsigned)
          - opencut-reinforced-cli-windows-x64.zip (unsigned)
          - opencut-reinforced-cli-linux-x64.tar.gz (unsigned)

          Warning: Pre-MVP developer build; not a stable release and not yet a functional video editor.
          EOF

          cd "$assets"
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

          cat > "$RUNNER_TEMP/RELEASE-NOTES.md" <<'EOF'
          # Opencut Reinforced Developer Preview

          **PRERELEASE — DEBUG / DEVELOPER BUILD**

          Source commit: @SOURCE_COMMIT@

          This build is for developer testing of the native UI shell, project lifecycle, project media library, background job/cache foundation, CLI, and architecture foundation. It is a pre-MVP project, not a usable video editor.

          **PHASE 4 FOUNDATION COMPLETE**

          - Real desktop New/Open/Save project lifecycle on macOS, Windows, and Linux.
          - One Rust-owned live project session is shared by Flutter and authenticated local IPC.
          - Attached CLI operations update the project open in Flutter.
          - Real Rename, Undo, Redo, and explicit Save with dirty and exit guards.
          - Explicit recovery handling and safe no-clobber new project creation.
          - Desktop CLI packages are included for testing this flow.

          **PHASE 5A — MEDIA PROBE FOUNDATION**

          - The desktop CLI provides read-only local metadata inspection: `or media probe --file PATH [--json]`.
          - Media probing requires a system-provided `ffprobe`; it is not bundled with OR.

          **PHASE 5B — PROJECT MEDIA LIBRARY**

          - `.orproj` schema v2 persists an ordered project media library; v1 projects still load and migrate on the next explicit save.
          - Desktop users can Import Media, list items in the Media panel, and remove items through the Rust-owned project session.
          - Import requires a system-provided `ffprobe`. The selected file is probed locally; project loading never opens or probes stored source references.
          - The project stores validated local file URIs and bounded metadata, not media bytes. A source can be offline or moved after import.
          - Headless and attached CLI commands support media list/add/remove; attached import prepares the selected source locally and sends the normal `media.add` command.

          **PHASE 5C — JOB AND CACHE INFRASTRUCTURE FOUNDATION**

          - Bounded background Job Manager: a fixed worker pool, a bounded pending queue with non-blocking backpressure, bounded tracked records, cooperative cancellation, panic containment, and deterministic shutdown.
          - Disposable thumbnail/waveform cache foundation: deterministic SHA-256 cache keys and bounded, atomic, explicitly cleared storage.
          - This is infrastructure only. There are no visible thumbnails, no waveform generation, and no cache is wired into the UI, IPC, or CLI. Job and cache activity never changes project revision and is never stored in a project.

          Still unavailable: thumbnail and waveform generation, proxies, a cache database, timeline editing, playback, decode/render, and export. FFmpeg is not linked or bundled.

          OR remains a pre-MVP project, not a usable video editor.

          Core foundation:
          - Typed Rust bridge
          - Project identity, revision, and exact-time foundation
          - ProjectDocument with `.orproj` v2 encoding and v1 migration
          - Bounded .orproj file loading and atomic save
          - Command and query contracts
          - Transactions
          - Undo and redo
          - Crash-recovery checkpoint core foundation
          - File-backed ProjectSession with exact external-change protection
          - Typed `MediaId`/`JobId`, structured metadata, and bounded external `ffprobe` adapter

          **ATTACHED CLI TESTING**

          - Use the `opencut-reinforced-cli-*` package for your desktop OS.
          - Find the descriptor path in the running app at Settings > Advanced / Developer.
          - Run `or session describe --attach "<descriptor-path>"` to inspect the attached session.
          - `or project rename --attach ...`, `or history undo|redo --attach ...`, and `or project save --attach ...` operate on that same live project.
          - Descriptor contents and authentication tokens are not displayed or included in the CLI packages.
          - `or media probe --file "<local-file-path>" [--json]` inspects metadata without opening or modifying a project. It requires a system-provided `ffprobe`.
          - `or media list --attach <descriptor> [--json]`, `or media add --attach <descriptor> --source <path>`, and `or media remove --attach <descriptor> --id <media-id>` operate on the same live media library. Attached import probes locally, then dispatches `media.add` with the described revision; stale edits are rejected without retry.

          Local IPC remains protocol v1 over Unix-domain sockets on macOS/Linux or Windows named pipes. There is no TCP listener. Unix endpoints use owner-only permissions; Windows endpoints use protected owner-only DACLs and reject remote clients.

          Recovery decisions are explicit. There is no periodic recovery checkpoint scheduler or autosave.

          Not implemented:
          - Thumbnails, waveforms, proxies, media cache storage, or a background Job Manager
          - Actual timeline editing
          - Playback
          - Media decoding or rendering
          - Export
          - FFmpeg library linking or bundling
          - Autosave scheduling and filesystem watching
          - Android Storage Access Framework integration

          These are debug developer builds for testing only, with no production signing. Desktop application and CLI builds are unsigned, macOS application builds are not notarized, and Android uses only the standard debug signing key. They are not performance benchmarks or production releases. Project formats and features may evolve before a future stable release.
          EOF

          sed "s/@SOURCE_COMMIT@/${GITHUB_SHA}/" "$RUNNER_TEMP/RELEASE-NOTES.md" > "$RUNNER_TEMP/RELEASE-NOTES.tmp"
          mv "$RUNNER_TEMP/RELEASE-NOTES.tmp" "$RUNNER_TEMP/RELEASE-NOTES.md"

      - name: Create commit-specific GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          gh release create "$DEVELOPER_TAG" \
            "$assets/opencut-reinforced-macos-debug.zip" \
            "$assets/opencut-reinforced-windows-x64-debug.zip" \
            "$assets/opencut-reinforced-linux-x64-debug.tar.gz" \
            "$assets/opencut-reinforced-android-debug.apk" \
            "$assets/opencut-reinforced-cli-macos.zip" \
            "$assets/opencut-reinforced-cli-windows-x64.zip" \
            "$assets/opencut-reinforced-cli-linux-x64.tar.gz" \
            "$assets/SHA256SUMS.txt" \
            "$assets/BUILD-INFO.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Opencut Reinforced Developer Preview $SHORT_SHA" \
            --notes-file "$RUNNER_TEMP/RELEASE-NOTES.md" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA"

      - name: Verify published release, tag target, assets, and checksums
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/published-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${DEVELOPER_TAG}" > "$release_json"

          if ! jq -e --arg tag "$DEVELOPER_TAG" \
            '.tag_name == $tag and .prerelease == true and (.assets | length == 9)' \
            "$release_json" > /dev/null; then
            echo "::error::Published release is not the expected nine-asset prerelease."
            exit 1
          fi

          expected_assets=(
            opencut-reinforced-macos-debug.zip
            opencut-reinforced-windows-x64-debug.zip
            opencut-reinforced-linux-x64-debug.tar.gz
            opencut-reinforced-android-debug.apk
            opencut-reinforced-cli-macos.zip
            opencut-reinforced-cli-windows-x64.zip
            opencut-reinforced-cli-linux-x64.tar.gz
            SHA256SUMS.txt
            BUILD-INFO.txt
          )
          for asset in "${expected_assets[@]}"; do
            if ! jq -e --arg name "$asset" '.assets | any(.[]; .name == $name and .size > 0)' "$release_json" > /dev/null; then
              echo "::error::Published release is missing a non-empty required asset: $asset"
              exit 1
            fi
          done

          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${DEVELOPER_TAG}")"
          tag_type="$(jq -r '.object.type' <<< "$tag_ref")"
          tag_sha="$(jq -r '.object.sha' <<< "$tag_ref")"
          if [[ "$tag_type" == "tag" ]]; then
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
            tag_type="$(jq -r '.object.type' <<< "$tag_object")"
            tag_sha="$(jq -r '.object.sha' <<< "$tag_object")"
          fi
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Developer tag ${DEVELOPER_TAG} does not resolve to the exact source commit ${GITHUB_SHA}."
            exit 1
          fi

          verify_dir="$RUNNER_TEMP/published-assets"
          mkdir -p "$verify_dir"
          gh release download "$DEVELOPER_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c SHA256SUMS.txt)
          jq -r '"Published prerelease: " + .html_url' "$release_json" >> "$GITHUB_STEP_SUMMARY"
