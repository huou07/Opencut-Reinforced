name: Platform verification

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - docs/execution/STATE.json
      - docs/execution/evidence/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_COMMON_CONFIGURE_ARGS: >-
    --disable-static
    --enable-shared
    --disable-programs
    --disable-doc
    --disable-autodetect
    --disable-everything
    --disable-asm
    --disable-avdevice
    --disable-avfilter
    --enable-protocol=file
    --enable-demuxer=matroska
    --enable-muxer=matroska
    --enable-decoder=ffv1,pcm_s16le
    --enable-encoder=ffv1,pcm_s16le
  # Desktop-only additions for the packaged 9B1 media helpers. These arrive
  # after the common arguments so the program, filter-library, and component
  # enables win over the minimal defaults, and list options accumulate. Every
  # addition except the system zlib compression library is a native
  # dependency-free FFmpeg component under the same LGPL-2.1-or-later posture;
  # see the 9B1 review in docs/SECURITY_LICENSING.md. Android and the Rust link
  # probe keep the minimal library-only build.
  FFMPEG_HELPER_CONFIGURE_ARGS: >-
    --enable-ffmpeg
    --enable-ffprobe
    --enable-avfilter
    --enable-zlib
    --enable-protocol=pipe
    --enable-encoder=png
    --enable-encoder=mpeg4
    --enable-muxer=image2
    --enable-muxer=image2pipe
    --enable-filter=scale
    --enable-filter=setpts
    --enable-filter=format
    --enable-filter=aformat
    --enable-filter=aresample
    --enable-filter=showwavespic

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install FFmpeg tools and link-probe build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential clang libclang-dev libasound2-dev pkg-config xz-utils
          ffmpeg -version
          ffprobe -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Build LGPL-only FFmpeg 8.1.3 shared libraries for the link probe
        timeout-minutes: 15
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          source="$RUNNER_TEMP/ffmpeg-8.1.3"
          prefix="$RUNNER_TEMP/ffmpeg-8.1.3-install"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz --output "$archive"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$source"
          read -r -a configure_args <<< "$FFMPEG_COMMON_CONFIGURE_ARGS"
          ./configure "--prefix=$prefix" "${configure_args[@]}"
          make -j2
          make install
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          for library in avcodec avformat avutil swresample swscale; do
            pkg-config --modversion "lib$library"
            test "$(pkg-config --variable=prefix "lib$library")" = "$prefix"
          done
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Compile, link, and load the FFmpeg Rust binding probe
        timeout-minutes: 10
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
        run: cargo run --locked --release --manifest-path tools/ffmpeg-link-probe/Cargo.toml

      - name: Verify production software decode against linked FFmpeg
        timeout-minutes: 10
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
        run: cargo test --locked -p or_media --test software_decode

      - name: Verify fixed-profile software export against linked FFmpeg
        timeout-minutes: 10
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
        run: cargo test --locked -p or_media --test software_export

      - name: Verify Phase 7 runtime hardening contracts
        run: |
          cargo test --locked -p or_runtime
          cargo test --locked -p or_app_bridge
          cargo test --locked -p or_core --test project_recovery

      - name: Verify deterministic audio clock and synchronization
        timeout-minutes: 10
        run: cargo test --locked -p or_audio

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
        run: cargo test --workspace

      - name: Verify the real ffprobe adapter with generated media
        run: cargo test -p or_core --test media_probe_integration -- --ignored

      - name: Verify real media artifact generation with system FFmpeg
        run: cargo test -p or_core --test media_artifacts_integration -- --ignored

  flutter-static:
    name: Flutter static and widget checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter 3.47.5
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install FFmpeg development libraries for Flutter host tests
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
          pkg_config_path="$(pkg-config --variable=pc_path pkg-config)"
          test -n "$pkg_config_path"
          PKG_CONFIG_PATH="$pkg_config_path" pkg-config --modversion libavutil
          mkdir -p "$HOME/.cargo"
          # Cargo [env] reaches build.rs when Flutter's native-assets hook drops step env.
          cat > "$HOME/.cargo/config.toml" <<EOF
          [env]
          PKG_CONFIG_PATH = { value = "$pkg_config_path", force = true }
          EOF

      - name: Verify desktop and Android bridge media boundaries
        run: |
          set -euo pipefail
          desktop_tree="$(cargo tree --locked -p or_app_bridge --target x86_64-unknown-linux-gnu --edges normal)"
          if ! grep -E 'or_media|ffmpeg' <<< "$desktop_tree"; then
            echo 'Desktop or_app_bridge must link the software preview decoder'
            exit 1
          fi
          android_tree="$(cargo tree --locked -p or_app_bridge --target aarch64-linux-android --edges normal)"
          if ! grep -E 'or_media|or_render|ffmpeg-the-third' <<< "$android_tree"; then
            echo 'Android or_app_bridge must link the software preview and render path'
            exit 1
          fi

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: apps/or_app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter code
        working-directory: apps/or_app
        run: flutter analyze

      - name: Run Flutter widget tests
        working-directory: apps/or_app
        run: flutter test

  macos:
    name: macOS native build and bridge smoke
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Run project storage tests
        run: cargo test -p or_core --test project_storage

      - name: Run project recovery tests
        run: cargo test -p or_core --test project_recovery

      - name: Run persistent cache index tests
        run: cargo test -p or_core cache::tests

      - name: Run media artifact service tests with fake FFmpeg
        run: cargo test -p or_core media_artifacts::tests

      - name: Run real local IPC transport tests
        run: cargo test -p or_ipc --test local_transport

      - name: Run shared live-host transport tests
        run: cargo test -p or_ipc --test live_host

      - name: Run attached CLI shared-host parity tests
        run: cargo test -p or_cli --test semantic_cli

      - name: Install Flutter 3.47.5
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Install FFmpeg source-build tooling
        run: brew install pkg-config

      - name: Build and stage LGPL-only FFmpeg 8.1.3 shared libraries
        id: ffmpeg-build
        timeout-minutes: 30
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          source="$RUNNER_TEMP/ffmpeg-8.1.3"
          prefix="$RUNNER_TEMP/ffmpeg-8.1.3-install"
          curl --fail --location --silent --show-error --retry 3 --max-time 600 \
            https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz --output "$archive"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $archive" | shasum -a 512 --check
          xz --test "$archive"
          tar -xJOf "$archive" ffmpeg-8.1.3/COPYING.LGPLv2.1 > "$RUNNER_TEMP/FFmpeg-COPYING.LGPLv2.1"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$source"
          read -r -a common_configure_args <<< "$FFMPEG_COMMON_CONFIGURE_ARGS"
          read -r -a helper_configure_args <<< "$FFMPEG_HELPER_CONFIGURE_ARGS"
          configure_args=("--prefix=$prefix" --install-name-dir=@rpath "${common_configure_args[@]}" "${helper_configure_args[@]}")
          ./configure "${configure_args[@]}"
          make -j2
          make install
          # The packaged 9B1 helpers must run and carry exactly the reviewed
          # capabilities: Matroska probe, FFV1/PCM decode, PNG thumbnails,
          # showwavespic waveforms, and mpeg4 proxies. DYLD_LIBRARY_PATH covers
          # the build prefix; app-relative loading is proven at packaging time.
          test -x "$prefix/bin/ffmpeg"
          test -x "$prefix/bin/ffprobe"
          DYLD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffprobe" -hide_banner -version
          DYLD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -buildconf | grep -vq "enable-gpl"
          DYLD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -encoders | grep -q " png "
          DYLD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -encoders | grep -q " mpeg4 "
          DYLD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -muxers | grep -q " image2 "
          DYLD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -muxers | grep -q " image2pipe "
          DYLD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -filters | grep -qE "^ [A-Z.]{3} showwavespic "
          DYLD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -filters | grep -qE "^ [A-Z.]{3} scale "
          DYLD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -filters | grep -qE "^ [A-Z.]{3} setpts "
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          mkdir -p "$HOME/.cargo"
          # Cargo [env] reaches build.rs when Flutter's native-assets hook drops step env.
          cat > "$HOME/.cargo/config.toml" <<EOF
          [env]
          FFMPEG_DIR = { value = "$prefix", force = true }
          PKG_CONFIG_PATH = { value = "$prefix/lib/pkgconfig", force = true }
          EOF
          for library in avcodec avformat avutil swresample swscale; do
            test -f "$prefix/lib/pkgconfig/lib$library.pc"
          done
          echo "FFMPEG_INSTALL_PREFIX=$prefix" >> "$GITHUB_ENV"
          for library in avcodec avformat avutil swresample swscale; do
            pkg-config --modversion "lib$library"
            test "$(pkg-config --variable=prefix "lib$library")" = "$prefix"
          done
          {
            echo "Target: macOS $(uname -m)"
            echo "FFmpeg release: 8.1.3"
            echo "Rust binding: ffmpeg-the-third 6.0.0"
            echo "Official source URL: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
            echo "Official upstream tag commit: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7"
            echo "Source archive SHA-512: acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1"
            echo "Patch status: unpatched upstream release archive"
            echo "Packaging modifications: copies shared libraries beside the desktop media probe and into the app Frameworks directory, and adds @loader_path runtime paths; preserved install prefix remains unchanged"
            echo "Configure arguments: ${configure_args[*]}"
            echo "Enabled libraries: libavcodec, libavformat, libavutil, libswresample, libswscale"
            echo "Enabled programs: ffmpeg, ffprobe (9B1 packaged media helpers)"
            echo "Enabled protocols: file, pipe"
            echo "Enabled demuxers: matroska"
            echo "Enabled decoders: ffv1, pcm_s16le"
            echo "Enabled encoders: ffv1, pcm_s16le, png, mpeg4"
            echo "Enabled muxers: matroska, image2, image2pipe"
            echo "Enabled filters: setpts, scale, format, aformat, aresample, showwavespic"
            echo "License posture: LGPL 2.1-or-later configure default; GPL, version3, and nonfree were not enabled"
            echo "Compiler: $(clang --version | head -n 1)"
            echo "Build tools: $(make --version | head -n 1); $(pkg-config --version)"
            echo "Rust toolchain: $(rustc --version)"
            xcodebuild -version | sed 's/^/Apple toolchain: /'
            echo "Runtime library names:"
            find "$prefix/lib" -maxdepth 1 \( -type f -o -type l \) \( -name 'libav*.dylib' -o -name 'libsw*.dylib' \) -exec basename {} \; | sort
          } > "$RUNNER_TEMP/FFMPEG-BUILD-INFO.txt"
          cat "$RUNNER_TEMP/FFMPEG-BUILD-INFO.txt"
          tar -czf "$RUNNER_TEMP/ffmpeg-8.1.3-install.tar.gz" -C "$RUNNER_TEMP" ffmpeg-8.1.3-install

      - name: Verify Phase 7 runtime hardening contracts
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          DYLD_LIBRARY_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: |
          cargo test --locked -p or_runtime
          cargo test --locked -p or_media
          cargo test --locked -p or_app_bridge
          cargo test --locked -p or_core --test project_recovery

      - name: Build the production media packaging probe
        env:
          FFMPEG_DIR: ${{ runner.temp }}/ffmpeg-8.1.3-install
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib/pkgconfig
        run: cargo build --locked --release --manifest-path tools/ffmpeg-link-probe/Cargo.toml

      - name: Build macOS app with Rust bridge and texture adapter
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: flutter build macos --debug

      - name: Package FFmpeg beside the desktop probe and verify runtime loading
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/apps/or_app/build/macos/Build/Products/Debug/or_app.app"
          bridge="$app/Contents/Frameworks/or_app_bridge.framework/Versions/A/or_app_bridge"
          runtime_dir="$(dirname "$bridge")"
          frameworks="$app/Contents/Frameworks"
          probe_source="$GITHUB_WORKSPACE/tools/ffmpeg-link-probe/target/release/ffmpeg-link-probe"
          probe="$runtime_dir/ffmpeg-link-probe"
          test -f "$bridge"
          test -f "$probe_source"
          mkdir -p "$frameworks"
          install -m 755 "$probe_source" "$probe"
          for pattern in libavcodec*.dylib libavformat*.dylib libavutil*.dylib libswresample*.dylib libswscale*.dylib; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$frameworks/"
          done
          test -f "$frameworks/libavutil.60.dylib"
          if ! otool -l "$bridge" | grep -Fq '@loader_path'; then
            install_name_tool -add_rpath @loader_path "$bridge"
          fi
          for library in "$runtime_dir"/libavcodec*.dylib "$runtime_dir"/libavformat*.dylib \
            "$runtime_dir"/libavutil*.dylib "$runtime_dir"/libswresample*.dylib "$runtime_dir"/libswscale*.dylib; do
            if [ -L "$library" ]; then continue; fi
            if ! otool -l "$library" | grep -Fq '@loader_path'; then
              install_name_tool -add_rpath @loader_path "$library"
            fi
          done
          if ! otool -l "$probe" | grep -Fq '@loader_path'; then
            install_name_tool -add_rpath @loader_path "$probe"
          fi
          codesign --force --deep --sign - --timestamp=none "$app"
          otool -L "$bridge"
          otool -l "$bridge" | grep -F '@loader_path'
          if otool -L "$bridge" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          if otool -l "$bridge" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          otool -L "$probe"
          otool -l "$probe" | grep -F '@loader_path'
          if otool -L "$probe" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          if otool -l "$probe" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH -u DYLD_ROOT_PATH "$probe"

      - name: Preserve macOS FFmpeg source and runtime provenance
        if: always() && steps.ffmpeg-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-8.1.3-macos
          path: |
            ${{ runner.temp }}/ffmpeg-8.1.3.tar.xz
            ${{ runner.temp }}/ffmpeg-8.1.3-install.tar.gz
            ${{ runner.temp }}/FFMPEG-BUILD-INFO.txt
            ${{ runner.temp }}/FFmpeg-COPYING.LGPLv2.1
          if-no-files-found: error
          retention-days: 14

      - name: Capture CLI bootstrap data
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          commands = {
              "app_info": ["version", "--json"],
              "health": ["health", "--json"],
              "capabilities": ["capabilities", "--json"],
          }
          snapshot = {}
          for key, arguments in commands.items():
              output = subprocess.check_output(
                  ["cargo", "run", "--quiet", "-p", "or_cli", "--", *arguments],
                  text=True,
              )
              snapshot[key] = json.loads(output)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file:
              file.write(
                  "OR_CLI_BOOTSTRAP_JSON="
                  + json.dumps(snapshot, separators=(",", ":"))
                  + "\n"
              )
          PY

      - name: Run native bridge diagnostics smoke test
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: >-
          flutter --ci test integration_test/native_bridge_diagnostics_test.dart -d macos
          --plain-name "native bridge diagnostics match the CLI snapshot"
          "--dart-define=OR_CLI_BOOTSTRAP_JSON=$OR_CLI_BOOTSTRAP_JSON"

      - name: Run native Flutter typed text bridge test
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: >-
          flutter --ci test integration_test/core_bridge_test.dart -d macos
          --plain-name
          "Rust project bridge stores editable titles and manual captions"

      - name: Run native Flutter project lifecycle tests
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: >-
          flutter --ci test integration_test/core_bridge_test.dart -d macos
          --name
          "^(native Flutter project lifecycle uses one Rust host|native media bridge persists offline media through undo and save|native timeline bridge edits, history, and save reopen use one Rust host)$"

      - name: Run native Flutter preview transport test
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: >-
          flutter --ci test integration_test/core_bridge_test.dart -d macos
          --plain-name
          "native preview transport keeps exact time and explicit rate"

  linux:
    name: Linux native build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libclang-dev libasound2-dev ninja-build pkg-config patchelf xz-utils libgtk-3-dev liblzma-dev zlib1g-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Install Flutter 3.47.5
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build and stage LGPL-only FFmpeg 8.1.3 shared libraries
        id: ffmpeg-build
        timeout-minutes: 30
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          source="$RUNNER_TEMP/ffmpeg-8.1.3"
          prefix="$RUNNER_TEMP/ffmpeg-8.1.3-install"
          curl --fail --location --silent --show-error --retry 3 --max-time 600 \
            https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz --output "$archive"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $archive" | sha512sum --check
          xz --test "$archive"
          tar -xJOf "$archive" ffmpeg-8.1.3/COPYING.LGPLv2.1 > "$RUNNER_TEMP/FFmpeg-COPYING.LGPLv2.1"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$source"
          read -r -a common_configure_args <<< "$FFMPEG_COMMON_CONFIGURE_ARGS"
          read -r -a helper_configure_args <<< "$FFMPEG_HELPER_CONFIGURE_ARGS"
          configure_args=("--prefix=$prefix" "${common_configure_args[@]}" "${helper_configure_args[@]}")
          ./configure "${configure_args[@]}"
          make -j2
          make install
          # The packaged 9B1 helpers must run and carry exactly the reviewed
          # capabilities; LD_LIBRARY_PATH covers the build prefix and
          # app-relative loading is proven at packaging time.
          test -x "$prefix/bin/ffmpeg"
          test -x "$prefix/bin/ffprobe"
          LD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffprobe" -hide_banner -version
          LD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -buildconf | grep -vq "enable-gpl"
          LD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -encoders | grep -q " png "
          LD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -encoders | grep -q " mpeg4 "
          LD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -muxers | grep -q " image2 "
          LD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -muxers | grep -q " image2pipe "
          LD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -filters | grep -qE "^ [A-Z.]{3} showwavespic "
          LD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -filters | grep -qE "^ [A-Z.]{3} scale "
          LD_LIBRARY_PATH="$prefix/lib" "$prefix/bin/ffmpeg" -hide_banner -filters | grep -qE "^ [A-Z.]{3} setpts "
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          mkdir -p "$HOME/.cargo"
          # Cargo config reaches Rust build scripts through Flutter's isolated native-assets hook.
          cat > "$HOME/.cargo/config.toml" <<EOF
          [build]
          rustflags = ["-C", "link-arg=-Wl,-rpath,\$ORIGIN"]

          [env]
          FFMPEG_DIR = { value = "$prefix", force = true }
          PKG_CONFIG_PATH = { value = "$prefix/lib/pkgconfig", force = true }
          EOF
          for library in avcodec avformat avutil swresample swscale; do
            test -f "$prefix/lib/pkgconfig/lib$library.pc"
          done
          echo "FFMPEG_INSTALL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"
          for library in avcodec avformat avutil swresample swscale; do
            pkg-config --modversion "lib$library"
            test "$(pkg-config --variable=prefix "lib$library")" = "$prefix"
          done
          {
            echo "Target: Linux $(uname -m)"
            echo "FFmpeg release: 8.1.3"
            echo "Rust binding: ffmpeg-the-third 6.0.0"
            echo "Official source URL: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
            echo "Official upstream tag commit: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7"
            echo "Source archive SHA-512: acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1"
            echo "Patch status: unpatched upstream release archive"
            echo 'Packaging modifications: copied shared libraries have ELF RUNPATH set to $ORIGIN; preserved install prefix remains unchanged'
            echo "Configure arguments: ${configure_args[*]}"
            echo "Enabled libraries: libavcodec, libavformat, libavutil, libswresample, libswscale"
            echo "Enabled programs: ffmpeg, ffprobe (9B1 packaged media helpers)"
            echo "Enabled protocols: file, pipe"
            echo "Enabled demuxers: matroska"
            echo "Enabled decoders: ffv1, pcm_s16le"
            echo "Enabled encoders: ffv1, pcm_s16le, png, mpeg4"
            echo "Enabled muxers: matroska, image2, image2pipe"
            echo "Enabled filters: setpts, scale, format, aformat, aresample, showwavespic"
            echo "License posture: LGPL 2.1-or-later configure default; GPL, version3, and nonfree were not enabled"
            echo "Compiler: $(cc --version | head -n 1)"
            echo "Build tools: $(make --version | head -n 1); $(pkg-config --version)"
            echo "Rust toolchain: $(rustc --version)"
            echo "Runtime library names:"
            find "$prefix/lib" -maxdepth 1 \( -type f -o -type l \) \( -name 'libav*.so*' -o -name 'libsw*.so*' \) -exec basename {} \; | sort
          } > "$RUNNER_TEMP/FFMPEG-BUILD-INFO.txt"
          cat "$RUNNER_TEMP/FFMPEG-BUILD-INFO.txt"
          tar -czf "$RUNNER_TEMP/ffmpeg-8.1.3-install.tar.gz" -C "$RUNNER_TEMP" ffmpeg-8.1.3-install

      - name: Build the production media packaging probe
        env:
          FFMPEG_DIR: ${{ runner.temp }}/ffmpeg-8.1.3-install
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib/pkgconfig
        run: cargo build --locked --release --manifest-path tools/ffmpeg-link-probe/Cargo.toml

      - name: Build Linux app with Rust bridge and texture adapter
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          LD_LIBRARY_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: flutter build linux --debug

      - name: Verify Phase 7 runtime hardening contracts
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          LD_LIBRARY_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: |
          cargo test --locked -p or_runtime
          cargo test --locked -p or_media
          cargo test --locked -p or_app_bridge
          cargo test --locked -p or_core --test project_recovery

      - name: Package FFmpeg beside the desktop probe and verify runtime loading
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/apps/or_app/build/linux/x64/debug/bundle"
          bridge="$(find "$bundle" -type f -name '*or_app_bridge*.so' -print -quit)"
          test -n "$bridge"
          runtime_dir="$(dirname "$bridge")"
          probe_source="$GITHUB_WORKSPACE/tools/ffmpeg-link-probe/target/release/ffmpeg-link-probe"
          probe="$runtime_dir/ffmpeg-link-probe"
          test -f "$probe_source"
          install -m 755 "$probe_source" "$probe"
          for pattern in libavcodec.so* libavformat.so* libavutil.so* libswresample.so* libswscale.so*; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
          done
          for library in "$runtime_dir"/libav*.so* "$runtime_dir"/libsw*.so*; do
            if [ -L "$library" ]; then continue; fi
            patchelf --set-rpath '$ORIGIN' "$library"
          done
          readelf -d "$probe" | grep -E 'NEEDED|RUNPATH'
          readelf -d "$probe" | grep -F '$ORIGIN'
          if readelf -d "$probe" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          for library in "$runtime_dir"/libav*.so* "$runtime_dir"/libsw*.so*; do
            if [ -L "$library" ]; then continue; fi
            readelf -d "$library" | grep -F '$ORIGIN'
          done
          readelf -d "$bridge" | grep -E 'NEEDED|RUNPATH'
          readelf -d "$bridge" | grep -F '$ORIGIN'
          env -u LD_LIBRARY_PATH python3 - "$bridge" <<'PY'
          import ctypes
          import sys

          ctypes.CDLL(sys.argv[1])
          PY
          env -u LD_LIBRARY_PATH "$probe"

      - name: Preserve Linux FFmpeg source and runtime provenance
        if: always() && steps.ffmpeg-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-8.1.3-linux
          path: |
            ${{ runner.temp }}/ffmpeg-8.1.3.tar.xz
            ${{ runner.temp }}/ffmpeg-8.1.3-install.tar.gz
            ${{ runner.temp }}/FFMPEG-BUILD-INFO.txt
            ${{ runner.temp }}/FFmpeg-COPYING.LGPLv2.1
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows native build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Set up MSYS2 FFmpeg build tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          path-type: inherit
          update: true
          install: make pkgconf mingw-w64-clang-x86_64-zlib
          pacboy: clang:p

      - name: Run project storage tests
        run: cargo test -p or_core --test project_storage

      - name: Run project recovery tests
        run: cargo test -p or_core --test project_recovery

      - name: Run persistent cache index tests
        run: cargo test -p or_core cache::tests

      - name: Run media artifact service tests with fake FFmpeg
        run: cargo test -p or_core media_artifacts::tests

      - name: Run real local IPC transport tests
        run: cargo test -p or_ipc --test local_transport

      - name: Run shared live-host transport tests
        run: cargo test -p or_ipc --test live_host

      - name: Run attached CLI shared-host parity tests
        run: cargo test -p or_cli --test semantic_cli

      - name: Verify Windows local endpoint access controls
        run: cargo test -p or_ipc --lib

      - name: Install Flutter 3.47.5
        shell: pwsh
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ((git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD).Trim() -ne "6a19cca56475dbfba1478ee68d7bd0c2ef891da1") { throw "Flutter revision mismatch" }
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build and stage LGPL-only FFmpeg 8.1.3 shared libraries
        id: ffmpeg-build
        shell: msys2 {0}
        timeout-minutes: 40
        run: |
          set -euo pipefail
          temp="$(cygpath -u "$RUNNER_TEMP")"
          archive="$temp/ffmpeg-8.1.3.tar.xz"
          source="$temp/ffmpeg-8.1.3"
          prefix="$temp/ffmpeg-8.1.3-install"
          prefix_win="$(cygpath -am "$prefix")"
          curl --fail --location --silent --show-error --retry 3 --max-time 600 \
            https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz --output "$archive"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $archive" | sha512sum --check
          xz --test "$archive"
          tar -xJOf "$archive" ffmpeg-8.1.3/COPYING.LGPLv2.1 > "$temp/FFmpeg-COPYING.LGPLv2.1"
          tar -xJf "$archive" -C "$temp"
          cd "$source"
          read -r -a common_configure_args <<< "$FFMPEG_COMMON_CONFIGURE_ARGS"
          read -r -a helper_configure_args <<< "$FFMPEG_HELPER_CONFIGURE_ARGS"
          configure_args=("--prefix=$prefix_win" --toolchain=msvc --target-os=win64 --arch=x86_64 "${common_configure_args[@]}" "${helper_configure_args[@]}")
          ./configure "${configure_args[@]}"
          make -j2
          make install
          # The packaged 9B1 helpers must run and carry exactly the reviewed
          # capabilities; the install bin directory holds the helper DLLs, and
          # app-side loading is proven at packaging time.
          test -x "$prefix/bin/ffmpeg.exe"
          test -x "$prefix/bin/ffprobe.exe"
          PATH="$prefix/bin:$PATH" "$prefix/bin/ffprobe.exe" -hide_banner -version
          PATH="$prefix/bin:$PATH" "$prefix/bin/ffmpeg.exe" -hide_banner -buildconf | grep -vq "enable-gpl"
          PATH="$prefix/bin:$PATH" "$prefix/bin/ffmpeg.exe" -hide_banner -encoders | grep -q " png "
          PATH="$prefix/bin:$PATH" "$prefix/bin/ffmpeg.exe" -hide_banner -encoders | grep -q " mpeg4 "
          PATH="$prefix/bin:$PATH" "$prefix/bin/ffmpeg.exe" -hide_banner -muxers | grep -q " image2 "
          PATH="$prefix/bin:$PATH" "$prefix/bin/ffmpeg.exe" -hide_banner -muxers | grep -q " image2pipe "
          PATH="$prefix/bin:$PATH" "$prefix/bin/ffmpeg.exe" -hide_banner -filters | grep -qE "^ [A-Z.]{3} showwavespic "
          PATH="$prefix/bin:$PATH" "$prefix/bin/ffmpeg.exe" -hide_banner -filters | grep -qE "^ [A-Z.]{3} scale "
          PATH="$prefix/bin:$PATH" "$prefix/bin/ffmpeg.exe" -hide_banner -filters | grep -qE "^ [A-Z.]{3} setpts "
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          for library in avcodec avformat avutil swresample swscale; do
            test -f "$prefix/lib/pkgconfig/lib$library.pc"
          done
          for library in avcodec avformat avutil swresample swscale; do
            if [ -f "$prefix/lib/$library.lib" ]; then continue; fi
            import_library="$(find "$prefix/lib" "$prefix/bin" -maxdepth 1 -type f -name "$library*.lib" -print -quit)"
            test -n "$import_library"
            cp "$import_library" "$prefix/lib/$library.lib"
          done
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          libclang_path="$(cygpath -am /clang64/bin)"
          mkdir -p "$workspace/.cargo"
          # Project config is discovered even when Flutter's isolated hook filters CARGO_HOME.
          cat > "$workspace/.cargo/config.toml" <<EOF
          [env]
          FFMPEG_DIR = { value = "$prefix_win", force = true }
          PKG_CONFIG_PATH = { value = "$prefix_win/lib/pkgconfig", force = true }
          LIBCLANG_PATH = { value = "$libclang_path", force = true }
          EOF
          echo "FFMPEG_INSTALL_PREFIX=$prefix_win" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"
          echo "INCLUDE=$prefix_win/include;$INCLUDE" >> "$GITHUB_ENV"
          echo "LIB=$prefix_win/lib;$prefix_win/bin;$LIB" >> "$GITHUB_ENV"
          echo "$prefix_win/bin" >> "$GITHUB_PATH"
          for library in avcodec avformat avutil swresample swscale; do
            pkg-config --modversion "lib$library"
            pkg_config_prefix="$(pkg-config --variable=prefix "lib$library" | tr '\\' '/')"
            test "${pkg_config_prefix,,}" = "${prefix_win,,}"
          done
          {
            echo "Target: Windows x86_64 (MSVC)"
            echo "FFmpeg release: 8.1.3"
            echo "Rust binding: ffmpeg-the-third 6.0.0"
            echo "Official source URL: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
            echo "Official upstream tag commit: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7"
            echo "Source archive SHA-512: acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1"
            echo "Patch status: unpatched upstream release archive"
            echo "Packaging modifications: exposes MSVC import-library aliases and copies DLLs beside the desktop media probe; preserved install prefix remains otherwise unchanged"
            echo "Configure arguments: ${configure_args[*]}"
            echo "Enabled libraries: libavcodec, libavformat, libavutil, libswresample, libswscale"
            echo "Enabled programs: ffmpeg, ffprobe (9B1 packaged media helpers)"
            echo "Enabled protocols: file, pipe"
            echo "Enabled demuxers: matroska"
            echo "Enabled decoders: ffv1, pcm_s16le"
            echo "Enabled encoders: ffv1, pcm_s16le, png, mpeg4"
            echo "Enabled muxers: matroska, image2, image2pipe"
            echo "Enabled filters: setpts, scale, format, aformat, aresample, showwavespic"
            echo "License posture: LGPL 2.1-or-later configure default; GPL, version3, and nonfree were not enabled"
            echo "Packaging modifications: versionless MSVC import-library aliases are copied for Rust linking; upstream import libraries and DLLs are retained"
            echo "MSVC import library names exposed to Rust: avcodec.lib, avformat.lib, avutil.lib, swresample.lib, swscale.lib"
            echo "Compiler: $(cl 2>&1 | head -n 1 || true)"
            echo "Compiler version: ${VCToolsVersion:-unknown}"
            echo "Build tools: $(make --version | head -n 1); $(pkg-config --version)"
            echo "Rust toolchain: $(rustc --version)"
            echo "Runtime library names:"
            (cd "$prefix/bin" && printf '%s\n' avcodec*.dll avformat*.dll avutil*.dll swresample*.dll swscale*.dll | sort)
          } > "$temp/FFMPEG-BUILD-INFO.txt"
          cat "$temp/FFMPEG-BUILD-INFO.txt"
          tar -czf "$temp/ffmpeg-8.1.3-install.tar.gz" -C "$temp" ffmpeg-8.1.3-install

      - name: Build the production media packaging probe
        shell: msys2 {0}
        run: |
          prefix="$(cygpath -u "$FFMPEG_INSTALL_PREFIX")"
          msvc_linker_dir="$(cygpath -u "$VCToolsInstallDir")"
          msvc_linker_dir="${msvc_linker_dir%/}/bin/Hostx64/x64"
          export PATH="$msvc_linker_dir:$PATH"
          test "$(command -v link.exe)" = "$msvc_linker_dir/link.exe"
          export FFMPEG_DIR="$FFMPEG_INSTALL_PREFIX"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          cargo build --locked --release --manifest-path tools/ffmpeg-link-probe/Cargo.toml

      - name: Expose clang64 DLLs to Flutter's native-assets hook
        shell: msys2 {0}
        run: echo "$LIBCLANG_PATH" >> "$GITHUB_PATH"

      - name: Verify Phase 7 runtime hardening contracts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          prefix="$(cygpath -u "$FFMPEG_INSTALL_PREFIX")"
          msvc_linker_dir="$(cygpath -u "$VCToolsInstallDir")"
          msvc_linker_dir="${msvc_linker_dir%/}/bin/Hostx64/x64"
          export PATH="$msvc_linker_dir:$FFMPEG_INSTALL_PREFIX/bin:$PATH"
          test "$(command -v link.exe)" = "$msvc_linker_dir/link.exe"
          export FFMPEG_DIR="$FFMPEG_INSTALL_PREFIX"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          cargo test --locked -p or_runtime
          cargo test --locked -p or_media
          cargo test --locked -p or_app_bridge
          cargo test --locked -p or_core --test project_recovery

      - name: Build Windows app with Rust bridge and texture adapter
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: flutter build windows --debug --verbose

      - name: Package FFmpeg beside the desktop probe and verify runtime loading
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'apps/or_app/build/windows/x64/runner/Debug'
          if (-not (Test-Path $bundle -PathType Container)) { throw 'Windows app bundle directory not found' }
          $bridge = Get-ChildItem -Path $env:GITHUB_WORKSPACE/apps/or_app/build/windows -Filter '*or_app_bridge*.dll' -Recurse | Select-Object -First 1
          if ($null -eq $bridge) { throw 'Packaged or_app_bridge DLL not found' }
          $runtimeDir = $bridge.Directory.FullName
          $probeSource = Join-Path $env:GITHUB_WORKSPACE 'tools/ffmpeg-link-probe/target/release/ffmpeg-link-probe.exe'
          if (-not (Test-Path $probeSource -PathType Leaf)) { throw 'Production or_media FFmpeg probe was not built' }
          $probe = Join-Path $runtimeDir 'ffmpeg-link-probe.exe'
          Copy-Item -Path $probeSource -Destination $probe -Force
          $destinations = @($runtimeDir)
          if ($bundle -ne $runtimeDir) { $destinations += $bundle }
          foreach ($pattern in @('avcodec*.dll', 'avformat*.dll', 'avutil*.dll', 'swresample*.dll', 'swscale*.dll')) {
            $libraries = Get-ChildItem -Path "$env:FFMPEG_INSTALL_PREFIX/bin" -Filter $pattern -File
            if ($libraries.Count -eq 0) { throw "FFmpeg runtime library missing: $pattern" }
            foreach ($destination in $destinations) {
              Copy-Item -Path $libraries.FullName -Destination $destination -Force
            }
          }
          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          & $dumpbin /dependents $probe
          $env:PATH = "$runtimeDir;$bundle;$env:SystemRoot\System32;$env:SystemRoot"
          $bridgeHandle = [System.Runtime.InteropServices.NativeLibrary]::Load($bridge.FullName)
          [System.Runtime.InteropServices.NativeLibrary]::Free($bridgeHandle)
          & $probe

      - name: Preserve Windows FFmpeg source and runtime provenance
        if: always() && steps.ffmpeg-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-8.1.3-windows-x64
          path: |
            ${{ runner.temp }}/ffmpeg-8.1.3.tar.xz
            ${{ runner.temp }}/ffmpeg-8.1.3-install.tar.gz
            ${{ runner.temp }}/FFMPEG-BUILD-INFO.txt
            ${{ runner.temp }}/FFmpeg-COPYING.LGPLv2.1
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install FFmpeg cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config unzip xz-utils

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android platform, Rust NDK, and x86_64 emulator
        run: >-
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          "ndk;28.2.13676358" "emulator"
          "system-images;android-36;google_apis;x86_64"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Flutter 3.47.5
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Build and cross-link LGPL-only FFmpeg 8.1.3 for Android
        id: android-ffmpeg-build
        timeout-minutes: 75
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          build_root="$RUNNER_TEMP/android-ffmpeg"
          info_root="$RUNNER_TEMP/android-ffmpeg-build-info"
          jni_root="$GITHUB_WORKSPACE/apps/or_app/android/app/src/main/jniLibs"
          mkdir -p "$build_root/install" "$build_root/probes" "$info_root"
          curl --fail --location --silent --show-error --retry 3 --max-time 600 \
            https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz --output "$archive"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $archive" | sha512sum --check
          xz --test "$archive"
          tar -xJOf "$archive" ffmpeg-8.1.3/COPYING.LGPLv2.1 > "$RUNNER_TEMP/FFmpeg-COPYING.LGPLv2.1"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            case "$abi" in
              arm64-v8a)
                rust_target=aarch64-linux-android
                linker_env=CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
                ffmpeg_arch=aarch64
                clang_prefix=aarch64-linux-android
                cpu_args=()
                ;;
              armeabi-v7a)
                rust_target=armv7-linux-androideabi
                linker_env=CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
                ffmpeg_arch=arm
                clang_prefix=armv7a-linux-androideabi
                cpu_args=(--cpu=armv7-a)
                ;;
              x86_64)
                rust_target=x86_64-linux-android
                linker_env=CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
                ffmpeg_arch=x86_64
                clang_prefix=x86_64-linux-android
                cpu_args=()
                ;;
            esac

            clang="$toolchain/bin/${clang_prefix}21-clang"
            clangxx="$toolchain/bin/${clang_prefix}21-clang++"
            target_suffix="${rust_target//-/_}"
            cc_env="CC_$target_suffix"
            ar_env="AR_$target_suffix"
            bindgen_env="BINDGEN_EXTRA_CLANG_ARGS_$target_suffix"
            prefix="$build_root/install/$abi"
            probe_dir="$build_root/probes/$abi"
            jni_dir="$jni_root/$abi"
            test -x "$clang"
            test -x "$clangxx"

            rm -rf "$RUNNER_TEMP/ffmpeg-8.1.3"
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            cd "$RUNNER_TEMP/ffmpeg-8.1.3"
            read -r -a common_configure_args <<< "$FFMPEG_COMMON_CONFIGURE_ARGS"
            configure_args=(
              "--prefix=$prefix"
              --target-os=android
              "--arch=$ffmpeg_arch"
              --enable-cross-compile
              --enable-pic
              "--cc=$clang"
              "--cxx=$clangxx"
              "--ar=$toolchain/bin/llvm-ar"
              "--nm=$toolchain/bin/llvm-nm"
              "--ranlib=$toolchain/bin/llvm-ranlib"
              "--strip=$toolchain/bin/llvm-strip"
              "${cpu_args[@]}"
              "${common_configure_args[@]}"
            )
            ./configure "${configure_args[@]}"
            make -j2
            make install

            pkg_config_path="$prefix/lib/pkgconfig"
            for library in avcodec avformat avutil swresample swscale; do
              test -f "$pkg_config_path/lib$library.pc"
              PKG_CONFIG_PATH="$pkg_config_path" PKG_CONFIG_ALLOW_CROSS=1 pkg-config --modversion "lib$library"
              test "$(PKG_CONFIG_PATH="$pkg_config_path" PKG_CONFIG_ALLOW_CROSS=1 pkg-config --variable=prefix "lib$library")" = "$prefix"
            done

            env "$linker_env=$clang" "$cc_env=$clang" \
              "$ar_env=$toolchain/bin/llvm-ar" \
              "$bindgen_env=--target=$rust_target --sysroot=$toolchain/sysroot" \
              FFMPEG_DIR="$prefix" \
              PKG_CONFIG_PATH="$pkg_config_path" \
              PKG_CONFIG_ALLOW_CROSS=1 \
              cargo build --locked --release --target "$rust_target" \
                --manifest-path "$GITHUB_WORKSPACE/tools/ffmpeg-link-probe/Cargo.toml"
            probe="$GITHUB_WORKSPACE/tools/ffmpeg-link-probe/target/$rust_target/release/ffmpeg-link-probe"
            test -f "$probe"
            mkdir -p "$probe_dir" "$jni_dir"
            install -m 755 "$probe" "$probe_dir/ffmpeg-link-probe"

            for library in avcodec avformat avutil swresample swscale; do
              shared="$prefix/lib/lib$library.so"
              test -f "$shared"
              soname="$("$toolchain/bin/llvm-readelf" -d "$shared" | sed -n 's/.*Library soname: \[\([^]]*\)\].*/\1/p')"
              test -n "$soname"
              test -f "$prefix/lib/$soname"
              for runtime in "$prefix/lib/lib$library.so"*; do
                test -e "$runtime" || continue
                cp -L "$runtime" "$jni_dir/$(basename "$runtime")"
              done
            done

            {
              echo "Target: Android $abi ($rust_target)"
              echo "NDK: 28.2.13676358"
              echo "FFmpeg release: 8.1.3"
              echo "Rust binding: ffmpeg-the-third 6.0.0"
              echo "Official source URL: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
              echo "Official upstream tag commit: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7"
              echo "Source archive SHA-512: acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1"
              echo "Patch status: unpatched upstream release archive"
              echo "Configure arguments: ${configure_args[*]}"
              echo "Enabled libraries: libavcodec, libavformat, libavutil, libswresample, libswscale"
              echo "Enabled protocols: file"
              echo "Enabled demuxers: matroska"
              echo "Enabled decoders: ffv1, pcm_s16le"
              echo "Enabled encoders: ffv1, pcm_s16le"
              echo "Enabled muxers: matroska"
              echo "License posture: LGPL 2.1-or-later configure default; GPL, version3, and nonfree were not enabled"
              echo "Compiler: $("$clang" --version | head -n 1)"
              echo "Build tools: $(make --version | head -n 1); $(pkg-config --version)"
              echo "Rust toolchain: $(rustc --version)"
              echo "Runtime library names:"
              find "$prefix/lib" -maxdepth 1 \( -type f -o -type l \) -name 'lib*.so*' -exec basename {} \; | sort
            } > "$info_root/$abi.txt"
            cat "$info_root/$abi.txt"
            cd "$RUNNER_TEMP"
          done

      - name: Verify Android bridge links the bounded software preview
        run: |
          set -euo pipefail
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            android_tree="$(cargo tree --locked -p or_app_bridge --target "$target" --edges normal)"
            if ! grep -E 'or_media|or_render|ffmpeg-the-third' <<< "$android_tree"; then
              echo "Android software preview dependency missing from or_app_bridge for $target"
              exit 1
            fi
          done

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Expose staged Android FFmpeg libraries to the build hook
        working-directory: apps/or_app
        run: |
          set -euo pipefail
          install_link=android/.ffmpeg-install
          test ! -e "$install_link" && test ! -L "$install_link"
          ln -s "$RUNNER_TEMP/android-ffmpeg/install" "$install_link"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "$install_link/$abi/lib/pkgconfig/libavcodec.pc"
            test -f "$install_link/$abi/include/libavcodec/avcodec.h"
          done

      - name: Build debug APK with FFmpeg shared libraries for all ABIs
        working-directory: apps/or_app
        run: flutter build apk --debug --target-platform android-arm,android-arm64,android-x64

      - name: Verify Android APK contains FFmpeg libraries for all ABIs
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/apps/or_app/build/app/outputs/flutter-apk/app-debug.apk"
          toolchain="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64"
          test -f "$apk"
          apk_entries="$(unzip -Z1 "$apk")"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            prefix="$RUNNER_TEMP/android-ffmpeg/install/$abi"
            grep -Fxq "lib/$abi/libor_viewer_texture_jni.so" <<< "$apk_entries"
            grep -Fxq "lib/$abi/libor_app_bridge.so" <<< "$apk_entries"
            for library in avcodec avformat avutil swresample swscale; do
              shared="$prefix/lib/lib$library.so"
              soname="$("$toolchain/bin/llvm-readelf" -d "$shared" | sed -n 's/.*Library soname: \[\([^]]*\)\].*/\1/p')"
              test -n "$soname"
              grep -Fxq "lib/$abi/lib$library.so" <<< "$apk_entries"
              grep -Fxq "lib/$abi/$soname" <<< "$apk_entries"
            done
          done

      - name: Check Android SAF report rejection guards
        run: python3 scripts/test_android_saf_preview_report.py

      - name: Check Android disconnect classification guards
        run: python3 scripts/test_classify_android_disconnect.py

      - name: Check Android guest readiness gate guards
        run: bash scripts/test_android_guest_readiness_gate.sh

      - name: Check Android native DocumentsUI selection guards
        run: python3 scripts/test_select_android_saf_document.py

      - name: Build separate permission-enforced SAF acceptance provider
        working-directory: apps/or_app/android
        run: ./gradlew -PorSafFixture=true :saf_fixture:assembleDebug

      - name: Capture Android CLI bootstrap data
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          commands = {
              "app_info": ["version", "--json"],
              "health": ["health", "--json"],
              "capabilities": ["capabilities", "--json"],
          }
          snapshot = {}
          for key, arguments in commands.items():
              output = subprocess.check_output(
                  ["cargo", "run", "--quiet", "-p", "or_cli", "--", *arguments],
                  text=True,
              )
              snapshot[key] = json.loads(output)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file:
              file.write(
                  "OR_CLI_BOOTSTRAP_JSON="
                  + json.dumps(snapshot, separators=(",", ":"))
                  + "\n"
              )
          PY

      - name: Verify FFmpeg runtime and Flutter Rust bridge on x86_64 emulator
        timeout-minutes: 30
        run: |
          set -euo pipefail
          avd_name=or-api36-x86_64
          android_device_id=emulator-5554
          export OR_AVD_NAME="$avd_name"
          export OR_ANDROID_DEVICE_ID="$android_device_id"

          # Every Android case is built before any emulator starts. Each case has
          # its own Dart entrypoint, so each gets its own APK. Driving those
          # prebuilt binaries keeps Gradle and the Kotlin daemons out of the
          # software-rendered emulator phase: the hosted VM service connection was
          # repeatedly lost while ~4 GiB of build JVMs stayed resident next to
          # SwiftShader qemu, and load stayed at 23+ instead of falling.
          case_apks="$RUNNER_TEMP/android-case-apks"
          mkdir -p "$case_apks"
          build_case_apk() {
            local name="$1" entrypoint="$2" apk
            shift 2
            cd "$GITHUB_WORKSPACE/apps/or_app"
            flutter build apk --debug --target "$entrypoint" "$@"
            apk="$case_apks/$name.apk"
            cp build/app/outputs/flutter-apk/app-debug.apk "$apk"
            test -s "$apk"
          }
          build_case_apk diagnostics integration_test/native_bridge_diagnostics_test.dart \
            "--dart-define=OR_CLI_BOOTSTRAP_JSON=$OR_CLI_BOOTSTRAP_JSON"
          build_case_apk surface integration_test/android_preview_surface_test.dart
          build_case_apk saf integration_test/android_saf_preview_test.dart
          cd "$GITHUB_WORKSPACE/apps/or_app/android"
          ./gradlew --stop
          cd "$GITHUB_WORKSPACE/apps/or_app"

          bash "$GITHUB_WORKSPACE/scripts/start-android-emulator.sh"
          {
            echo 'Device API level: '"$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo 'Emulator ABI: '"$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
            echo 'GPU path: Android API 36 x86_64 emulator with SwiftShader (-gpu swiftshader_indirect)'
            echo 'Presentation path: Rust bounded RGBA lease -> reusable Android Bitmap -> Flutter SurfaceProducer'
            echo 'Queue budgets: render 4 frames / 256 MiB; audio 256 frames / 32 MiB; decode 16 frames / 256 MiB; viewer 3 outstanding leases'
            echo 'Presenter bound: one copied/pending frame, 8 pending callers, 8 queued operations, 64 active SAF sources, frame <=1920x1080 and <=16 MiB'
            echo 'Cancellation: Rust preview generation invalidation; stale frames dropped before presentation'
            echo 'Fallback telemetry: integration log records frame sequence, dimensions, preview error, surface result, and revision stability'
            echo 'ANDROID_HARDWARE_MEDIA=UNVERIFIED (no physical device, MediaCodec, or HardwareBuffer run)'
          } > "$RUNNER_TEMP/android-render-matrix.txt"
          cat "$RUNNER_TEMP/android-render-matrix.txt"
          cat "$RUNNER_TEMP/android-render-matrix.txt" >> "$GITHUB_STEP_SUMMARY"

          run_ffmpeg_runtime_probe() {
            local apk="$case_apks/diagnostics.apk"
            local runtime_dir="$RUNNER_TEMP/android-apk-ffmpeg-x86_64"
            local probe="$RUNNER_TEMP/android-ffmpeg/probes/x86_64/ffmpeg-link-probe"
            mkdir -p "$runtime_dir"
            unzip -jo "$apk" 'lib/x86_64/libav*.so*' 'lib/x86_64/libsw*.so*' -d "$runtime_dir" || return $?
            test -f "$probe" || return $?
            adb shell mkdir -p /data/local/tmp/ffmpeg-runtime || return $?
            for library in "$runtime_dir"/*; do
              adb push "$library" "/data/local/tmp/ffmpeg-runtime/$(basename "$library")" || return $?
            done
            adb push "$probe" /data/local/tmp/ffmpeg-link-probe || return $?
            adb shell chmod 755 /data/local/tmp/ffmpeg-link-probe || return $?
            adb shell 'LD_LIBRARY_PATH=/data/local/tmp/ffmpeg-runtime /data/local/tmp/ffmpeg-link-probe'
          }
          run_ffmpeg_runtime_probe
          bash "$GITHUB_WORKSPACE/scripts/run-android-preview-check.sh" diagnostics \
            integration_test/native_bridge_diagnostics_test.dart test_driver/integration_test.dart \
            "$case_apks/diagnostics.apk" --keep-app-running
          # Each case gets its own guest. This guest wedged after a single OR
          # drive in run 37429541846: qemu held 217% CPU and 3.48 GiB RSS while
          # the guest stopped answering adb, with 11.8 GiB MemAvailable and no OR
          # fatal signal, ANR, or tombstone. The surviving case always precedes
          # the failure, so the wedge is accumulated guest state under
          # SwiftShader, not a product fault and not host memory exhaustion.
          # The surface case reads its fixture from the app's private files
          # directory, so the app must be installed before `run-as` stages it.
          # Both cases share this one explicitly sized guest: the SAF step boots
          # its own, and booting a guest per case does not fit one step's
          # timeout (run 37445482157 timed out on the second boot).
          adb push "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny.mkv" /data/local/tmp/or-android-preview-tiny.mkv
          adb shell run-as io.github.huou07.or_app mkdir -p files
          adb shell run-as io.github.huou07.or_app cp /data/local/tmp/or-android-preview-tiny.mkv files/or-android-preview-tiny.mkv
          bash "$GITHUB_WORKSPACE/scripts/run-android-preview-check.sh" surface \
            integration_test/android_preview_surface_test.dart test_driver/integration_test.dart \
            "$case_apks/surface.apk"
          bash "$GITHUB_WORKSPACE/scripts/stop-android-emulator.sh"

      - name: Verify Android SAF preview user journey and resource bounds
        timeout-minutes: 30
        env:
          OR_ANDROID_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/android-saf-acceptance
        run: |
          set -euo pipefail
          export OR_AVD_NAME=or-api36-x86_64
          export OR_ANDROID_DEVICE_ID=emulator-5554
          bash "$GITHUB_WORKSPACE/scripts/start-android-emulator.sh" wipe-data
          fixture_apk="$GITHUB_WORKSPACE/apps/or_app/build/saf_fixture/outputs/apk/debug/saf_fixture-debug.apk"
          test -f "$fixture_apk"
          adb -s emulator-5554 install "$fixture_apk"
          mkdir -p "$OR_ANDROID_ACCEPTANCE_OUTPUT"
          # Built with the emulator step above; this step reuses that exact APK.
          # The guest is fresh here: the SAF journey is the real product proof and
          # must not inherit a wedged emulator from earlier cases.
          case_apks="$RUNNER_TEMP/android-case-apks"
          test -s "$case_apks/saf.apk"
          bash "$GITHUB_WORKSPACE/scripts/run-android-preview-check.sh" saf \
            integration_test/android_saf_preview_test.dart test_driver/android_saf_preview.dart \
            "$case_apks/saf.apk"
          test -s "$OR_ANDROID_ACCEPTANCE_OUTPUT/documents-ui-selection.txt"
          for image in saf-editor-texture saf-editor-permission-recovered saf-surface-recreated; do
            test -s "$OR_ANDROID_ACCEPTANCE_OUTPUT/$image.png"
          done
          python3 scripts/verify_android_saf_preview.py "$OR_ANDROID_ACCEPTANCE_OUTPUT/report.json" \
            | tee "$OR_ANDROID_ACCEPTANCE_OUTPUT/verification.txt"
          cat "$OR_ANDROID_ACCEPTANCE_OUTPUT/verification.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize Android disconnect classifications
        if: always()
        run: |
          set -uo pipefail
          found=0
          for report in "$RUNNER_TEMP"/android-disconnect-*.json; do
            [[ -e "$report" ]] || continue
            found=1
            echo "### $(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ "$found" != 1 ]]; then
            echo "No disconnect classification was produced; no Android drive case failed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop Android verification emulator
        if: always()
        run: bash "$GITHUB_WORKSPACE/scripts/stop-android-emulator.sh"

      - name: Preserve Android FFmpeg source and build provenance
        if: always() && steps.android-ffmpeg-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-8.1.3-android
          path: |
            ${{ runner.temp }}/ffmpeg-8.1.3.tar.xz
            ${{ runner.temp }}/FFmpeg-COPYING.LGPLv2.1
            ${{ runner.temp }}/android-ffmpeg/**
            ${{ runner.temp }}/android-ffmpeg-build-info/**
            ${{ runner.temp }}/android-render-matrix.txt
            ${{ runner.temp }}/android-emulator.log
            ${{ runner.temp }}/android-driver-*.log
            ${{ runner.temp }}/android-guest-*.log
            ${{ runner.temp }}/android-health-*.log
            ${{ runner.temp }}/android-state-*.txt
            ${{ runner.temp }}/android-documents-ui.log
            ${{ runner.temp }}/android-disconnect-*.json
            ${{ runner.temp }}/android-saf-acceptance/**
          if-no-files-found: error
          retention-days: 14

  granted-descriptor-capability:
    name: Granted descriptor capability boundary
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove a granted content:// FD cannot be reopened by path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import errno, json, os, subprocess, tempfile
          # Phase 9 duplicates a granted, bounded, seekable descriptor instead of
          # reopening the provider path. This proves that is required rather than
          # merely convenient: the same bytes read through the inherited FD, but
          # a cross-UID /proc reopen is denied.
          child = '''import errno, json, os
          info = os.fstat(0)
          direct = os.pread(0, 32, 0)
          error = None
          try:
              fd = os.open("/proc/self/fd/0", os.O_RDONLY)
              os.close(fd)
          except OSError as failure:
              error = failure.errno
          print(json.dumps({"reader_uid": os.getuid(), "file_owner_uid": info.st_uid,
                            "file_mode": oct(info.st_mode & 0o777),
                            "direct_read_bytes": len(direct), "proc_reopen_errno": error}))
          assert os.getuid() != info.st_uid
          assert len(direct) == 32
          assert error == errno.EACCES
          '''
          with tempfile.TemporaryDirectory(prefix="or-fd-permission-") as directory:
              path = Path(directory) / "private.mkv"
              path.write_bytes(Path("crates/or_media/tests/fixtures/tiny.mkv").read_bytes())
              path.chmod(0o600)
              with path.open("rb") as granted:
                  output = subprocess.check_output(
                      ["sudo", "-u", "nobody", "python3", "-c", child], stdin=granted, text=True)
              print(output)
              Path(os.environ["RUNNER_TEMP"], "descriptor-permission.json").write_text(output)
          PY

      - name: Preserve granted descriptor discriminator result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: granted-descriptor-capability
          path: ${{ runner.temp }}/descriptor-permission.json
          if-no-files-found: error
          retention-days: 14
