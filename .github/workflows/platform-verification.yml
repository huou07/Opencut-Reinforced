name: Platform verification

on:
  pull_request:
  # The merge queue runs the same matrix against the merge-group ref, so the
  # aggregate release-gate below is evaluated for the exact tree that would land.
  merge_group:
  push:
    branches:
      - main
    paths-ignore:
      - docs/archive/execution/STATE.json
      - docs/archive/execution/evidence/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_COMMON_CONFIGURE_ARGS: >-
    --disable-static
    --enable-shared
    --disable-programs
    --disable-doc
    --disable-autodetect
    --disable-everything
    --disable-asm
    --disable-avdevice
    --disable-avfilter
    --enable-protocol=file
    --enable-demuxer=matroska,mov,wav,mp3,ogg,flac,aiff,avi,image2,image2pipe,png_pipe,jpeg_pipe,webp_pipe
    --enable-muxer=matroska,mov,mp4
    --enable-decoder=ffv1,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,pcm_s24be,pcm_s16be,h264,hevc,av1,vp8,vp9,prores,aac,mp3,mp3float,opus,vorbis,flac,alac,ac3,eac3,mpeg4,png,mjpeg,webp
    --enable-parser=h264,hevc,av1,vp8,vp9,vorbis,flac,ac3,mpegaudio,aac,mp3
    --enable-encoder=ffv1,pcm_s16le
  # Desktop-only additions for packaged FFmpeg helper executables. These arrive
  # after the common arguments so the program, filter-library, and component
  # enables win over the minimal defaults, and list options accumulate. Every
  # additions except the system zlib compression library are native
  # FFmpeg components under the same LGPL-2.1-or-later posture;
  # see the 9B1 review in docs/reference/security-licensing.md. Android and the Rust link
  # probe keep the minimal library-only build. The Android export profile below
  # is enabled separately after its pinned static codecs are built.
  FFMPEG_HELPER_CONFIGURE_ARGS: >-
    --enable-ffmpeg
    --enable-ffprobe
    --enable-avfilter
    --enable-zlib
    --enable-protocol=pipe
    --enable-encoder=png
    --enable-encoder=mpeg4
    --enable-muxer=image2
    --enable-muxer=image2pipe
    --enable-filter=scale
    --enable-filter=setpts
    --enable-filter=format
    --enable-filter=aformat
    --enable-filter=aresample
    --enable-filter=showwavespic
    --enable-filter=afftdn
    --enable-muxer=wav
  # Reused desktop/Android delivery profile; each target enables it only after
  # staging the exact libvpx/libopus source pins and notices.
  FFMPEG_EXPORT_CONFIGURE_ARGS: >-
    --pkg-config-flags=--static
    --enable-libvpx
    --enable-libopus
    --enable-muxer=webm
    --enable-encoder=libvpx_vp9,libopus,aac

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install FFmpeg tools and link-probe build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential clang libclang-dev libasound2-dev pkg-config xz-utils
          ffmpeg -version
          ffprobe -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Build LGPL-only FFmpeg 8.1.3 shared libraries for the link probe
        timeout-minutes: 15
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          source="$RUNNER_TEMP/ffmpeg-8.1.3"
          prefix="$RUNNER_TEMP/ffmpeg-8.1.3-install"
          curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 --max-time 120 \
            https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz --output "$archive"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$source"
          read -r -a configure_args <<< "$FFMPEG_COMMON_CONFIGURE_ARGS"
          ./configure "--prefix=$prefix" "${configure_args[@]}"
          make -j2
          make install
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          for library in avcodec avformat avutil swresample swscale; do
            pkg-config --modversion "lib$library"
            test "$(pkg-config --variable=prefix "lib$library")" = "$prefix"
          done
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Compile, link, and load the FFmpeg Rust binding probe
        timeout-minutes: 10
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
        run: cargo run --locked --release --manifest-path tools/ffmpeg-link-probe/Cargo.toml

      - name: Verify production software decode against linked FFmpeg
        timeout-minutes: 10
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
        run: cargo test --locked -p or_media --test software_decode

      - name: Verify fixed-profile software export against linked FFmpeg
        timeout-minutes: 10
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
        run: cargo test --locked -p or_media --test software_export -- --skip writer_publishes_mp4_with_videotoolbox_h264_and_aac_streams

      - name: Verify Phase 7 runtime hardening contracts
        run: |
          cargo test --locked -p or_runtime
          cargo test --locked -p or_app_bridge
          cargo test --locked -p or_core --test project_recovery

      - name: Verify deterministic audio clock and synchronization
        timeout-minutes: 10
        run: cargo test --locked -p or_audio

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Prepare system media helpers outside the linked loader path
        run: |
          set -euo pipefail
          for helper in ffprobe ffmpeg; do
            printf '#!/bin/sh\nunset LD_LIBRARY_PATH\nexec /usr/bin/%s "$@"\n' "$helper" > "$RUNNER_TEMP/$helper"
            chmod +x "$RUNNER_TEMP/$helper"
          done

      - name: Run Rust tests
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
          OR_FFPROBE_PATH: ${{ runner.temp }}/ffprobe
          OR_FFMPEG_PATH: ${{ runner.temp }}/ffmpeg
        run: cargo test --workspace

      - name: Verify the real ffprobe adapter with generated media
        run: cargo test -p or_core --test media_probe_integration -- --ignored

      - name: Verify real media artifact generation with system FFmpeg
        run: cargo test -p or_core --test media_artifacts_integration -- --ignored

  flutter-static:
    name: Flutter static and widget checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter 3.47.5
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install FFmpeg development libraries for Flutter host tests
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
          pkg_config_path="$(pkg-config --variable=pc_path pkg-config)"
          test -n "$pkg_config_path"
          PKG_CONFIG_PATH="$pkg_config_path" pkg-config --modversion libavutil
          mkdir -p "$HOME/.cargo"
          # Cargo [env] reaches build.rs when Flutter's native-assets hook drops step env.
          cat > "$HOME/.cargo/config.toml" <<EOF
          [env]
          PKG_CONFIG_PATH = { value = "$pkg_config_path", force = true }
          EOF

      - name: Verify desktop and Android bridge media boundaries
        run: |
          set -euo pipefail
          desktop_tree="$(cargo tree --locked -p or_app_bridge --target x86_64-unknown-linux-gnu --edges normal)"
          if ! grep -E 'or_media|ffmpeg' <<< "$desktop_tree"; then
            echo 'Desktop or_app_bridge must link the software preview decoder'
            exit 1
          fi
          android_tree="$(cargo tree --locked -p or_app_bridge --target aarch64-linux-android --edges normal)"
          if ! grep -E 'or_media|or_render|ffmpeg-the-third' <<< "$android_tree"; then
            echo 'Android or_app_bridge must link the software preview and render path'
            exit 1
          fi

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: apps/or_app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter code
        working-directory: apps/or_app
        run: flutter analyze

      - name: Run Flutter widget tests
        working-directory: apps/or_app
        run: flutter test

  macos:
    name: macOS native build and bridge smoke
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Run project storage tests
        run: cargo test -p or_core --test project_storage

      - name: Run project recovery tests
        run: cargo test -p or_core --test project_recovery

      - name: Run persistent cache index tests
        run: cargo test -p or_core cache::tests

      - name: Run media artifact service tests with fake FFmpeg
        run: cargo test -p or_core media_artifacts::tests

      - name: Run real local IPC transport tests
        run: cargo test -p or_ipc --test local_transport

      - name: Run shared live-host transport tests
        run: cargo test -p or_ipc --test live_host

      - name: Install media helpers for the attached CLI tests
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Run attached CLI shared-host parity tests
        run: cargo test -p or_cli --test semantic_cli

      - name: Install Flutter 3.47.5
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Install FFmpeg source-build tooling
        run: brew install cmake nasm pkg-config

      - name: Build pinned VP9 and Opus codec sources
        id: codec-build
        timeout-minutes: 35
        run: |
          set -euo pipefail
          bash scripts/build_desktop_export_codecs.sh macos \
            "$RUNNER_TEMP/ffmpeg-codecs-install" \
            "$RUNNER_TEMP/desktop-export-codecs"

      - name: Build and stage LGPL-only FFmpeg 8.1.3 shared libraries
        id: ffmpeg-build
        timeout-minutes: 30
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          source="$RUNNER_TEMP/ffmpeg-8.1.3"
          prefix="$RUNNER_TEMP/ffmpeg-8.1.3-install"
          curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 --max-time 600 \
            https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz --output "$archive"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $archive" | shasum -a 512 --check
          xz --test "$archive"
          tar -xJOf "$archive" ffmpeg-8.1.3/COPYING.LGPLv2.1 > "$RUNNER_TEMP/FFmpeg-COPYING.LGPLv2.1"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$source"
          read -r -a common_configure_args <<< "$FFMPEG_COMMON_CONFIGURE_ARGS"
          read -r -a helper_configure_args <<< "$FFMPEG_HELPER_CONFIGURE_ARGS"
          read -r -a export_configure_args <<< "$FFMPEG_EXPORT_CONFIGURE_ARGS"
          if [[ "$(uname -s)" == "Darwin" ]]; then
            export_configure_args+=(--enable-videotoolbox --enable-encoder=h264_videotoolbox --enable-encoder=aac)
          fi
          configure_args=("--prefix=$prefix" --install-name-dir=@rpath "${common_configure_args[@]}" "${helper_configure_args[@]}" "${export_configure_args[@]}")
          ./configure "${configure_args[@]}"
          make -j2
          make install
          # Exercise the actual helper operations against a generated fixture;
          # textual capability listings alone do not prove the tools work.
          test -x "$prefix/bin/ffmpeg"
          test -x "$prefix/bin/ffprobe"
          python3 "$GITHUB_WORKSPACE/scripts/verify_ffmpeg_helpers.py" \
            --bin "$prefix/bin" \
            --lib "$prefix/lib" \
            --media "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny.mkv" \
            --image "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny_still.png" \
            --image "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny_still.jpg" \
            --image "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny_still.webp" \
            --work "$RUNNER_TEMP/ffmpeg-helper-capability-check"
          # Phase 4's noise filter is verified by measuring the floor it removes,
          # not by finding its name in a listing.
          python3 "$GITHUB_WORKSPACE/scripts/measure_denoise.py" \
            --bin "$prefix/bin" \
            --work "$RUNNER_TEMP/ffmpeg-denoise-measurement"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          mkdir -p "$HOME/.cargo"
          # Cargo [env] reaches build.rs when Flutter's native-assets hook drops step env.
          cat > "$HOME/.cargo/config.toml" <<EOF
          [env]
          FFMPEG_DIR = { value = "$prefix", force = true }
          PKG_CONFIG_PATH = { value = "$prefix/lib/pkgconfig", force = true }
          EOF
          for library in avcodec avformat avutil swresample swscale; do
            test -f "$prefix/lib/pkgconfig/lib$library.pc"
          done
          echo "FFMPEG_INSTALL_PREFIX=$prefix" >> "$GITHUB_ENV"
          for library in avcodec avformat avutil swresample swscale; do
            pkg-config --modversion "lib$library"
            test "$(pkg-config --variable=prefix "lib$library")" = "$prefix"
          done
          {
            echo "Target: macOS $(uname -m)"
            echo "FFmpeg release: 8.1.3"
            echo "Rust binding: ffmpeg-the-third 6.0.0"
            echo "Official source URL: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
            echo "Official upstream tag commit: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7"
            echo "Source archive SHA-512: acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1"
            echo "Patch status: unpatched upstream release archive"
            echo "Packaging modifications: copies shared libraries beside the desktop media probe and into the app Frameworks directory, and adds @loader_path runtime paths; preserved install prefix remains unchanged"
            echo "Configure arguments: ${configure_args[*]}"
            echo "Enabled libraries: libavcodec, libavformat, libavutil, libswresample, libswscale"
            echo "Enabled programs: ffmpeg, ffprobe (9B1 packaged media helpers)"
            echo "Enabled protocols: file, pipe"
            echo "Enabled demuxers: matroska, mov, image2, image2pipe, png_pipe, jpeg_pipe, webp_pipe"
            echo "Enabled decoders: ffv1, pcm_s16le, h264, aac, mp3, vp9, opus, png, mjpeg, webp"
            echo "Enabled parsers: h264, aac"
            echo "Enabled encoders: ffv1, pcm_s16le, png, mpeg4"
            echo "Delivery encoders: libvpx-vp9 and libopus, statically linked from pinned upstream sources"
            echo "libvpx configure target: $LIBVPX_CONFIGURE_TARGET"
            echo "Enabled muxers: matroska, webm, image2, image2pipe"
            echo "Enabled filters: setpts, scale, format, aformat, aresample, showwavespic"
            echo "License posture: LGPL 2.1-or-later configure default; GPL, version3, and nonfree were not enabled"
            cat "$RUNNER_TEMP/desktop-export-codecs/EXPORT-CODEC-SOURCES.txt"
            echo "Compiler: $(clang --version | head -n 1)"
            echo "Build tools: $(make --version | head -n 1); $(pkg-config --version)"
            echo "Rust toolchain: $(rustc --version)"
            xcodebuild -version | sed 's/^/Apple toolchain: /'
            echo "Runtime library names:"
            find "$prefix/lib" -maxdepth 1 \( -type f -o -type l \) \( -name 'libav*.dylib' -o -name 'libsw*.dylib' \) -exec basename {} \; | sort
          } > "$RUNNER_TEMP/FFMPEG-BUILD-INFO.txt"
          cat "$RUNNER_TEMP/FFMPEG-BUILD-INFO.txt"
          tar -czf "$RUNNER_TEMP/ffmpeg-8.1.3-install.tar.gz" -C "$RUNNER_TEMP" ffmpeg-8.1.3-install

      - name: Verify Phase 7 runtime hardening contracts
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          DYLD_LIBRARY_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: |
          cargo test --locked -p or_runtime
          cargo test --locked -p or_media -- --skip writer_publishes_mp4_with_videotoolbox_h264_and_aac_streams
          cargo test --locked -p or_media --test software_export writer_publishes_webm_with_vp9_and_opus_streams -- --exact --ignored
          cargo test --locked -p or_app_bridge
          cargo test --locked -p or_core --test project_recovery

      - name: Build the production media packaging probe
        env:
          FFMPEG_DIR: ${{ runner.temp }}/ffmpeg-8.1.3-install
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib/pkgconfig
        run: cargo build --locked --release --manifest-path tools/ffmpeg-link-probe/Cargo.toml

      - name: Build macOS app with Rust bridge and texture adapter
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: flutter build macos --debug

      - name: Package FFmpeg beside the desktop probe and verify runtime loading
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/apps/or_app/build/macos/Build/Products/Debug/or_app.app"
          bridge="$app/Contents/Frameworks/or_app_bridge.framework/Versions/A/or_app_bridge"
          runtime_dir="$(dirname "$bridge")"
          ln -s or_app_bridge "$runtime_dir/libor_app_bridge.dylib"
          echo "OR_PACKAGED_BRIDGE_DIRECTORY=$runtime_dir" >> "$GITHUB_ENV"
          frameworks="$app/Contents/Frameworks"
          probe_source="$GITHUB_WORKSPACE/tools/ffmpeg-link-probe/target/release/ffmpeg-link-probe"
          probe="$runtime_dir/ffmpeg-link-probe"
          test -f "$bridge"
          test -f "$probe_source"
          mkdir -p "$frameworks"
          install -m 755 "$probe_source" "$probe"
          # The suffix is a glob by design: it must expand to the matching files.
          # shellcheck disable=SC2086
          for pattern in libavcodec*.dylib libavformat*.dylib libavutil*.dylib libswresample*.dylib libswscale*.dylib; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$frameworks/"
          done
          test -f "$frameworks/libavutil.60.dylib"
          if ! otool -l "$bridge" | grep -Fq '@loader_path'; then
            install_name_tool -add_rpath @loader_path "$bridge"
          fi
          for library in "$runtime_dir"/libavcodec*.dylib "$runtime_dir"/libavformat*.dylib \
            "$runtime_dir"/libavutil*.dylib "$runtime_dir"/libswresample*.dylib "$runtime_dir"/libswscale*.dylib; do
            if [ -L "$library" ]; then continue; fi
            if ! otool -l "$library" | grep -Fq '@loader_path'; then
              install_name_tool -add_rpath @loader_path "$library"
            fi
          done
          if ! otool -l "$probe" | grep -Fq '@loader_path'; then
            install_name_tool -add_rpath @loader_path "$probe"
          fi
          # 9B1 packaged media helpers live beside the app binary, which is the
          # packaged-first resolution root. libavfilter travels with them; the
          # app-wide --deep signature below covers the new files.
          helpers="$app/Contents/MacOS"
          install -m 755 "$FFMPEG_INSTALL_PREFIX/bin/ffmpeg" "$helpers/ffmpeg"
          install -m 755 "$FFMPEG_INSTALL_PREFIX/bin/ffprobe" "$helpers/ffprobe"
          # The suffix is a glob by design: it must expand to the matching files.
          # shellcheck disable=SC2086
          for pattern in libavfilter*.dylib; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$frameworks/"
          done
          for library in "$runtime_dir"/libavfilter*.dylib; do
            if [ -L "$library" ]; then continue; fi
            if ! otool -l "$library" | grep -Fq '@loader_path'; then
              install_name_tool -add_rpath @loader_path "$library"
            fi
          done
          for helper in "$helpers/ffmpeg" "$helpers/ffprobe"; do
            install_name_tool -add_rpath @loader_path/../Frameworks "$helper"
          done
          codesign --force --deep --sign - --timestamp=none "$app"
          otool -L "$bridge"
          otool -l "$bridge" | grep -F '@loader_path'
          if otool -L "$bridge" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          if otool -l "$bridge" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          otool -L "$probe"
          otool -l "$probe" | grep -F '@loader_path'
          if otool -L "$probe" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          if otool -l "$probe" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH -u DYLD_ROOT_PATH "$probe"
          helpers="$app/Contents/MacOS"
          test -x "$helpers/ffmpeg"
          test -x "$helpers/ffprobe"
          otool -l "$helpers/ffmpeg" | grep -F 'path @loader_path/../Frameworks'
          if otool -L "$helpers/ffmpeg" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          if otool -L "$helpers/ffprobe" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH -u DYLD_ROOT_PATH \
            "$helpers/ffprobe" -hide_banner -version
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH -u DYLD_ROOT_PATH \
            "$helpers/ffmpeg" -hide_banner -encoders | grep -q " png "

      - name: Preserve macOS FFmpeg source and runtime provenance
        if: always() && steps.ffmpeg-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-8.1.3-macos
          path: |
            ${{ runner.temp }}/ffmpeg-8.1.3.tar.xz
            ${{ runner.temp }}/ffmpeg-8.1.3-install.tar.gz
            ${{ runner.temp }}/FFMPEG-BUILD-INFO.txt
            ${{ runner.temp }}/FFmpeg-COPYING.LGPLv2.1
            ${{ runner.temp }}/desktop-export-codecs/opus-1.6.1.tar.gz
            ${{ runner.temp }}/desktop-export-codecs/libvpx-v1.17.0.tar
            ${{ runner.temp }}/desktop-export-codecs/OPUS-COPYING
            ${{ runner.temp }}/desktop-export-codecs/LIBVPX-LICENSE
            ${{ runner.temp }}/desktop-export-codecs/LIBVPX-PATENTS
            ${{ runner.temp }}/desktop-export-codecs/EXPORT-CODEC-SOURCES.txt
          if-no-files-found: error
          retention-days: 14

      - name: Capture CLI bootstrap data
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          commands = {
              "app_info": ["version", "--json"],
              "health": ["health", "--json"],
              "capabilities": ["capabilities", "--json"],
          }
          snapshot = {}
          for key, arguments in commands.items():
              output = subprocess.check_output(
                  ["cargo", "run", "--quiet", "-p", "or_cli", "--", *arguments],
                  text=True,
              )
              snapshot[key] = json.loads(output)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file:
              file.write(
                  "OR_CLI_BOOTSTRAP_JSON="
                  + json.dumps(snapshot, separators=(",", ":"))
                  + "\n"
              )
          PY

      - name: Run native bridge diagnostics smoke test
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: >-
          flutter --ci test integration_test/native_bridge_diagnostics_test.dart -d macos
          --plain-name "native bridge diagnostics match the CLI snapshot"
          "--dart-define=OR_CLI_BOOTSTRAP_JSON=$OR_CLI_BOOTSTRAP_JSON"

      - name: Run native Flutter typed text bridge test
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: >-
          flutter --ci test integration_test/core_bridge_test.dart -d macos
          --plain-name
          "Rust project bridge stores editable titles and manual captions"

      - name: Run native Flutter project lifecycle tests
        timeout-minutes: 35
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: >-
          flutter --ci test integration_test/core_bridge_test.dart -d macos
          --name
          "^(native media bridge persists offline media through undo and save|native timeline bridge edits, history, and save reopen use one Rust host)$"

      - name: Run native Flutter preview transport test
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: >-
          flutter --ci test integration_test/core_bridge_test.dart -d macos
          --plain-name
          "native preview transport keeps exact time and explicit rate"

      - name: Restore packaged macOS Rust bridge alias after native builds
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/apps/or_app/build/macos/Build/Products/Debug/or_app.app"
          runtime_dir="$app/Contents/Frameworks/or_app_bridge.framework/Versions/A"
          test -f "$runtime_dir/or_app_bridge"
          ln -sf or_app_bridge "$runtime_dir/libor_app_bridge.dylib"
          test -f "$runtime_dir/libor_app_bridge.dylib"

      - name: Verify packaged product journey in clean environment
        env:
          OR_PACKAGED_HELPERS_DIRECTORY: ${{ github.workspace }}/apps/or_app/build/macos/Build/Products/Debug/or_app.app/Contents/MacOS
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: python3 scripts/run_packaged_desktop_journey.py

      - name: Verify macOS ZIP install, replacement, and removal
        run: >-
          python3 scripts/test_desktop_archive_install.py
          apps/or_app/build/macos/Build/Products/Debug/or_app.app

  linux:
    name: Linux native build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake desktop-file-utils dpkg-dev libclang-dev libasound2-dev nasm ninja-build pkg-config patchelf xz-utils libgtk-3-dev liblzma-dev zlib1g-dev xvfb xauth

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Install Flutter 3.47.5
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build pinned VP9 and Opus codec sources
        id: codec-build
        timeout-minutes: 35
        run: |
          set -euo pipefail
          bash scripts/build_desktop_export_codecs.sh linux \
            "$RUNNER_TEMP/ffmpeg-codecs-install" \
            "$RUNNER_TEMP/desktop-export-codecs"

      - name: Build and stage LGPL-only FFmpeg 8.1.3 shared libraries
        id: ffmpeg-build
        timeout-minutes: 30
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          source="$RUNNER_TEMP/ffmpeg-8.1.3"
          prefix="$RUNNER_TEMP/ffmpeg-8.1.3-install"
          curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 --max-time 600 \
            https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz --output "$archive"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $archive" | sha512sum --check
          xz --test "$archive"
          tar -xJOf "$archive" ffmpeg-8.1.3/COPYING.LGPLv2.1 > "$RUNNER_TEMP/FFmpeg-COPYING.LGPLv2.1"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$source"
          read -r -a common_configure_args <<< "$FFMPEG_COMMON_CONFIGURE_ARGS"
          read -r -a helper_configure_args <<< "$FFMPEG_HELPER_CONFIGURE_ARGS"
          read -r -a export_configure_args <<< "$FFMPEG_EXPORT_CONFIGURE_ARGS"
          # Linux has no operating-system H.264 encoder (VideoToolbox and Media
          # Foundation are macOS and Windows only), so delivery links the pinned
          # x264 build from scripts/build_desktop_export_codecs.sh.
          export_configure_args+=(--enable-gpl --enable-libx264 --enable-encoder=libx264)
          configure_args=("--prefix=$prefix" "${common_configure_args[@]}" "${helper_configure_args[@]}" "${export_configure_args[@]}")
          ./configure "${configure_args[@]}"
          make -j2
          make install
          # Exercise helper operations against a generated fixture; textual
          # capability listings alone do not prove the tools work.
          test -x "$prefix/bin/ffmpeg"
          test -x "$prefix/bin/ffprobe"
          python3 "$GITHUB_WORKSPACE/scripts/verify_ffmpeg_helpers.py" \
            --bin "$prefix/bin" \
            --lib "$prefix/lib" \
            --media "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny.mkv" \
            --image "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny_still.png" \
            --image "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny_still.jpg" \
            --image "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny_still.webp" \
            --work "$RUNNER_TEMP/ffmpeg-helper-capability-check"
          # Phase 4's noise filter is verified by measuring the floor it removes,
          # not by finding its name in a listing.
          python3 "$GITHUB_WORKSPACE/scripts/measure_denoise.py" \
            --bin "$prefix/bin" \
            --work "$RUNNER_TEMP/ffmpeg-denoise-measurement"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          # Cargo config reaches Rust build scripts through Flutter's isolated
          # native-assets hook, so the lane and CI share one writer.
          bash "$GITHUB_WORKSPACE/scripts/configure_linux_cargo_for_ffmpeg.sh" "$prefix"
          for library in avcodec avformat avutil swresample swscale; do
            test -f "$prefix/lib/pkgconfig/lib$library.pc"
          done
          echo "FFMPEG_INSTALL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"
          for library in avcodec avformat avutil swresample swscale; do
            pkg-config --modversion "lib$library"
            test "$(pkg-config --variable=prefix "lib$library")" = "$prefix"
          done
          {
            echo "Target: Linux $(uname -m)"
            echo "FFmpeg release: 8.1.3"
            echo "Rust binding: ffmpeg-the-third 6.0.0"
            echo "Official source URL: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
            echo "Official upstream tag commit: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7"
            echo "Source archive SHA-512: acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1"
            echo "Patch status: unpatched upstream release archive"
            echo 'Packaging modifications: copied shared libraries have ELF RUNPATH set to $ORIGIN; preserved install prefix remains unchanged'
            echo "Configure arguments: ${configure_args[*]}"
            echo "Enabled libraries: libavcodec, libavformat, libavutil, libswresample, libswscale"
            echo "Enabled programs: ffmpeg, ffprobe (9B1 packaged media helpers)"
            echo "Enabled protocols: file, pipe"
            echo "Enabled demuxers: matroska, mov, image2, image2pipe, png_pipe, jpeg_pipe, webp_pipe"
            echo "Enabled decoders: ffv1, pcm_s16le, h264, aac, mp3, vp9, opus, png, mjpeg, webp"
            echo "Enabled parsers: h264, aac"
            echo "Enabled encoders: ffv1, pcm_s16le, png, mpeg4"
            echo "Delivery encoders: libvpx-vp9 and libopus, statically linked from pinned upstream sources"
            echo "Linux delivery encoder: libx264 (GPL-2.0-or-later), statically linked from the pinned upstream commit"
            echo "libvpx configure target: $LIBVPX_CONFIGURE_TARGET"
            echo "Enabled muxers: matroska, webm, image2, image2pipe"
            echo "Enabled filters: setpts, scale, format, aformat, aresample, showwavespic"
            echo "License posture: LGPL 2.1-or-later except the Linux x264 link, which makes this build GPL-2.0-or-later; version3 and nonfree were not enabled"
            cat "$RUNNER_TEMP/desktop-export-codecs/EXPORT-CODEC-SOURCES.txt"
            echo "Compiler: $(cc --version | head -n 1)"
            echo "Build tools: $(make --version | head -n 1); $(pkg-config --version)"
            echo "Rust toolchain: $(rustc --version)"
            echo "Runtime library names:"
            find "$prefix/lib" -maxdepth 1 \( -type f -o -type l \) \( -name 'libav*.so*' -o -name 'libsw*.so*' \) -exec basename {} \; | sort
          } > "$RUNNER_TEMP/FFMPEG-BUILD-INFO.txt"
          cat "$RUNNER_TEMP/FFMPEG-BUILD-INFO.txt"
          tar -czf "$RUNNER_TEMP/ffmpeg-8.1.3-install.tar.gz" -C "$RUNNER_TEMP" ffmpeg-8.1.3-install

      - name: Build the production media packaging probe
        env:
          FFMPEG_DIR: ${{ runner.temp }}/ffmpeg-8.1.3-install
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib/pkgconfig
        run: cargo build --locked --release --manifest-path tools/ffmpeg-link-probe/Cargo.toml

      - name: Seed Linux app bundle media runtime
        run: |
          set -euo pipefail
          source="$FFMPEG_INSTALL_PREFIX"
          runtime="$RUNNER_TEMP/or-packaged-media-runtime"
          mkdir -p "$runtime/lib"
          install -m 755 "$source/bin/ffmpeg" "$runtime/ffmpeg"
          install -m 755 "$source/bin/ffprobe" "$runtime/ffprobe"
          # The suffix is a glob by design: it must expand to the matching files.
          # shellcheck disable=SC2086
          for pattern in libavcodec.so* libavfilter.so* libavformat.so* libavutil.so* libswresample.so* libswscale.so*; do
            cp -a "$source/lib/"$pattern "$runtime/lib/"
          done
          test -x "$runtime/ffmpeg"
          test -x "$runtime/ffprobe"
          test -e "$runtime/lib/libavutil.so.60"
          echo "OR_PACKAGED_MEDIA_RUNTIME_DIRECTORY=$runtime" >> "$GITHUB_ENV"

      - name: Build Linux app with Rust bridge and texture adapter
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          LD_LIBRARY_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
          OR_PACKAGED_MEDIA_RUNTIME_DIRECTORY: ${{ runner.temp }}/or-packaged-media-runtime
        run: flutter build linux --debug

      - name: Verify Phase 7 runtime hardening contracts
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          LD_LIBRARY_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: |
          cargo test --locked -p or_runtime
          cargo test --locked -p or_media
          cargo test --locked -p or_media --test software_export writer_publishes_webm_with_vp9_and_opus_streams -- --exact --ignored
          cargo test --locked -p or_app_bridge
          cargo test --locked -p or_core --test project_recovery

      - name: Package FFmpeg beside the desktop probe and verify runtime loading
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/apps/or_app/build/linux/x64/debug/bundle"
          bridge="$(find "$bundle" -type f -name '*or_app_bridge*.so' -print -quit)"
          test -n "$bridge"
          runtime_dir="$(dirname "$bridge")"
          echo "OR_PACKAGED_BRIDGE_DIRECTORY=$runtime_dir" >> "$GITHUB_ENV"
          probe_source="$GITHUB_WORKSPACE/tools/ffmpeg-link-probe/target/release/ffmpeg-link-probe"
          probe="$runtime_dir/ffmpeg-link-probe"
          test -f "$probe_source"
          install -m 755 "$probe_source" "$probe"
          # The suffix is a glob by design: it must expand to the matching files.
          # shellcheck disable=SC2086
          for pattern in libavcodec.so* libavformat.so* libavutil.so* libswresample.so* libswscale.so*; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
          done
          for library in "$runtime_dir"/libav*.so* "$runtime_dir"/libsw*.so*; do
            if [ -L "$library" ]; then continue; fi
            patchelf --set-rpath '$ORIGIN' "$library"
          done
          readelf -d "$probe" | grep -E 'NEEDED|RUNPATH'
          readelf -d "$probe" | grep -F '$ORIGIN'
          if readelf -d "$probe" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          for library in "$runtime_dir"/libav*.so* "$runtime_dir"/libsw*.so*; do
            if [ -L "$library" ]; then continue; fi
            readelf -d "$library" | grep -F '$ORIGIN'
          done
          readelf -d "$bridge" | grep -E 'NEEDED|RUNPATH'
          readelf -d "$bridge" | grep -F '$ORIGIN'
          env -u LD_LIBRARY_PATH python3 - "$bridge" <<'PY'
          import ctypes
          import sys

          ctypes.CDLL(sys.argv[1])
          PY
          env -u LD_LIBRARY_PATH "$probe"
          # 9B1 packaged media helpers live beside the app binary, which is the
          # packaged-first resolution root.
          helpers="$bundle"
          install -m 755 "$FFMPEG_INSTALL_PREFIX/bin/ffmpeg" "$helpers/ffmpeg"
          install -m 755 "$FFMPEG_INSTALL_PREFIX/bin/ffprobe" "$helpers/ffprobe"
          # The suffix is a glob by design: it must expand to the matching files.
          # shellcheck disable=SC2086
          for pattern in libavfilter.so*; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
          done
          for library in "$runtime_dir"/libavfilter.so*; do
            if [ -L "$library" ]; then continue; fi
            patchelf --set-rpath '$ORIGIN' "$library"
          done
          helper_rpath='$ORIGIN/'"$(realpath --relative-to="$helpers" "$runtime_dir")"
          patchelf --set-rpath "$helper_rpath" "$helpers/ffmpeg" "$helpers/ffprobe"
          readelf -d "$helpers/ffmpeg" | grep -F "$helper_rpath"
          if readelf -d "$helpers/ffmpeg" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          if readelf -d "$helpers/ffprobe" | grep -F "$FFMPEG_INSTALL_PREFIX"; then exit 1; fi
          env -u LD_LIBRARY_PATH "$helpers/ffprobe" -hide_banner -version
          env -u LD_LIBRARY_PATH "$helpers/ffmpeg" -hide_banner -encoders | grep -q " png "

      - name: Measure packaged decoder sessions
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/apps/or_app/build/linux/x64/debug/bundle"
          test_binary="$(find "$GITHUB_WORKSPACE/target/debug/deps" -maxdepth 1 -type f -name 'software_decode-*' -executable -print | head -n 1)"
          test -n "$test_binary"
          linked_runtime="$(LD_LIBRARY_PATH="$bundle/lib" ldd "$test_binary")"
          grep -Fq "$bundle/lib/libavcodec.so" <<< "$linked_runtime"
          output="$(LD_LIBRARY_PATH="$bundle/lib" "$test_binary" software_video_session_reuses_sequential_decode_and_seeks_on_discontinuity --exact --nocapture 2>&1)"
          echo "$output"
          measurement="$(grep '^OR_DECODER_SESSION_MEASUREMENT ' <<< "$output")"
          test -n "$measurement"
          echo "$measurement" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify packaged product journey in clean environment
        env:
          OR_PACKAGED_HELPERS_DIRECTORY: ${{ github.workspace }}/apps/or_app/build/linux/x64/debug/bundle
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: python3 scripts/run_packaged_desktop_journey.py

      - name: Stage package notices after the Flutter journey build
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/apps/or_app/build/linux/x64/debug/bundle"
          # The packaged journey runs `flutter test -d linux`, whose install step
          # clears the bundle and removes files staged by earlier build steps.
          # Stage notices after that final bundle mutation so the .deb contains
          # the complete third-party license tree.
          bash scripts/stage_codec_licences.sh stage \
            "$bundle" \
            "$RUNNER_TEMP/FFmpeg-COPYING.LGPLv2.1" \
            "$RUNNER_TEMP/desktop-export-codecs"
          bash scripts/stage_codec_licences.sh verify "$bundle"

      - name: Verify Debian package installation and user-data safety
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/apps/or_app/build/linux/x64/debug/bundle"
          package="$RUNNER_TEMP/opencut-reinforced-linux-x64-debug.deb"
          bash scripts/package_linux_deb.sh "$bundle" "$package" "$GITHUB_SHA"
          bash scripts/test_linux_deb_install.sh "$package"
          for image in ubuntu:24.04 debian:13-slim; do
            echo "Testing clean package installation in $image"
            docker run --rm \
              --volume "$package:/tmp/opencut-reinforced.deb:ro" \
              --volume "$GITHUB_WORKSPACE/scripts/test_linux_deb_install.sh:/tmp/test_linux_deb_install.sh:ro" \
              "$image" bash -euc \
              'apt-get update; bash /tmp/test_linux_deb_install.sh /tmp/opencut-reinforced.deb'
          done

      - name: Preserve Linux FFmpeg source and runtime provenance
        if: always() && steps.ffmpeg-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-8.1.3-linux
          path: |
            ${{ runner.temp }}/ffmpeg-8.1.3.tar.xz
            ${{ runner.temp }}/ffmpeg-8.1.3-install.tar.gz
            ${{ runner.temp }}/FFMPEG-BUILD-INFO.txt
            ${{ runner.temp }}/FFmpeg-COPYING.LGPLv2.1
            ${{ runner.temp }}/desktop-export-codecs/opus-1.6.1.tar.gz
            ${{ runner.temp }}/desktop-export-codecs/libvpx-v1.17.0.tar
            ${{ runner.temp }}/desktop-export-codecs/OPUS-COPYING
            ${{ runner.temp }}/desktop-export-codecs/LIBVPX-LICENSE
            ${{ runner.temp }}/desktop-export-codecs/LIBVPX-PATENTS
            ${{ runner.temp }}/desktop-export-codecs/X264-COPYING
            ${{ runner.temp }}/desktop-export-codecs/x264-*.tar.bz2
            ${{ runner.temp }}/desktop-export-codecs/EXPORT-CODEC-SOURCES.txt
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows native build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Set up MSYS2 FFmpeg build tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          path-type: inherit
          update: true
          cache: false
          install: make pkgconf
          pacboy: clang:p nasm:p

      - name: Build pinned VP9 and Opus codec sources
        id: codec-build
        shell: msys2 {0}
        timeout-minutes: 35
        run: |
          set -euo pipefail
          temp="$(cygpath -u "$RUNNER_TEMP")"
          bash scripts/build_desktop_export_codecs.sh windows \
            "$temp/ffmpeg-codecs-install" \
            "$temp/desktop-export-codecs"

      - name: Build pinned static zlib for Windows FFmpeg helpers
        shell: pwsh
        run: ./scripts/build_windows_zlib.ps1 -BuildRoot $env:RUNNER_TEMP

      - name: Install Flutter 3.47.5
        shell: pwsh
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ((git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD).Trim() -ne "6a19cca56475dbfba1478ee68d7bd0c2ef891da1") { throw "Flutter revision mismatch" }
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build and stage LGPL-only FFmpeg 8.1.3 shared libraries
        id: ffmpeg-build
        shell: msys2 {0}
        timeout-minutes: 40
        run: bash scripts/build_windows_ffmpeg.sh

      - name: Run the shared Windows lane tests
        shell: pwsh
        run: ./scripts/run_windows_lane.ps1 -Steps tests

      - name: Build the production media packaging probe
        shell: msys2 {0}
        run: |
          prefix="$(cygpath -u "$FFMPEG_INSTALL_PREFIX")"
          msvc_linker_dir="$(cygpath -u "$VCToolsInstallDir")"
          msvc_linker_dir="${msvc_linker_dir%/}/bin/Hostx64/x64"
          export PATH="$msvc_linker_dir:$PATH"
          test "$(command -v link.exe)" = "$msvc_linker_dir/link.exe"
          export FFMPEG_DIR="$FFMPEG_INSTALL_PREFIX"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          cargo build --locked --release --manifest-path tools/ffmpeg-link-probe/Cargo.toml

      - name: Expose clang64 DLLs to Flutter's native-assets hook
        shell: msys2 {0}
        run: echo "$LIBCLANG_PATH" >> "$GITHUB_PATH"

      - name: Verify Phase 7 runtime hardening contracts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          prefix="$(cygpath -u "$FFMPEG_INSTALL_PREFIX")"
          msvc_linker_dir="$(cygpath -u "$VCToolsInstallDir")"
          msvc_linker_dir="${msvc_linker_dir%/}/bin/Hostx64/x64"
          export PATH="$msvc_linker_dir:$FFMPEG_INSTALL_PREFIX/bin:$PATH"
          test "$(command -v link.exe)" = "$msvc_linker_dir/link.exe"
          export FFMPEG_DIR="$FFMPEG_INSTALL_PREFIX"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          cargo test --locked -p or_runtime
          cargo test --locked -p or_media
          cargo test --locked -p or_media --test software_export writer_publishes_webm_with_vp9_and_opus_streams -- --exact --ignored
          cargo test --locked -p or_app_bridge
          cargo test --locked -p or_core --test project_recovery

      - name: Build Windows app with Rust bridge and texture adapter
        shell: pwsh
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: ./scripts/run_windows_lane.ps1 -Steps build

      - name: Package FFmpeg beside the desktop probe and verify runtime loading
        shell: pwsh
        run: ./scripts/stage_windows_bundle.ps1

      - name: Verify packaged product journey in clean environment
        shell: pwsh
        env:
          OR_PACKAGED_HELPERS_DIRECTORY: ${{ github.workspace }}/apps/or_app/build/windows/x64/runner/Debug
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: python scripts/run_packaged_desktop_journey.py

      - name: Verify Windows ZIP install, replacement, and removal
        shell: pwsh
        run: >-
          python scripts/test_desktop_archive_install.py
          apps/or_app/build/windows/x64/runner/Debug

      - name: Preserve Windows FFmpeg source and runtime provenance
        if: always() && steps.ffmpeg-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-8.1.3-windows-x64
          path: |
            ${{ runner.temp }}/ffmpeg-8.1.3.tar.xz
            ${{ runner.temp }}/ffmpeg-8.1.3-install.tar.gz
            ${{ runner.temp }}/FFMPEG-BUILD-INFO.txt
            ${{ runner.temp }}/FFmpeg-COPYING.LGPLv2.1
            ${{ runner.temp }}/zlib-1.3.2.tar.gz
            ${{ runner.temp }}/ZLIB-LICENSE.txt
            ${{ runner.temp }}/desktop-export-codecs/opus-1.6.1.tar.gz
            ${{ runner.temp }}/desktop-export-codecs/libvpx-v1.17.0.tar
            ${{ runner.temp }}/desktop-export-codecs/OPUS-COPYING
            ${{ runner.temp }}/desktop-export-codecs/LIBVPX-LICENSE
            ${{ runner.temp }}/desktop-export-codecs/LIBVPX-PATENTS
            ${{ runner.temp }}/desktop-export-codecs/EXPORT-CODEC-SOURCES.txt
          if-no-files-found: error
          retention-days: 14

  granted-descriptor-capability:
    name: Granted descriptor capability boundary
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove a granted content:// FD cannot be reopened by path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import errno, json, os, subprocess, tempfile
          # Phase 9 duplicates a granted, bounded, seekable descriptor instead of
          # reopening the provider path. This proves that is required rather than
          # merely convenient: the same bytes read through the inherited FD, but
          # a cross-UID /proc reopen is denied.
          child = '''import errno, json, os
          info = os.fstat(0)
          direct = os.pread(0, 32, 0)
          error = None
          try:
              fd = os.open("/proc/self/fd/0", os.O_RDONLY)
              os.close(fd)
          except OSError as failure:
              error = failure.errno
          print(json.dumps({"reader_uid": os.getuid(), "file_owner_uid": info.st_uid,
                            "file_mode": oct(info.st_mode & 0o777),
                            "direct_read_bytes": len(direct), "proc_reopen_errno": error}))
          assert os.getuid() != info.st_uid
          assert len(direct) == 32
          assert error == errno.EACCES
          '''
          with tempfile.TemporaryDirectory(prefix="or-fd-permission-") as directory:
              path = Path(directory) / "private.mkv"
              path.write_bytes(Path("crates/or_media/tests/fixtures/tiny.mkv").read_bytes())
              path.chmod(0o600)
              with path.open("rb") as granted:
                  output = subprocess.check_output(
                      ["sudo", "-u", "nobody", "python3", "-c", child], stdin=granted, text=True)
              print(output)
              Path(os.environ["RUNNER_TEMP"], "descriptor-permission.json").write_text(output)
          PY

      - name: Preserve granted descriptor discriminator result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: granted-descriptor-capability
          path: ${{ runner.temp }}/descriptor-permission.json
          if-no-files-found: error
          retention-days: 14

  # The one aggregate check the owner can require for merge. It runs even when a
  # dependency failed or was skipped (`if: always()`), and it fails unless every
  # required job reports `success`: a skipped or neutral job is not success and
  # cannot satisfy a gate. The gate covers the desktop platforms the product
  # ships for, so `macos`, `linux` and `windows` must all build and pass on the
  # same source tree; the Android emulator job stays a separate diagnostic lane
  # because its hosted emulator is not a desktop release requirement.
  # Keep this job's name stable — the branch ruleset requires the
  # `release-gate` check.
  release-gate:
    name: release-gate
    if: always()
    needs:
      - rust
      - flutter-static
      - granted-descriptor-capability
      - macos
      - linux
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every required platform job to have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/release_gate.py --needs-json "$NEEDS_JSON"
