name: Platform verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  descriptor-permission:
    name: Discriminate granted FD versus proc reopen permission
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify direct reads and forbidden inode reopen across UIDs
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tempfile
          child = '''import errno, json, os
          info = os.fstat(0)
          direct = os.pread(0, 32, 0)
          error = None
          try:
              fd = os.open('/proc/self/fd/0', os.O_RDONLY)
              os.close(fd)
          except OSError as failure:
              error = failure.errno
          result = {'reader_uid': os.getuid(), 'file_owner_uid': info.st_uid,
                    'file_mode': oct(info.st_mode & 0o777), 'direct_read_bytes': len(direct),
                    'proc_reopen_errno': error}
          print(json.dumps(result))
          assert os.getuid() != info.st_uid
          assert len(direct) == 32
          assert error == errno.EACCES
          '''
          with tempfile.TemporaryDirectory(prefix='or-fd-permission-') as directory:
              path = pathlib.Path(directory) / 'private.mkv'
              path.write_bytes(pathlib.Path('crates/or_media/tests/fixtures/tiny.mkv').read_bytes())
              path.chmod(0o600)
              with path.open('rb') as granted:
                  output = subprocess.check_output(['sudo', '-u', 'nobody', 'python3', '-c', child], stdin=granted, text=True)
              print(output)
              pathlib.Path(os.environ['RUNNER_TEMP'], 'descriptor-permission.json').write_text(output)
          PY
      - name: Preserve permission discriminator result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: descriptor-permission-discriminator
          path: ${{ runner.temp }}/descriptor-permission.json
          if-no-files-found: error
          retention-days: 14
