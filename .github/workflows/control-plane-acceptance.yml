name: Control-plane acceptance
run-name: ${{ inputs.fixture_task_digest && format('Roadmap fixture {0}', inputs.fixture_task_digest) || 'Control-plane acceptance' }}

# Supporting hosted fixture facts only. Required live Linux/model boundaries
# run on the prepared Debian host; their skipped cases remain explicitly SKIP.
on:
  push:
    branches:
      - control/**
  workflow_dispatch:
    inputs:
      fixture_sha:
        description: Isolated roadmap marker implementation SHA (supporting facts only)
        required: false
        type: string
      fixture_task_digest:
        required: false
        type: string
      fixture_path:
        required: false
        type: string
      fixture_marker:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: control-plane-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-acceptance:
    if: ${{ !inputs.fixture_sha }}
    name: Fixture acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: "1"
      OR_V2_OPENCODE_BIN: /tmp/opencode/opencode
      OR_V2_OPENCODE_SHA: f9dab32248695e9ebd56b16a1921798fd85112cf5a69c7dfd0cabc1e17be4a11
      OR_V2_OPENCODE_VERSION: 1.18.31
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify pinned Linux transport
        run: |
          mkdir /tmp/opencode
          curl --fail --location --retry 3 --output /tmp/opencode.tar.gz https://github.com/anomalyco/opencode/releases/download/v1.18.31/opencode-linux-x64.tar.gz
          echo 'e9312be75ed803b7415fc2aeabda1f4fe938912a39673762dc0c38c0e11ebde4  /tmp/opencode.tar.gz' | sha256sum --check
          tar -xzf /tmp/opencode.tar.gz -C /tmp/opencode
          echo "$OR_V2_OPENCODE_SHA  $OR_V2_OPENCODE_BIN" | sha256sum --check
          test "$("$OR_V2_OPENCODE_BIN" --version)" = "$OR_V2_OPENCODE_VERSION"

      - name: Measure acceptance cases
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-cache"
          python3 -m model_orchestrator.hosted produce "$RUNNER_TEMP/hosted-results"

      - name: Upload acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/hosted-results/acceptance-receipt.json
          if-no-files-found: error
          retention-days: 90

  collect-receipts:
    if: ${{ !inputs.fixture_sha }}
    name: Collect receipts
    needs: [fixture-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fresh runner, no checkout and no candidate/package command execution.
    # Only the exact workflow-pinned inline collector may write this receipt.
    steps:
      - name: Download acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-receipt-${{ github.sha }}
          path: receipts

      - name: Validate and seal collector receipt
        run: |
          python3 - <<'EOF'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          def digest(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()).hexdigest()
          def strict_pairs(pairs):
              out = {}
              for key, value in pairs:
                  assert key not in out, 'duplicate receipt key'
                  out[key] = value
              return out
          assert [p.name for p in Path('receipts').iterdir()] == ['acceptance-receipt.json']
          source = Path('receipts/acceptance-receipt.json')
          assert source.stat().st_size <= 8388608
          receipt = json.loads(source.read_text(), object_pairs_hook=strict_pairs)
          assert receipt['schema_version'] == 2
          assert receipt['head_sha'] == os.environ['GITHUB_SHA']
          assert receipt['run_id'] == int(os.environ['GITHUB_RUN_ID'])
          assert receipt['run_attempt'] == int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert receipt['workflow'] == '.github/workflows/control-plane-acceptance.yml'
          assert receipt['boundary'] == 'hosted-fixture'
          assert receipt['authority_semantics'] == 'SUPPORTING_FACTS_ONLY_NO_ADOPTION'
          assert receipt['package']['head_sha'] == receipt['head_sha']
          assert receipt['package']['repository'] == os.environ['GITHUB_REPOSITORY']
          assert receipt['package_digest'] == digest(receipt['package'])
          assert receipt['receipt_digest'] == digest({k: v for k, v in receipt.items() if k != 'receipt_digest'})
          suites = receipt['suites']
          expected_suites = {'test_contracts', 'test_isolation_and_state', 'test_verification', 'test_lifecycle', 'test_promotion_and_handoff', 'test_live_acceptance', 'test_hosted', 'test_attempt_execution', 'test_source_review', 'test_cross_phase_attacks', 'test_product_operational', 'test_live_product_operational', 'test_roadmap', 'test_live_roadmap', 'test_execution_infra', 'test_document_routing', 'control-checks'}
          assert len(suites) == len(expected_suites) and {suite['id'] for suite in suites} == expected_suites
          for suite in suites:
              assert suite['result'] == 'PASS' and suite['cases']
              assert len({case['id'] for case in suite['cases']}) == len(suite['cases'])
              for row in [suite, *suite['cases']]:
                  assert type(row['duration_seconds']) in (int, float) and math.isfinite(row['duration_seconds']) and row['duration_seconds'] >= 0
              assert all(case['result'] in ('PASS', 'SKIP') for case in suite['cases'])
          collector = {'schema_version': 2, 'head_sha': receipt['head_sha'],
                       'run_id': int(os.environ['GITHUB_RUN_ID']), 'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                       'workflow_digest': receipt['workflow_digest'], 'package_digest': receipt['package_digest'],
                       'source_receipt_digest': receipt['receipt_digest'], 'suite_digest': digest(suites),
                       'isolation': 'SEPARATE_HOSTED_JOB_NO_CHECKOUT_NO_PACKAGE_EXECUTION'}
          collector['collector_digest'] = digest(collector)
          Path('collector-receipt.json').write_text(json.dumps(collector, indent=2, sort_keys=True) + '\n')
          EOF

      - name: Upload collector receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collector-receipt-${{ github.sha }}
          path: collector-receipt.json
          if-no-files-found: error
          retention-days: 90

  roadmap-fixture:
    name: Isolated roadmap hosted marker acceptance
    if: ${{ inputs.fixture_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Independently measure exact immutable fixture marker
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_SHA: ${{ inputs.fixture_sha }}
          FIXTURE_TASK: ${{ inputs.fixture_task_digest }}
          FIXTURE_PATH: ${{ inputs.fixture_path }}
          FIXTURE_MARKER: ${{ inputs.fixture_marker }}
        run: |
          python3 - <<'EOF'
          import base64, hashlib, json, os, re, urllib.request
          sha, task, path, marker = [os.environ[k] for k in ('FIXTURE_SHA','FIXTURE_TASK','FIXTURE_PATH','FIXTURE_MARKER')]
          assert re.fullmatch('[0-9a-f]{40}', sha) and re.fullmatch('[0-9a-f]{64}', task)
          assert re.fullmatch('roadmap-[12]\.txt', path)
          assert marker == '# ROADMAP_' + path[8] + '_PASS'
          req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/contents/' + path + '?ref=' + sha,
            headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response: blob=json.load(response)
          assert blob['type']=='file' and blob['encoding']=='base64' and blob['size'] < 1024
          data=base64.b64decode(blob['content'])
          assert data == (marker + '\n').encode()
          receipt=dict(schema_version=1,authority_semantics='ISOLATED_ROADMAP_FIXTURE_NOT_PRODUCT_EVIDENCE',
            candidate_sha=sha,task_digest=task,path=path,marker=marker,content_sha256=hashlib.sha256(data).hexdigest(),
            release_sha=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),result='PASS')
          open('roadmap-fixture-receipt.json','w').write(json.dumps(receipt,sort_keys=True))
          EOF
      - name: Upload isolated hosted observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roadmap-fixture-${{ inputs.fixture_task_digest }}
          path: roadmap-fixture-receipt.json
          if-no-files-found: error
          retention-days: 90
