name: Desktop release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built DMG as a GitHub release
        type: boolean
        default: false
  # This workflow runs only when a release is cut. Packaging is proven on the
  # owner's machines first (macOS, a Windows host and a Debian host), because a
  # hosted rehearsal on every pull request cost more runner time than the
  # failures it caught. One pull request through the gate and one tag run are
  # the only CI calls a release makes.
  push:
    tags:
      - 'v*'

# The desktop package carries the same LGPL-only FFmpeg profile the platform
# verification builds; these arguments are kept identical on purpose so a
# packaged build and a verified build cannot drift. Keep them in step with
# `.github/workflows/platform-verification.yml`.
env:
  FFMPEG_COMMON_CONFIGURE_ARGS: >-
    --disable-static
    --enable-shared
    --disable-programs
    --disable-doc
    --disable-autodetect
    --disable-everything
    --disable-asm
    --disable-avdevice
    --disable-avfilter
    --enable-protocol=file
    --enable-demuxer=matroska,mov,wav,mp3,ogg,flac,aiff,avi,image2,image2pipe,png_pipe,jpeg_pipe,webp_pipe
    --enable-muxer=matroska,mov,mp4
    --enable-decoder=ffv1,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,pcm_s24be,pcm_s16be,h264,hevc,av1,vp8,vp9,prores,aac,mp3,mp3float,opus,vorbis,flac,alac,ac3,eac3,mpeg4,png,mjpeg,webp
    --enable-parser=h264,hevc,av1,vp8,vp9,vorbis,flac,ac3,mpegaudio,aac,mp3
    --enable-encoder=ffv1,pcm_s16le
  FFMPEG_HELPER_CONFIGURE_ARGS: >-
    --enable-ffmpeg
    --enable-ffprobe
    --enable-avfilter
    --enable-zlib
    --enable-protocol=pipe
    --enable-encoder=png
    --enable-encoder=mpeg4
    --enable-muxer=image2
    --enable-muxer=image2pipe
    --enable-filter=scale
    --enable-filter=setpts
    --enable-filter=format
    --enable-filter=aformat
    --enable-filter=aresample
    --enable-filter=showwavespic
    --enable-filter=afftdn
    --enable-muxer=wav
  FFMPEG_EXPORT_CONFIGURE_ARGS: >-
    --pkg-config-flags=--static
    --enable-libvpx
    --enable-libopus
    --enable-muxer=webm
    --enable-encoder=libvpx_vp9,libopus,aac

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  # A release run must finish once it starts: the tag already points at it.
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify on a fresh Apple Silicon runner
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Install Flutter 3.47.5
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install FFmpeg build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake nasm pkg-config xz

      - name: Build pinned LGPL FFmpeg 8.1.3 runtime
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/ffmpeg-install"
          scripts/stage_macos_ffmpeg.sh --prefix "$prefix" --work "$RUNNER_TEMP/ffmpeg-build"
          mkdir -p apps/or_app/.dart_tool
          ln -sfn "$prefix" apps/or_app/.dart_tool/macos-ffmpeg-install
          echo "OR_FFMPEG_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Analyze and test the app
        working-directory: apps/or_app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Test the IPC and bridge contracts
        shell: bash
        env:
          DYLD_LIBRARY_PATH: ${{ env.FFMPEG_DIR }}/lib
        run: |
          cargo test -p or_ipc
          cargo test -p or_app_bridge --lib
          cargo test -p or_media --lib

      - name: Build pinned local transcription runtime
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/whisper.cpp-1.9.4"
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git "$source"
          test "$(git -C "$source" rev-parse HEAD)" = 927cfce34f31707e17f2bff35c349632fb9e2c3a
          cmake -S "$source" -B "$source/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF
          cmake --build "$source/build" --config Release --target whisper-cli -j 2
          cargo build --locked --release -p or_whisper_provider
          "$source/build/bin/whisper-cli" --version
          echo "OR_WHISPER_CLI_PATH=$source/build/bin/whisper-cli" >> "$GITHUB_ENV"
          echo "OR_WHISPER_PROVIDER_PATH=$GITHUB_WORKSPACE/target/release/or-whisper-provider" >> "$GITHUB_ENV"
          echo "OR_WHISPER_LICENSE_PATH=$source/LICENSE" >> "$GITHUB_ENV"

      - name: Build the Apple Silicon disk image
        shell: bash
        run: |
          set -euo pipefail
          scripts/build_macos_dmg.sh
          (cd dist && shasum -a 256 ./*.dmg > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          ls -lh dist/*.dmg dist/SHA256SUMS.txt

      - name: Upload the disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencut-reinforced-macos-arm64
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          retention-days: 14

  linux:
    name: Build and verify on a fresh Ubuntu runner
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake desktop-file-utils dpkg-dev \
            libclang-dev libasound2-dev libva-dev libdrm-dev nasm ninja-build \
            pkg-config patchelf xz-utils libgtk-3-dev liblzma-dev zlib1g-dev xvfb \
            xauth python3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Install Flutter 3.47.5
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build pinned VP9 and Opus codec sources
        timeout-minutes: 35
        run: |
          set -euo pipefail
          bash scripts/build_desktop_export_codecs.sh linux \
            "$RUNNER_TEMP/ffmpeg-codecs-install" \
            "$RUNNER_TEMP/desktop-export-codecs"

      - name: Build and stage the FFmpeg 8.1.3 delivery libraries
        id: ffmpeg-build
        timeout-minutes: 30
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          source="$RUNNER_TEMP/ffmpeg-8.1.3"
          prefix="$RUNNER_TEMP/ffmpeg-8.1.3-install"
          curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 --max-time 600 \
            https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz --output "$archive"
          echo "acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1  $archive" | sha512sum --check
          xz --test "$archive"
          tar -xJOf "$archive" ffmpeg-8.1.3/COPYING.LGPLv2.1 > "$RUNNER_TEMP/FFmpeg-COPYING.LGPLv2.1"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$source"
          read -r -a common_configure_args <<< "$FFMPEG_COMMON_CONFIGURE_ARGS"
          read -r -a helper_configure_args <<< "$FFMPEG_HELPER_CONFIGURE_ARGS"
          read -r -a export_configure_args <<< "$FFMPEG_EXPORT_CONFIGURE_ARGS"
          # Linux has no operating-system H.264 encoder (VideoToolbox and Media
          # Foundation are macOS and Windows only), so delivery links the pinned
          # x264 build from scripts/build_desktop_export_codecs.sh.
          export_configure_args+=(--enable-gpl --enable-libx264 --enable-encoder=libx264)
          # NVENC comes from the pinned headers: the driver library loads at run
          # time, so the package stays self-contained and the export probe falls
          # back to x264 on a machine without an NVIDIA device.
          export_configure_args+=(--enable-ffnvcodec --enable-nvenc --enable-encoder=h264_nvenc)
          # VAAPI drives Intel and AMD devices on Linux. libva is a normal system
          # library, so the package declares it as a dependency instead of
          # bundling a driver that only matches one GPU generation.
          export_configure_args+=(--enable-vaapi --enable-hwaccel=h264_vaapi --enable-encoder=h264_vaapi)
          configure_args=("--prefix=$prefix" "${common_configure_args[@]}" "${helper_configure_args[@]}" "${export_configure_args[@]}")
          ./configure "${configure_args[@]}"
          make -j2
          make install
          # Exercise helper operations against a generated fixture; textual
          # capability listings alone do not prove the tools work.
          test -x "$prefix/bin/ffmpeg"
          test -x "$prefix/bin/ffprobe"
          python3 "$GITHUB_WORKSPACE/scripts/verify_ffmpeg_helpers.py" \
            --bin "$prefix/bin" \
            --lib "$prefix/lib" \
            --media "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny.mkv" \
            --image "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny_still.png" \
            --image "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny_still.jpg" \
            --image "$GITHUB_WORKSPACE/crates/or_media/tests/fixtures/tiny_still.webp" \
            --work "$RUNNER_TEMP/ffmpeg-helper-capability-check"
          # Phase 4's noise filter is verified by measuring the floor it removes,
          # not by finding its name in a listing.
          python3 "$GITHUB_WORKSPACE/scripts/measure_denoise.py" \
            --bin "$prefix/bin" \
            --work "$RUNNER_TEMP/ffmpeg-denoise-measurement"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          # Cargo config reaches Rust build scripts through Flutter's isolated
          # native-assets hook, so the lane and CI share one writer.
          bash "$GITHUB_WORKSPACE/scripts/configure_linux_cargo_for_ffmpeg.sh" "$prefix"
          for library in avcodec avformat avutil swresample swscale; do
            test -f "$prefix/lib/pkgconfig/lib$library.pc"
          done
          echo "FFMPEG_INSTALL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"
          for library in avcodec avformat avutil swresample swscale; do
            pkg-config --modversion "lib$library"
            test "$(pkg-config --variable=prefix "lib$library")" = "$prefix"
          done
          {
            echo "Target: Linux $(uname -m)"
            echo "FFmpeg release: 8.1.3"
            echo "Rust binding: ffmpeg-the-third 6.0.0"
            echo "Official source URL: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
            echo "Official upstream tag commit: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7"
            echo "Source archive SHA-512: acc7dbacde58c91bbc4a86fa589d317515d40bc9bc1ca5f9c020034bb54bf3c8cd61ed70ce437b962bd50332ea8378b3ad52da1942cfdb29e380c33a90d2f0c1"
            echo "Patch status: unpatched upstream release archive"
            echo 'Packaging modifications: copied shared libraries have ELF RUNPATH set to $ORIGIN; preserved install prefix remains unchanged'
            echo "Configure arguments: ${configure_args[*]}"
            echo "Enabled libraries: libavcodec, libavformat, libavutil, libswresample, libswscale"
            echo "Enabled programs: ffmpeg, ffprobe (9B1 packaged media helpers)"
            echo "Enabled protocols: file, pipe"
            echo "Enabled demuxers: matroska, mov, image2, image2pipe, png_pipe, jpeg_pipe, webp_pipe"
            echo "Enabled decoders: ffv1, pcm_s16le, h264, aac, mp3, vp9, opus, png, mjpeg, webp"
            echo "Enabled parsers: h264, aac"
            echo "Enabled encoders: ffv1, pcm_s16le, png, mpeg4"
            echo "Delivery encoders: libvpx-vp9, libopus and libx264, statically linked from pinned upstream sources"
            echo "Licence note: libx264 is GPL-2.0-or-later and is linked into this Linux FFmpeg build only"
            echo "libvpx configure target: $LIBVPX_CONFIGURE_TARGET"
            echo "Enabled muxers: matroska, webm, image2, image2pipe"
            echo "Enabled filters: setpts, scale, format, aformat, aresample, showwavespic"
            echo "License posture: LGPL 2.1-or-later except the Linux x264 link, which makes this build GPL-2.0-or-later; version3 and nonfree were not enabled"
            cat "$RUNNER_TEMP/desktop-export-codecs/EXPORT-CODEC-SOURCES.txt"
            echo "Compiler: $(cc --version | head -n 1)"
            echo "Build tools: $(make --version | head -n 1); $(pkg-config --version)"
            echo "Rust toolchain: $(rustc --version)"
            echo "Runtime library names:"
            find "$prefix/lib" -maxdepth 1 \( -type f -o -type l \) \( -name 'libav*.so*' -o -name 'libsw*.so*' \) -exec basename {} \; | sort
          } > "$RUNNER_TEMP/FFMPEG-BUILD-INFO.txt"
          cat "$RUNNER_TEMP/FFMPEG-BUILD-INFO.txt"
          tar -czf "$RUNNER_TEMP/ffmpeg-8.1.3-install.tar.gz" -C "$RUNNER_TEMP" ffmpeg-8.1.3-install

      - name: Build the or CLI and the speech adapter
        env:
          FFMPEG_DIR: ${{ runner.temp }}/ffmpeg-8.1.3-install
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib/pkgconfig
        run: |
          set -euo pipefail
          cargo build --locked --release -p or_cli
          cargo build --locked --release -p or_whisper_provider

      - name: Build the production media probe
        env:
          FFMPEG_DIR: ${{ runner.temp }}/ffmpeg-8.1.3-install
          LD_LIBRARY_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg-8.1.3-install/lib/pkgconfig
        run: cargo build --locked --release --manifest-path tools/ffmpeg-link-probe/Cargo.toml

      - name: Seed the packaged media runtime
        run: |
          set -euo pipefail
          prefix="$FFMPEG_INSTALL_PREFIX"
          runtime="$RUNNER_TEMP/or-packaged-media-runtime"
          mkdir -p "$runtime/lib"
          install -m 755 "$prefix/bin/ffmpeg" "$runtime/ffmpeg"
          install -m 755 "$prefix/bin/ffprobe" "$runtime/ffprobe"
          # The suffix is a glob by design: it must expand to the matching files.
          # shellcheck disable=SC2086
          for pattern in libavcodec.so* libavfilter.so* libavformat.so* libavutil.so* libswresample.so* libswscale.so*; do
            cp -a "$prefix/lib/"$pattern "$runtime/lib/"
          done
          echo "OR_PACKAGED_MEDIA_RUNTIME_DIRECTORY=$runtime" >> "$GITHUB_ENV"

      - name: Build the release Linux bundle
        working-directory: apps/or_app
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          LD_LIBRARY_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
          OR_PACKAGED_MEDIA_RUNTIME_DIRECTORY: ${{ runner.temp }}/or-packaged-media-runtime
        run: flutter build linux --release --no-pub

      - name: Stage FFmpeg, the speech runtime and the or CLI beside the app
        env:
          OR_REQUIRE_RUNTIME: '1'
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/apps/or_app/build/linux/x64/release/bundle"
          bridge="$(find "$bundle" -type f -name '*or_app_bridge*.so' -print -quit)"
          test -n "$bridge"
          runtime_dir="$(dirname "$bridge")"
          probe_source="$GITHUB_WORKSPACE/tools/ffmpeg-link-probe/target/release/ffmpeg-link-probe"
          install -m 755 "$probe_source" "$runtime_dir/ffmpeg-link-probe"
          # The suffix is a glob by design: it must expand to the matching files.
          # shellcheck disable=SC2086
          for pattern in libavcodec.so* libavformat.so* libavutil.so* libswresample.so* libswscale.so* libavfilter.so*; do
            cp -a "$FFMPEG_INSTALL_PREFIX/lib/"$pattern "$runtime_dir/"
          done
          for library in "$runtime_dir"/libav*.so* "$runtime_dir"/libsw*.so*; do
            if [ -L "$library" ]; then continue; fi
            patchelf --set-rpath '$ORIGIN' "$library"
          done
          install -m 755 "$FFMPEG_INSTALL_PREFIX/bin/ffmpeg" "$bundle/ffmpeg"
          install -m 755 "$FFMPEG_INSTALL_PREFIX/bin/ffprobe" "$bundle/ffprobe"
          helper_rpath='$ORIGIN/'"$(realpath --relative-to="$bundle" "$runtime_dir")"
          patchelf --set-rpath "$helper_rpath" "$bundle/ffmpeg" "$bundle/ffprobe"
          env -u LD_LIBRARY_PATH "$bundle/ffprobe" -hide_banner -version
          env -u LD_LIBRARY_PATH "$bundle/ffmpeg" -hide_banner -encoders | grep -q " png "
          # One stager stages the optional runtime on every platform.
          python3 scripts/stage_desktop_runtime.py --os linux \
            --runtime-dir "$bundle" --repo-root "$GITHUB_WORKSPACE" \
            --require whisper,provider,or --download-whisper
          env -u LD_LIBRARY_PATH "$bundle/whisper-cli" --help >/dev/null
          # `or version` is the bootstrap verb; `--version` is not a verb and
          # exits 2, so it would report a staged runtime as broken.
          env -u LD_LIBRARY_PATH "$bundle/or" version
          echo "OR_PACKAGED_BRIDGE_DIRECTORY=$runtime_dir" >> "$GITHUB_ENV"

      - name: Stage the third-party notices
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/apps/or_app/build/linux/x64/release/bundle"
          bash scripts/stage_codec_licences.sh stage "$bundle" \
            "$RUNNER_TEMP/FFmpeg-COPYING.LGPLv2.1" "$RUNNER_TEMP/desktop-export-codecs"
          bash scripts/stage_codec_licences.sh verify "$bundle"

      - name: Build the Debian package
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/apps/or_app/build/linux/x64/release/bundle"
          bash scripts/package_linux_deb.sh "$bundle" \
            "$RUNNER_TEMP/Opencut-Reinforced-linux-x64.deb" "$GITHUB_SHA"
          bash scripts/test_linux_deb_install.sh "$RUNNER_TEMP/Opencut-Reinforced-linux-x64.deb"

      - name: Upload the Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencut-reinforced-linux-x64
          path: ${{ runner.temp }}/Opencut-Reinforced-linux-x64.deb
          retention-days: 14

  windows:
    name: Build and verify on a fresh Windows runner
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Set up MSYS2 FFmpeg build tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          path-type: inherit
          update: true
          cache: false
          install: make pkgconf
          pacboy: clang:p nasm:p

      - name: Build pinned VP9 and Opus codec sources
        shell: msys2 {0}
        timeout-minutes: 35
        run: |
          set -euo pipefail
          temp="$(cygpath -u "$RUNNER_TEMP")"
          bash scripts/build_desktop_export_codecs.sh windows \
            "$temp/ffmpeg-codecs-install" \
            "$temp/desktop-export-codecs"

      - name: Build pinned static zlib for Windows FFmpeg helpers
        shell: pwsh
        run: ./scripts/build_windows_zlib.ps1 -BuildRoot $env:RUNNER_TEMP

      - name: Install Flutter 3.47.5
        shell: pwsh
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ((git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD).Trim() -ne "6a19cca56475dbfba1478ee68d7bd0c2ef891da1") { throw "Flutter revision mismatch" }
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version

      - name: Resolve Flutter dependencies
        working-directory: apps/or_app
        run: flutter pub get

      - name: Build and stage LGPL-only FFmpeg 8.1.3 shared libraries
        shell: msys2 {0}
        timeout-minutes: 40
        run: bash scripts/build_windows_ffmpeg.sh

      - name: Build the or CLI and the speech adapter
        shell: msys2 {0}
        env:
          FFMPEG_DIR: ${{ env.FFMPEG_INSTALL_PREFIX }}
          PKG_CONFIG_PATH: ${{ env.FFMPEG_INSTALL_PREFIX }}/lib/pkgconfig
        run: |
          set -euo pipefail
          # MSYS2 prepends its own /usr/bin/link, which is not the MSVC linker;
          # put the MSVC bin directory first so rustc links the Windows targets.
          msvc_linker_dir="$(cygpath -u "$VCToolsInstallDir")"
          msvc_linker_dir="${msvc_linker_dir%/}/bin/Hostx64/x64"
          export PATH="$msvc_linker_dir:$PATH"
          test "$(command -v link.exe)" = "$msvc_linker_dir/link.exe"
          cargo build --locked --release -p or_cli
          cargo build --locked --release -p or_whisper_provider

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Build, stage and archive the release bundle
        shell: pwsh
        env:
          OR_REQUIRE_RUNTIME: '1'
        run: ./scripts/run_windows_lane.ps1 -Mode release -Steps probe,build,stage,zip,installer

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencut-reinforced-windows-x64
          path: |
            apps/or_app/build/windows/or-windows-x64-release.zip
            apps/or_app/build/windows/Opencut-Reinforced-*-windows-x64-setup.exe
          retention-days: 14

  publish:
    name: Publish every desktop asset
    needs: [build, linux, windows]
    # A tag always publishes; a manual dispatch publishes when asked; a pull
    # request never publishes.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the built assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Normalize names and checksum every asset
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' apps/or_app/pubspec.yaml | head -1)"
          cd dist
          rm -f SHA256SUMS.txt
          for file in *.deb; do mv "$file" "Opencut-Reinforced-${version}-linux-x64.deb"; done
          for file in *.zip; do mv "$file" "Opencut-Reinforced-${version}-windows-x64.zip"; done
          ls -l
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' apps/or_app/pubspec.yaml | head -1)"
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != v* ]]; then tag="v${version}"; fi
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Opencut Reinforced $version ships the same feature set on macOS, Linux and Windows."
            echo
            echo "## Install"
            echo "- macOS (Apple Silicon): open the DMG, drag **Opencut Reinforced** into"
            echo "  Applications, then right-click the app once and choose **Open**."
            echo "- Windows: run \`Opencut-Reinforced-${version}-windows-x64-setup.exe\`."
            echo "  It installs for the current user only, so it needs no administrator"
            echo "  prompt. The archive stays available as an unzip-and-run portable build."
            echo "- Linux: \`sudo apt install ./Opencut-Reinforced-${version}-linux-x64.deb\`."
            echo
            echo "## What is included"
            echo "FFmpeg 8.1.3, the local speech runtime (Whisper), the or CLI and the app"
            echo "workspace are bundled on every platform. macOS and Windows ship the LGPL"
            echo "FFmpeg; the Linux build links x264 (GPL-2.0-or-later) so MP4 delivery"
            echo "encodes there too, and its licence ships in \`licenses/x264\`."
            echo "MP4 (H.264 + AAC) and WebM export work on all three platforms. Speech"
            echo "models and an assistant harness stay optional downloads."
            echo
            echo "## Optional tools"
            echo "Settings -> External tools installs the speech runtime, finds or links"
            echo "an assistant harness, and runs a local TTS server without a terminal."
            echo
            echo "## Verify the download"
            echo "SHA256SUMS.txt covers every asset in this release."
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "Opencut Reinforced $version" \
              --notes-file "$notes"
          fi
