<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>Opencut Reinforced — UI Prototype</title>
  <style>
    :root {
      --or-bg: #090909;
      --or-bg-raised: #0f0f10;
      --or-surface: #151516;
      --or-surface-hover: #1c1c1e;
      --or-border: #2a2a2d;
      --or-border-strong: #3a3a3e;
      --or-text: #f5f5f5;
      --or-text-secondary: #a6a6ab;
      --or-text-muted: #85858b;
      --or-primary: #f5f5f5;
      --or-primary-text: #090909;
      --or-selection: #3fc7ff;
      --or-ai: #9b7cff;
      --or-success: #47b881;
      --or-warning: #d8a542;
      --or-danger: #e05a5a;
      --radius-sm: 6px;
      --radius-control: 8px;
      --radius-card: 10px;
      --radius-panel: 12px;
      --radius-modal: 14px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --topbar-height: 58px;
      --sidebar-width: 224px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: var(--or-text);
      background: var(--or-bg);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; min-height: 100%; background: var(--or-bg); }
    body { color: var(--or-text); }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--or-selection);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: .48; }
    a { color: inherit; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .muted { color: var(--or-text-muted); }
    .secondary { color: var(--or-text-secondary); }
    .eyebrow { color: var(--or-text-muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .small { font-size: 12px; }
    .hidden { display: none !important; }
    .prototype-badge { padding: 4px 7px; border: 1px solid var(--or-border); border-radius: 5px; color: var(--or-text-secondary); font-size: 10px; line-height: 1; white-space: nowrap; }

    .icon { display: inline-block; width: 16px; height: 16px; flex: 0 0 auto; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 14px; height: 14px; }
    .icon-lg { width: 20px; height: 20px; }
    .app-shell { min-height: 100vh; }
    .appbar {
      position: fixed; inset: 0 0 auto; z-index: 30; height: var(--topbar-height);
      display: flex; align-items: center; gap: 14px; padding: 0 18px;
      background: rgba(15, 15, 16, .97); border-bottom: 1px solid var(--or-border);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 205px; text-decoration: none; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--or-border-strong); border-radius: 7px; font-size: 13px; font-weight: 750; letter-spacing: -.08em; }
    .brand-name { font-size: 13px; font-weight: 650; letter-spacing: -.01em; }
    .appbar-divider { width: 1px; height: 24px; background: var(--or-border); }
    .appbar-project { display: flex; align-items: center; gap: 8px; color: var(--or-text-secondary); font-size: 13px; }
    .appbar-spacer { flex: 1; }
    .save-state { display: inline-flex; align-items: center; gap: 6px; color: var(--or-text-muted); font-size: 11px; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--or-success); }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .top-actions .mobile-top-action { display: none; }
    .view-switch { display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--or-border); border-radius: 8px; background: var(--or-bg); }
    .view-switch button { border: 0; border-radius: 5px; background: transparent; padding: 5px 8px; color: var(--or-text-muted); font-size: 11px; cursor: pointer; }
    .view-switch button[aria-pressed="true"] { background: var(--or-surface-hover); color: var(--or-text); }
    .sidebar {
      position: fixed; top: var(--topbar-height); bottom: 0; left: 0; z-index: 20; width: var(--sidebar-width);
      display: flex; flex-direction: column; padding: 13px 10px 14px; overflow-y: auto;
      background: var(--or-bg-raised); border-right: 1px solid var(--or-border);
    }
    .nav-group { margin: 3px 0 10px; }
    .nav-heading { padding: 9px 10px 6px; color: var(--or-text-muted); font-size: 10px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; }
    .nav-link { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 7px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--or-text-secondary); text-align: left; cursor: pointer; }
    .nav-link:hover { background: var(--or-surface); color: var(--or-text); }
    .nav-link[aria-current="page"] { background: #202022; color: var(--or-text); }
    .nav-link[aria-current="page"] .icon { color: var(--or-text); }
    .nav-link .nav-label { flex: 1; }
    .nav-pill { color: var(--or-text-muted); font-size: 10px; }
    .sidebar-bottom { margin-top: auto; padding: 12px 9px 2px; border-top: 1px solid var(--or-border); }
    .sidebar-bottom .prototype-badge { display: inline-block; margin-bottom: 8px; }

    .main { min-height: 100vh; margin-left: var(--sidebar-width); padding: calc(var(--topbar-height) + 22px) 24px 36px; }
    .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
    .page-head-copy { min-width: 0; flex: 1; }
    .page-title { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 650; letter-spacing: -.035em; }
    .page-subtitle { margin: 6px 0 0; color: var(--or-text-secondary); font-size: 12px; }
    .page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .workspace { min-width: 0; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px;
      padding: 7px 11px; border: 1px solid var(--or-border-strong); border-radius: var(--radius-control);
      background: var(--or-surface); color: var(--or-text); font-size: 12px; font-weight: 550; cursor: pointer;
      transition: background .12s ease, border-color .12s ease;
    }
    .btn:hover { background: var(--or-surface-hover); border-color: #55555b; }
    .btn-primary { background: var(--or-primary); color: var(--or-primary-text); border-color: var(--or-primary); font-weight: 650; }
    .btn-primary:hover { background: #dedee1; border-color: #dedee1; }
    .btn-ghost { border-color: transparent; background: transparent; color: var(--or-text-secondary); }
    .btn-ghost:hover { border-color: var(--or-border); background: var(--or-surface); color: var(--or-text); }
    .btn-danger { color: var(--or-danger); }
    .btn-compact { min-height: 28px; padding: 5px 8px; font-size: 11px; }
    .icon-button { width: 32px; height: 32px; display: inline-grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--or-text-secondary); cursor: pointer; }
    .icon-button:hover { background: var(--or-surface-hover); color: var(--or-text); }
    .text-link { border: 0; background: transparent; padding: 0; color: var(--or-text-secondary); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .panel { min-width: 0; border: 1px solid var(--or-border); border-radius: var(--radius-panel); background: var(--or-bg-raised); }
    .panel-head { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--or-border); }
    .panel-head h2, .panel-head h3 { flex: 1; margin: 0; font-size: 13px; font-weight: 620; }
    .panel-body { padding: 15px; }
    .section-block { margin-top: 20px; }
    .section-title-row { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; }
    .section-title-row h2, .section-title-row h3 { margin: 0; font-size: 14px; font-weight: 620; }
    .section-title-row .push { margin-left: auto; }
    .divider { height: 1px; background: var(--or-border); margin: 15px 0; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .row-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .push { margin-left: auto; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label, .field-label { color: var(--or-text-secondary); font-size: 11px; font-weight: 550; }
    .input, .select, .textarea {
      width: 100%; min-height: 35px; padding: 8px 10px; border: 1px solid var(--or-border-strong); border-radius: 7px;
      background: #0c0c0d; color: var(--or-text); font-size: 12px;
    }
    .textarea { min-height: 76px; resize: vertical; line-height: 1.5; }
    .input::placeholder, .textarea::placeholder { color: #6e6e74; }
    .range-row { display: grid; grid-template-columns: minmax(80px, 1fr) 130px 42px; align-items: center; gap: 10px; min-height: 35px; }
    input[type="range"] { width: 100%; accent-color: var(--or-text); }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--or-text); }
    .switch { appearance: none; position: relative; width: 34px; height: 19px; border: 1px solid var(--or-border-strong); border-radius: 20px; background: #242426; cursor: pointer; }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #a6a6ab; transition: transform .14s ease; }
    .switch:checked { background: #e5e5e8; border-color: #e5e5e8; }
    .switch:checked::after { background: #101011; transform: translateX(15px); }
    .toggle-row { display: flex; align-items: center; gap: 12px; min-height: 36px; }
    .toggle-row .toggle-copy { flex: 1; min-width: 0; }
    .toggle-row strong { display: block; font-size: 12px; font-weight: 550; }
    .toggle-row small { display: block; margin-top: 3px; color: var(--or-text-muted); font-size: 10px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border: 1px solid var(--or-border); border-radius: 5px; color: var(--or-text-secondary); font-size: 10px; white-space: nowrap; }
    .chip.semantic-selection { border-color: rgba(63,199,255,.55); color: var(--or-selection); }
    .chip.semantic-ai { border-color: rgba(155,124,255,.48); color: #b8a5ff; }
    .chip.semantic-warning { border-color: rgba(216,165,66,.5); color: var(--or-warning); }
    .chip.semantic-success { border-color: rgba(71,184,129,.45); color: var(--or-success); }
    .badge { display: inline-flex; align-items: center; padding: 3px 6px; border-radius: 5px; background: #222224; color: var(--or-text-secondary); font-size: 10px; }
    .empty-state { display: grid; justify-items: center; gap: 8px; padding: 28px 15px; text-align: center; color: var(--or-text-secondary); }
    .empty-state strong { color: var(--or-text); font-size: 13px; }
    .empty-state p { margin: 0; max-width: 340px; font-size: 11px; line-height: 1.5; }

    .quick-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .project-card { overflow: hidden; border: 1px solid var(--or-border); border-radius: var(--radius-card); background: var(--or-bg-raised); }
    .project-cover { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 7; background: #141415; border-bottom: 1px solid var(--or-border); color: #73737a; }
    .project-cover::before { content: ""; position: absolute; inset: 0; }
    .project-cover .icon { position: relative; width: 28px; height: 28px; }
    .project-cover-meta { position: absolute; inset: auto 9px 8px; display: flex; justify-content: space-between; color: #a6a6ab; font-size: 10px; }
    .project-card-body { padding: 11px; }
    .project-title-row { display: flex; align-items: center; gap: 7px; }
    .project-title-row strong { flex: 1; overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .project-meta { display: flex; flex-wrap: wrap; gap: 7px 11px; margin-top: 7px; color: var(--or-text-muted); font-size: 10px; }
    .project-card-actions { display: flex; gap: 4px; margin-top: 8px; }
    .project-list { width: 100%; border-collapse: collapse; }
    .project-list th { padding: 9px 8px; border-bottom: 1px solid var(--or-border); color: var(--or-text-muted); text-align: left; font-size: 10px; font-weight: 550; }
    .project-list td { padding: 10px 8px; border-bottom: 1px solid var(--or-border); color: var(--or-text-secondary); font-size: 11px; }
    .project-list tr:last-child td { border-bottom: 0; }
    .project-list .project-name { color: var(--or-text); font-weight: 550; }
    .project-list-wrap { overflow-x: auto; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-chip { padding: 6px 9px; border: 1px solid var(--or-border); border-radius: 6px; background: transparent; color: var(--or-text-secondary); font-size: 11px; cursor: pointer; }
    .filter-chip[aria-pressed="true"] { background: #252527; color: var(--or-text); border-color: var(--or-border-strong); }
    .search-wrap { position: relative; min-width: 180px; flex: 1; max-width: 280px; }
    .search-wrap .icon { position: absolute; top: 10px; left: 10px; color: var(--or-text-muted); }
    .search-wrap .input { padding-left: 32px; }

    .editor-top { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--or-border); border-radius: 10px 10px 0 0; background: var(--or-bg-raised); }
    .editor-grid { display: grid; grid-template-columns: minmax(155px, 190px) minmax(260px, 1fr) minmax(205px, 255px); min-height: 350px; border: 1px solid var(--or-border); border-top: 0; background: var(--or-bg-raised); }
    .editor-panel { min-width: 0; overflow: hidden; border-right: 1px solid var(--or-border); }
    .editor-panel:last-child { border-right: 0; }
    .editor-panel-header { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 8px 10px; border-bottom: 1px solid var(--or-border); }
    .editor-panel-header strong { flex: 1; font-size: 11px; font-weight: 600; }
    .editor-panel-content { padding: 9px; }
    .media-mini { display: flex; align-items: center; gap: 8px; padding: 7px 5px; border-bottom: 1px solid #202022; cursor: pointer; }
    .media-mini:hover { background: var(--or-surface); }
    .file-tile { display: grid; place-items: center; width: 35px; height: 29px; flex: 0 0 auto; border: 1px solid var(--or-border); border-radius: 5px; background: #1b1b1d; color: var(--or-text-muted); }
    .media-mini-copy { min-width: 0; flex: 1; }
    .media-mini-copy strong { display: block; overflow: hidden; color: var(--or-text); font-size: 10px; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
    .media-mini-copy small { display: block; margin-top: 3px; color: var(--or-text-muted); font-size: 9px; }
    .preview-area { display: flex; min-width: 0; flex-direction: column; }
    .preview-mock { position: absolute; inset: 15%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.14); background: #2d2d30; }
    .preview-mock::before, .preview-mock::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.13); }
    .preview-mock::before { inset: 14%; }
    .preview-mock::after { width: 22%; aspect-ratio: 1; border-radius: 50%; }
    .preview-label { position: absolute; bottom: 8px; left: 9px; color: rgba(255,255,255,.65); font: 10px ui-monospace, monospace; }
    .safe-guides .preview-mock { outline: 1px dashed rgba(255,255,255,.4); outline-offset: -22px; }
    .transport { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 6px; border-top: 1px solid var(--or-border); }
    .transport .time-display { margin: 0 10px; color: var(--or-text-secondary); font: 10px ui-monospace, monospace; }
    .inspector-section { padding: 10px 0; border-bottom: 1px solid var(--or-border); }
    .inspector-section:last-child { border-bottom: 0; }
    .inspector-section h4 { margin: 0 0 7px; color: var(--or-text-secondary); font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; }
    .inspector-control { display: grid; grid-template-columns: 52px 1fr 32px; align-items: center; gap: 5px; margin: 5px 0; color: var(--or-text-muted); font-size: 9px; }
    .inspector-control input { width: 100%; min-width: 0; height: 26px; padding: 4px 5px; border: 1px solid var(--or-border); border-radius: 5px; background: #0c0c0d; color: var(--or-text); font-size: 10px; }
    .editor-tools { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border: 1px solid var(--or-border); border-top: 0; background: var(--or-bg-raised); }
    .tool-btn { display: inline-flex; align-items: center; gap: 5px; min-height: 29px; padding: 5px 7px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--or-text-secondary); font-size: 10px; cursor: pointer; }
    .tool-btn:hover, .tool-btn[aria-pressed="true"] { border-color: var(--or-border); background: var(--or-surface); color: var(--or-text); }
    .timeline { overflow: hidden; border: 1px solid var(--or-border); border-top: 0; border-radius: 0 0 10px 10px; background: #101011; }
    .timeline-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--or-border); }
    .timeline-head strong { font-size: 11px; }
    .timeline-scroller { position: relative; max-height: 300px; overflow: auto; }
    .timeline-ruler { position: sticky; top: 0; z-index: 4; display: flex; height: 23px; margin-left: 68px; border-bottom: 1px solid var(--or-border); background: #141415; color: var(--or-text-muted); font: 9px ui-monospace, monospace; }
    .ruler-mark { flex: 0 0 90px; padding: 5px 5px; border-left: 1px solid var(--or-border); }
    .track-row { position: relative; display: flex; min-height: 40px; border-bottom: 1px solid #262628; }
    .track-row:last-child { border-bottom: 0; }
    .track-label { position: sticky; left: 0; z-index: 3; display: flex; align-items: center; gap: 4px; width: 68px; flex: 0 0 68px; padding: 4px; border-right: 1px solid var(--or-border); background: #151516; }
    .track-label strong { flex: 1; color: var(--or-text-secondary); font-size: 9px; }
    .track-label button { width: 18px; height: 20px; padding: 0; border: 0; background: transparent; color: var(--or-text-muted); cursor: pointer; font-size: 9px; }
    .track-lane { position: relative; min-width: 470px; flex: 1; min-height: 40px; background-image: linear-gradient(to right, transparent 89px, #232325 90px); background-size: 90px 100%; }
    .clip { position: absolute; top: 5px; display: flex; align-items: center; min-width: 42px; height: 29px; overflow: hidden; padding: 4px 7px; border: 1px solid #55555a; border-radius: 5px; background: #333336; color: #efeff1; font-size: 9px; white-space: nowrap; cursor: pointer; user-select: none; }
    .clip:hover { background: #3b3b3f; }
    .clip.selected { outline: 1px solid var(--or-selection); border-color: var(--or-selection); }
    .clip.ai-clip::after { content: "AI"; margin-left: auto; padding-left: 5px; color: #b8a5ff; font-size: 8px; }
    .clip.audio-clip { background: #29292b; border-color: #66666b; }
    .clip.text-clip { background: #353536; }
    .playhead { position: absolute; top: 22px; bottom: 0; left: 68px; z-index: 5; width: 1px; background: var(--or-selection); pointer-events: none; }
    .playhead::before { content: ""; position: absolute; top: -1px; left: -4px; width: 9px; height: 7px; background: var(--or-selection); clip-path: polygon(0 0,100% 0,50% 100%); }
    .timeline-zoom { display: flex; align-items: center; gap: 7px; width: 155px; }
    .mobile-editor { display: none; }

    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .asset-card { min-width: 0; padding: 9px; border: 1px solid var(--or-border); border-radius: 8px; background: var(--or-bg-raised); }
    .asset-thumb { display: grid; place-items: center; height: 84px; margin-bottom: 8px; border: 1px solid var(--or-border); border-radius: 6px; background: #1a1a1c; color: #77777d; }
    .asset-card strong { display: block; overflow: hidden; font-size: 11px; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
    .asset-card small { display: block; margin-top: 4px; color: var(--or-text-muted); font-size: 9px; }
    .asset-card .row { margin-top: 7px; }
    .caption-row { display: grid; grid-template-columns: 112px 1fr auto; align-items: center; gap: 9px; padding: 9px; border-bottom: 1px solid var(--or-border); }
    .caption-row:last-child { border-bottom: 0; }
    .caption-time { color: var(--or-text-muted); font: 9px ui-monospace, monospace; }
    .caption-row input { min-width: 0; width: 100%; padding: 7px 8px; border: 1px solid var(--or-border); border-radius: 5px; background: #0c0c0d; color: var(--or-text); font-size: 11px; }
    .meter { height: 5px; overflow: hidden; border-radius: 5px; background: #29292b; }
    .meter > span { display: block; height: 100%; background: #bfc0c3; transition: width .25s ease; }
    .terminal { overflow: hidden; border: 1px solid var(--or-border); border-radius: 9px; background: #090909; }
    .terminal-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--or-border); color: var(--or-text-muted); font-size: 10px; }
    .terminal-body { min-height: 190px; max-height: 310px; overflow: auto; padding: 11px; color: #d6d6d8; font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .terminal-line { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .terminal-prompt { color: var(--or-text); }

    function runCli(raw) {
      const command = raw.trim();
      if (!command) return;
      let output = "";
      const parts = command.split(/\s+/);
      if (parts[0] !== "or") output = "error: enter a command beginning with 'or'";
      else if (parts[1] === "help" || !parts[1]) output = "version [--json]\nhealth [--json]\ncapabilities [--json]\nproject inspect [--json]\ntimeline list\nselection get";
      else if (parts[1] === "version") output = parts.includes("--json") ? JSON.stringify({name:"Opencut Reinforced",version:"0.1.0-prototype",architecture_api_version:1},null,2) : "Opencut Reinforced 0.1.0-prototype · API 1";
      else if (parts[1] === "health") output = parts.includes("--json") ? JSON.stringify({status:"ready",source:"simulated"},null,2) : "Ready · simulated";
      else if (parts[1] === "capabilities") output = parts.includes("--json") ? JSON.stringify([{id:"core.info",availability:"Demo"},{id:"core.health",availability:"Demo"},{id:"project.read",availability:"Planned"},{id:"timeline.edit",availability:"Planned"}],null,2) : "core.info · Demo\ncore.health · Demo\nproject.read · Planned\ntimeline.edit · Planned";
      else if (parts[1] === "project" && parts[2] === "inspect") output = parts.includes("--json") ? JSON.stringify({project:activeProject().name,duration:62.4,tracks:state.tracks.length,source:"mock"},null,2) : activeProject().name + " · 01:02 · " + state.tracks.length + " tracks · mock";
      else if (parts[1] === "timeline" && parts[2] === "list") output = JSON.stringify(state.tracks.map(track=>({track:track.name,clips:track.clips.map(clip=>clip.name)})),null,2);
      else if (parts[1] === "selection" && parts[2] === "get") output = JSON.stringify(getClip(state.selectedClipId) ? getClip(state.selectedClipId).clip : null,null,2);
      else output = "error: unknown command; try 'or help'";
      state.terminalLog.push({input:command,output:output});
      if (state.terminalLog.length>30) state.terminalLog.shift();
      render();
      const terminal = $("#terminal-body");
      if (terminal) terminal.scrollTop = terminal.scrollHeight;
      const input = $("#terminal-input");
      if (input) input.focus();
    }

        if(type==="left")state.leftPanelWidth=Math.max(190,Math.min(390,state.leftPanelWidth+(event.key==="ArrowRight"?12:-12)));
        if(type==="inspector")state.inspectorWidth=Math.max(220,Math.min(390,state.inspectorWidth+(event.key==="ArrowLeft"?12:-12)));
        if(type==="timeline")state.timelineHeight=Math.max(145,Math.min(430,state.timelineHeight+(event.key==="ArrowUp"?12:-12)));
        render();
      }
    });
    function openPalette() {
      state.paletteCommands=[
        {label:"New Project",action:"new-project"},
        {label:"Open Projects",action:"navigate",view:"projects"},
        {label:"Import Media",action:"import-media"},
        {label:"Open Templates",action:"navigate",view:"templates"},
        {label:"Create Template",action:"create-template"},
        {label:"Open Asset Library",action:"navigate",view:"assets"},
        {label:"Add Text",action:"open-editor-tool",tool:"Text"},
        {label:"Auto Captions",action:"open-editor-tool",tool:"Captions"},
        {label:"Translate & Dub",action:"open-editor-tool",tool:"Translate"},
        {label:"Generate Voiceover",action:"open-editor-tool",tool:"Voiceover"},
        {label:"Open Effects",action:"open-editor-tool",tool:"Effects"},
        {label:"Add Adjustment Layer",action:"add-adjustment-layer"},
        {label:"Create Snapshot",action:"snapshot-create"},
        {label:"Cinema Mode",action:"viewer-only"},
        {label:"Export",action:"navigate",view:"export"},
        {label:"Open Agent Hub",action:"navigate",view:"agents"},
        {label:"Open CLI",action:"navigate",view:"agents",agentTab:"CLI"},
        {label:"Manage Models",action:"navigate",view:"settings",section:"AI & Models"},
        {label:"Manage Downloads",action:"download-manager"},
        {label:"Open Settings",action:"navigate",view:"settings"},
        {label:"Advanced / Developer",action:"navigate",view:"settings",section:"Advanced / Developer"}
      ];
      const content='<div class="field"><label for="palette-search">Search navigation, tools, templates, assets, commands, and settings</label><input id="palette-search" class="input" placeholder="Type a workflow…" autocomplete="off"></div><div id="palette-results" class="palette-results"></div>';
      openModal("Command Palette",content,"","palette");
      filterPalette();
      const input=$("#palette-search");if(input)input.addEventListener("input",filterPalette);
    }
    function filterPalette() {
      const query=(($("#palette-search")||{}).value||"").trim().toLowerCase();
      const entries=(state.paletteCommands||[]).map(item=>({label:item.label,action:item.action,view:item.view,tool:item.tool,section:item.section,agentTab:item.agentTab,id:item.id,kind:"command"}))
        .filter(item=>!query||item.label.toLowerCase().includes(query));
      if(query){
        state.templates.filter(item=>(item.name+" "+item.category+" "+item.creator).toLowerCase().includes(query)).slice(0,8).forEach(item=>entries.push({label:"Template · "+item.name,action:"template-details",id:item.id,kind:"template"}));
        state.assets.filter(item=>(item.name+" "+item.category+" "+item.creator).toLowerCase().includes(query)).slice(0,10).forEach(item=>entries.push({label:"Asset · "+item.name,action:"asset-details",id:item.id,kind:"asset"}));
      }
      state.paletteMatches=entries.slice(0,24);
      const results=$("#palette-results");if(!results)return;
      results.innerHTML=state.paletteMatches.map((item,index)=>'<button class="palette-item" data-action="palette-run" data-index="'+index+'" '+(item.view?'data-view="'+esc(item.view)+'"':'')+(item.tool?' data-tool="'+esc(item.tool)+'"':'')+(item.section?' data-section="'+esc(item.section)+'"':'')+(item.agentTab?' data-agent-tab="'+esc(item.agentTab)+'"':'')+(item.id?' data-id="'+esc(item.id)+'"':'')+'><span>'+esc(item.label)+'</span><kbd class="chip">'+(query?"Enter":"↵")+'</kbd></button>').join("")||'<div class="empty-state"><strong>No matching commands</strong><p>Search tools, project content, or settings.</p></div>';
    }
    document.addEventListener("dblclick",event=>{
      if(event.target.closest(".viewer-canvas")&&!event.target.closest(".viewer-focus-button"))handleAction("viewer-focus",{});
    });
    document.addEventListener("dragstart",event=>{
      const clip=event.target.closest(".clip");if(clip&&event.dataTransfer){event.dataTransfer.setData("text/plain",clip.dataset.id);event.dataTransfer.effectAllowed="move";}
    });
    document.addEventListener("dragover",event=>{if(event.target.closest("[data-drop-track]"))event.preventDefault();});
    document.addEventListener("drop",event=>{
      const lane=event.target.closest("[data-drop-track]");if(!lane)return;event.preventDefault();
      const found=getClip(event.dataTransfer.getData("text/plain"));if(!found)return;
      const targetTrack=state.tracks.find(item=>item.id===lane.dataset.dropTrack);if(!targetTrack||targetTrack.locked){toast("Track is locked");return;}
      pushHistory();const clip=found.clip;found.track.clips=found.track.clips.filter(item=>item.id!==clip.id);clip.start=Math.max(0,(event.offsetX||0)/(18*state.zoom));targetTrack.clips.push(clip);state.selectedClipId=clip.id;markChanged();render();toast("Moved clip in the mock timeline");
    });
    document.addEventListener("click",event=>{
      if(state.mobileInspector&&event.target.matches(".mobile-inspector-backdrop")){state.mobileInspector=false;render();}
    });
    function updateModalInspector() {
      if(!state.mobileInspector) {
        $$(".mobile-inspector, .mobile-inspector-backdrop").forEach(node=>node.remove());
        return;
      }
      $$(".mobile-inspector, .mobile-inspector-backdrop").forEach(node=>node.remove());
      const host=document.createElement("div");
      host.innerHTML='<div class="mobile-inspector-backdrop" aria-hidden="true"></div><section class="mobile-inspector"><div class="panel-head"><h2>Clip tools</h2><button class="icon-button" data-action="mobile-inspector" aria-label="Close clip tools">'+icon("close")+'</button></div><div class="panel-body">'+renderInspector()+'<div class="row-wrap section-block">'+btn("Duplicate","duplicate-clip","btn-compact")+btn("Delete","delete-clip","btn-compact btn-danger")+'</div></div></section>';
      document.body.appendChild(host.firstElementChild);
      document.body.appendChild(host.lastElementChild);
    }
    const originalRender=render;
    render=function(){originalRender();updateModalInspector();};
    render();
  </script>
</body>
</html>
