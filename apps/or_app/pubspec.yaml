name: or_app
description: Opencut Reinforced application shell.
publish_to: none
version: 0.1.3+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  file_selector: ^1.1.0
  or_app_bridge:
    path: ../../packages/or_app_bridge
  or_viewer_texture:
    path: ../../packages/or_viewer_texture
  path_provider: ^2.1.6

hooks:
  user_defines:
    or_app_bridge:
      android_ffmpeg_install_root: android/.ffmpeg-install
      macos_ffmpeg_install_root: .dart_tool/macos-ffmpeg-install

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/agent_workspace/bundle.json
