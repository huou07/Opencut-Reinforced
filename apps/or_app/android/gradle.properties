org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Bound the dependency fetch. Gradle's default HTTP timeouts are unlimited, so a
# stalled download from the Flutter engine repository hangs `assembleDebug`
# with no output and no CPU use. Measured 2026-10-18 on the Debian workstation:
# the x86_64_debug engine artifact (120 MB) took ~5 minutes at ~0.4 MB/s, which
# looked exactly like a hang. A slow fetch that keeps streaming still succeeds
# inside these limits; a genuinely stalled one now fails loudly inside the
# lane's bounded apk step instead of outliving it.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=120000
