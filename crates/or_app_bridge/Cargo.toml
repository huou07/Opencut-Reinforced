[package]
name = "or_app_bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
or_core = { path = "../or_core" }
or_ai = { path = "../or_ai" }
or_ipc = { path = "../or_ipc" }
or_runtime = { path = "../or_runtime" }
uuid = "=1.26.1"
sha2 = { version = "=0.11.0", default-features = false }
serde_json = "1.0.151"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "android"))'.dependencies]
or_audio = { path = "../or_audio" }
or_media = { path = "../or_media" }
or_motion = { path = "../or_motion" }
or_render = { path = "../or_render" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
ndk-context = "=0.1.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
# The materialisation test builds its scene through the real code-to-scene path and
# serialises it, rather than hand-writing JSON that can drift from the schema.
serde_json = "1.0.151"
