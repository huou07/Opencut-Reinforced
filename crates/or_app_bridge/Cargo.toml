[package]
name = "or_app_bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
or_core = { path = "../or_core" }
or_ipc = { path = "../or_ipc" }
or_runtime = { path = "../or_runtime" }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "android"))'.dependencies]
or_audio = { path = "../or_audio" }
or_media = { path = "../or_media" }
or_render = { path = "../or_render" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
