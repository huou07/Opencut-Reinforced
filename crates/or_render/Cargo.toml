[package]
name = "or_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
or_core = { path = "../or_core" }
or_runtime = { path = "../or_runtime" }
# wgpu 25.0.2 is the newest pinned release compatible with the workspace MSRV
# (Rust 1.85); its upstream license is MIT OR Apache-2.0.
wgpu = { version = "=25.0.2", default-features = false, features = [
    "wgsl",
    "vulkan",
    "gles",
    "dx12",
    "metal",
] }
