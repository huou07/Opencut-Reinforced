[package]
name = "or_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
or_core = { path = "../or_core" }
or_runtime = { path = "../or_runtime" }
# wgpu 25.0.2 is the pinned render backend; its upstream license is MIT OR Apache-2.0.
wgpu = { version = "=30.0.1", default-features = false, features = [
    "wgsl",
    "vulkan",
    "gles",
    "dx12",
    "metal",
] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
